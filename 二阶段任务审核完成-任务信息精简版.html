 style=\"opacity: 0.5; cursor: not-allowed;\" disabled>\n                                        <i class=\"fas fa-trash-alt\"></i>批量删除\n                                    </button>\n                                </div>\n                            </div>\n                            <div class=\"site-activity-container\" id=\"activityContainer-site2\">\n                                <!-- 动态生成活动行 -->\n                            </div>\n                        </div>\n                    </div>\n                </div>\n            </div>\n        </div>\n\n    </main>\n\n        <div class=\"signature-preview-mask\" id=\"signatureFilePreviewModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"signatureFilePreviewTitle\">\n            <div class=\"signature-preview-card\">\n                <div class=\"signature-preview-header\">\n                    <div>\n                        <div class=\"signature-preview-title\" id=\"signatureFilePreviewTitle\"><i class=\"fas fa-file-pdf\"></i>审核计划签章文件预览</div>\n                        <div class=\"signature-preview-subtitle\">根据当前审核计划内容生成，含线上签章记录与 3 个个人签章印。</div>\n                    </div>\n                    <div class=\"signature-preview-actions\">\n                        <button type=\"button\" class=\"sign-preview-action\" id=\"signaturePreviewDownload\"><i class=\"fas fa-download\"></i>下载</button>\n                        <button type=\"button\" class=\"sign-modal-close\" id=\"signaturePreviewClose\" aria-label=\"关闭\"><i class=\"fas fa-times\"></i></button>\n                    </div>\n                </div>\n                <iframe id=\"signaturePreviewFrame\" class=\"signature-preview-frame\" title=\"审核计划签章文件预览\"></iframe>\n            </div>\n        </div>\n        <div class=\"signature-preview-toast\" id=\"signaturePreviewToast\"><i class=\"fas fa-check-circle\"></i><span id=\"signaturePreviewToastText\"></span></div>\n\n\n    <script>\n        // 审核组人员数据\n        const auditTeam = [\n            { id: 'wurg', name: '武荣刚', maxHours: 32, color: '#3b82f6', current: 0 },\n            { id: 'whw', name: '王洪伟', maxHours: 16, color: '#10b981', current: 0 },\n            { id: 'zhangli', name: '张丽', maxHours: 16, color: '#f59e0b', current: 0 },\n            { id: 'liuna', name: '刘娜', maxHours: 16, color: '#8b5cf6', current: 0 },\n            { id: 'chenming', name: '陈明', maxHours: 16, color: '#06b6d4', current: 0 },\n            { id: 'zhaoqiang', name: '赵强', maxHours: 16, color: '#ef4444', current: 0 }\n        ];\n        // 每个场所仅展示上一审核任务已下发到该场所的人员\n        const siteAuditorAssignments = {\n            hq: ['wurg', 'whw', 'chenming'],\n            site1: ['zhangli', 'liuna', 'zhaoqiang'],\n            site2: ['wurg', 'liuna', 'chenming', 'zhaoqiang']\n        };\n\n        // 场所数据\n        const sitesData = {\n            hq: { name: '总部', type: '总部', address: '北京市西城区北礼士路甲38号', scopes: ['QMS', 'EMS'], staff: 200 },\n            site1: { name: '运营一分公司', type: '场所', address: '北京市东城区建国门南大街5号', scopes: ['QMS'], staff: 180 },\n            site2: { name: '运营二分公司', type: '场所', address: '北京市朝阳区望京北路9号', scopes: ['OHSMS', 'EMS'], staff: 150 }\n        };\n\n        // 初始化\n        document.addEventListener('DOMContentLoaded', function() {\n            addActivityRow('hq', { date: '2024-04-15', startTime: '09:00', endTime: '11:00', auditors: ['wurg'], process: '管理体系范围、方针目标及职责权限', dept: '最高管理者/中心职能' });\n            addActivityRow('hq', { date: '2024-04-15', startTime: '13:30', endTime: '15:30', auditors: ['whw'], process: 'QMS过程控制与文件记录', dept: '质量管理部/中心职能' });\n            addActivityRow('site1', { date: '2024-04-16', startTime: '09:00', endTime: '11:00', auditors: ['zhangli'], process: 'EMS运行控制及合规性评价', dept: '运营一分公司' });\n            addActivityRow('site1', { date: '2024-04-16', startTime: '13:30', endTime: '15:30', auditors: ['liuna'], process: '职业健康安全风险管控', dept: '运营一分公司' });\n            addActivityRow('site2', { date: '2024-04-17', startTime: '09:00', endTime: '11:00', auditors: ['chenming'], process: '环境因素识别与运行绩效监视', dept: '运营二分公司' });\n            addActivityRow('site2', { date: '2024-04-17', startTime: '13:30', endTime: '15:30', auditors: ['zhaoqiang'], process: '现场应急准备与响应', dept: '运营二分公司' });\n        });\n\n        // 班次行生成\n        function updateShiftRows() {\n            const count = parseInt(document.getElementById('shiftCount').value);\n            const container = document.getElementById('shiftContainer');\n            const existingRows = container.querySelectorAll('.shift-row');\n            const currentCount = existingRows.length;\n            \n            let hourOptions = '';\n            for (let i = 0; i < 24; i++) {\n                hourOptions += `<option value=\"${i}\">${String(i).padStart(2, '0')}</option>`;\n            }\n            \n            let minuteOptions = `\n                <option value=\"0\">00</option>\n                <option value=\"15\">15</option>\n                <option value=\"30\">30</option>\n                <option value=\"45\">45</option>\n            `;\n            \n            if (count > currentCount) {\n                for (let i = currentCount + 1; i <= count; i++) {\n                    const row = document.createElement('div');\n                    row.className = 'shift-row';\n                    row.dataset.shift = i;\n                    row.innerHTML = `\n                        <span class=\"shift-label\">第${i}班次</span>\n                        <div class=\"shift-time-group\">\n                            <select class=\"time-select hour-select\" onchange=\"calculateShiftDuration(${i})\">\n                                ${hourOptions}\n                            </select>\n                            <span class=\"shift-separator\">:</span>\n                            <select class=\"time-select minute-select\" onchange=\"calculateShiftDuration(${i})\">\n                                ${minuteOptions}\n                            </select>\n                            <span class=\"shift-separator\">-</span>\n                            <select class=\"time-select hour-select\" onchange=\"calculateShiftDuration(${i})\">\n                                ${hourOptions}\n                            </select>\n                            <span class=\"shift-separator\">:</span>\n                            <select class=\"time-select minute-select\" onchange=\"calculateShiftDuration(${i})\">\n                                ${minuteOptions}\n                            </select>\n                        </div>\n                        <span class=\"shift-duration\" id=\"shift${i}Duration\">0小时0分钟</span>\n                    `;\n                    container.appendChild(row);\n                }\n            } else if (count < currentCount) {\n                for (let i = currentCount - 1; i >= count; i--) {\n                    existingRows[i].remove();\n                }\n            }\n            \n            for (let i = 1; i <= count; i++) {\n                const row = document.querySelector(`.shift-row[data-shift=\"${i}\"]`);\n                if (row) {\n                    const selects = row.querySelectorAll('select');\n                    selects[0].value = 8;\n                    selects[2].value = 17;\n                    calculateShiftDuration(i);\n                }\n            }\n        }\n\n        function calculateShiftDuration(shiftNum) {\n            const row = document.querySelector(`.shift-row[data-shift=\"${shiftNum}\"]`);\n            if (!row) return;\n            \n            const selects = row.querySelectorAll('select');\n            const startH = parseInt(selects[0].value) || 0;\n            const startM = parseInt(selects[1].value) || 0;\n            const endH = parseInt(selects[2].value) || 0;\n            const endM = parseInt(selects[3].value) || 0;\n            \n            let start = startH * 60 + startM;\n            let end = endH * 60 + endM;\n            \n            if (end < start) end += 24 * 60;\n            \n            const duration = end - start;\n            const hours = Math.floor(duration / 60);\n            const mins = duration % 60;\n            \n            const display = document.getElementById(`shift${shiftNum}Duration`);\n            if (display) {\n                display.textContent = `${hours}小时${mins}分钟`;\n            }\n        }\n\n        function toggleCriteriaCheckbox(checkboxId) {\n            event.stopPropagation();\n            const checkbox = document.getElementById(checkboxId);\n            checkbox.checked = !checkbox.checked;\n            toggleCriteriaField(checkboxId.replace('criteria-', ''));\n        }\n\n        function toggleCriteriaItem(item, event) {\n            if (item.id === 'criteria-item-standard') return;\n            \n            item.classList.toggle('expanded');\n            \n            if (event && !event.target.closest('.criteria-checkbox-wrapper')) {\n                const checkbox = item.querySelector('.criteria-checkbox');\n                if (!checkbox.disabled) {\n                    checkbox.checked = !checkbox.checked;\n                    const type = checkbox.id.replace('criteria-', '');\n                    const input = document.getElementById(`input-${type}`);\n                    if (input) {\n                        if (checkbox.checked) {\n                            input.parentElement.style.maxHeight = '200px';\n                            input.parentElement.style.padding = '0 16px 16px 48px';\n                            item.classList.add('active');\n                        } else {\n                            input.parentElement.style.maxHeight = '0';\n                            input.parentElement.style.padding = '0 16px 0 48px';\n                            input.value = '';\n                            item.classList.remove('active');\n                        }\n                    }\n                }\n            }\n        }\n\n        function toggleCriteriaField(type) {\n            const checkbox = document.getElementById(`criteria-${type}`);\n            const item = document.getElementById(`criteria-item-${type}`);\n            const input = document.getElementById(`input-${type}`);\n            \n            if (checkbox.checked) {\n                item.classList.add('expanded', 'active');\n            } else {\n                item.classList.remove('expanded', 'active');\n                item.querySelectorAll('input, textarea, select').forEach(control => {\n                    control.value = '';\n                });\n            }\n        }\n\n        function addActivityRow(siteId, data = null) {\n            const container = document.getElementById(`activityContainer-${siteId}`);\n            const rowId = `${siteId}_act_${Date.now()}`;\n            \n            const div = document.createElement('div');\n            div.className = 'activity-row';\n            div.dataset.rowId = rowId;\n            div.dataset.site = siteId;\n            \n            const date = data?.date || '2024-04-15';\n            const startTime = data?.startTime || '09:00';\n            const endTime = data?.endTime || '12:00';\n                        const allowedAuditorIds = siteAuditorAssignments[siteId] || auditTeam.map(t => t.id);\n            const allowedAuditors = allowedAuditorIds.map(id => auditTeam.find(a => a.id === id)).filter(Boolean);\n            const auditors = (data?.auditors || []).filter(aid => allowedAuditorIds.includes(aid));\n            const process = data?.process || '';\n            const dept = data?.dept || '';\n\n            div.innerHTML = `\n                <div style=\"display: flex; align-items: center; justify-content: center;\">\n                    <input type=\"checkbox\" class=\"row-checkbox criteria-checkbox\" style=\"width: 18px; height: 18px;\" data-row-id=\"${rowId}\" data-site=\"${siteId}\" onchange=\"updateSiteBatchDeleteBtn('${siteId}')\">\n                </div>\n                <div>\n                    <input type=\"date\" class=\"form-input\" value=\"${date}\" min=\"2024-04-15\" max=\"2024-04-18\" style=\"width: 110px;\" onchange=\"updateAuditStats()\">\n                </div>\n                <div class=\"flex items-center gap-1\">\n                    <select class=\"form-select time-select\" style=\"width: 65px;\" onchange=\"updateAuditStats()\">\n                        ${generateTimeOptions(startTime)}\n                    </select>\n                    <span class=\"text-slate-400\">-</span>\n                    <select class=\"form-select time-select\" style=\"width: 65px;\" onchange=\"updateAuditStats()\">\n                        ${generateTimeOptions(endTime)}\n                    </select>\n                </div>\n                <div class=\"auditor-select-container\">\n                    <div class=\"auditor-tags\" onclick=\"showAuditorDropdown('${rowId}')\" id=\"tags-${rowId}\">\n                        ${auditors.map(aid => {\n                            const auditor = allowedAuditors.find(a => a.id === aid);\n                            return auditor ? `<span class=\"auditor-tag\" data-id=\"${aid}\">${auditor.name}<span class=\"remove\" onclick=\"removeAuditor('${rowId}', '${aid}', event)\">×</span></span>` : '';\n                        }).join('') || '<span class=\"text-slate-400 text-xs px-1\">点击选择人员...</span>'}\n                    </div>\n                    <div class=\"auditor-dropdown\" id=\"dropdown-${rowId}\">\n                        ${allowedAuditors.map(t => `\n                            <div class=\"auditor-option\" onclick=\"selectAuditor('${rowId}', '${t.id}')\">\n                                <span class=\"auditor-color\" style=\"background: ${t.color};\"></span>\n                                <span>${t.name} (${t.maxHours}h)</span>\n                            </div>\n                        `).join('')}\n                    </div>\n                </div>\n                <div>\n                    <input type=\"text\" class=\"form-input\" value=\"${process}\" placeholder=\"如：组织环境 4.1-4.4\" style=\"width: 100%;\">\n                </div>\n                <div>\n                    <input type=\"text\" class=\"form-input\" value=\"${dept}\" placeholder=\"如：管理层/中心职能\" style=\"width: 100%;\">\n                </div>\n                <div>\n                    <button type=\"button\" class=\"btn btn-danger btn-xs\" onclick=\"removeActivityRow('${rowId}', '${siteId}')\">\n                        <i class=\"fas fa-trash\"></i>删除\n                    </button>\n                </div>\n            `;\n            \n            container.appendChild(div);\n            updateAuditStats();\n        }\n\n        function generateTimeOptions(selectedTime = '09:00') {\n            let html = '';\n            for (let h = 0; h < 24; h++) {\n                for (let m of ['00', '15', '30', '45']) {\n                    const time = `${String(h).padStart(2, '0')}:${m}`;\n                    const selected = time === selectedTime ? 'selected' : '';\n                    html += `<option value=\"${time}\" ${selected}>${time}</option>`;\n                }\n            }\n            return html;\n        }\n\n        function showAuditorDropdown(rowId) {\n            // 先关闭所有其他下拉框\n            document.querySelectorAll('.auditor-dropdown').forEach(d => {\n                if (d.id !== `dropdown-${rowId}`) d.classList.remove('show');\n            });\n            document.querySelectorAll('.activity-row.dropdown-active, .auditor-select-container.dropdown-active').forEach(el => {\n                el.classList.remove('dropdown-active');\n            });\n            \n            const dropdown = document.getElementById(`dropdown-${rowId}`);\n            const row = document.querySelector(`[data-row-id=\"${rowId}\"]`);\n            const container = dropdown?.closest('.auditor-select-container');\n            dropdown.classList.toggle('show');\n            const isOpen = dropdown.classList.contains('show');\n            row?.classList.toggle('dropdown-active', isOpen);\n            container?.classList.toggle('dropdown-active', isOpen);\n            \n            const closeDropdown = (e) => {\n                if (!e.target.closest(`#tags-${rowId}`) && !e.target.closest(`#dropdown-${rowId}`)) {\n                    dropdown.classList.remove('show');\n                    row?.classList.remove('dropdown-active');\n                    container?.classList.remove('dropdown-active');\n                    document.removeEventListener('click', closeDropdown);\n                }\n            };\n            setTimeout(() => document.addEventListener('click', closeDropdown), 0);\n        }\n\n        function selectAuditor(rowId, auditorId) {\n            const tagsContainer = document.getElementById(`tags-${rowId}`);\n            const row = document.querySelector(`[data-row-id=\"${rowId}\"]`);\n            const allowedAuditorIds = siteAuditorAssignments[row?.dataset.site] || auditTeam.map(t => t.id);\n            if (!allowedAuditorIds.includes(auditorId)) return;\n            const auditor = auditTeam.find(a => a.id === auditorId);\n            \n            if (tagsContainer.querySelector(`[data-id=\"${auditorId}\"]`)) return;\n            \n            const placeholder = tagsContainer.querySelector('.text-slate-400');\n            if (placeholder) placeholder.remove();\n            \n            const tag = document.createElement('span');\n            tag.className = 'auditor-tag';\n            tag.dataset.id = auditorId;\n            tag.innerHTML = `${auditor.name}<span class=\"remove\" onclick=\"removeAuditor('${rowId}', '${auditorId}', event)\">×</span>`;\n            tagsContainer.appendChild(tag);\n            \n            updateAuditStats();\n        }\n\n        function removeAuditor(rowId, auditorId, event) {\n            event.stopPropagation();\n            const tagsContainer = document.getElementById(`tags-${rowId}`);\n            const tag = tagsContainer.querySelector(`[data-id=\"${auditorId}\"]`);\n            if (tag) tag.remove();\n            \n            if (tagsContainer.children.length === 0) {\n                tagsContainer.innerHTML = '<span class=\"text-slate-400 text-xs px-1\">点击选择人员...</span>';\n            }\n            \n            updateAuditStats();\n        }\n\n        function removeActivityRow(rowId, siteId) {\n            const row = document.querySelector(`[data-row-id=\"${rowId}\"]`);\n            if (row) {\n                row.remove();\n                updateAuditStats();\n                updateSiteBatchDeleteBtn(siteId);\n            }\n        }\n\n        function updateAuditStats() {\n            auditTeam.forEach(t => t.current = 0);\n            const siteStats = { hq: 0, site1: 0, site2: 0 };\n            \n            document.querySelectorAll('.activity-row').forEach(row => {\n                const siteId = row.dataset.site;\n                const timeSelects = row.querySelectorAll('.time-select');\n                const start = timeSelects[0]?.value;\n                const end = timeSelects[1]?.value;\n                \n                if (start && end) {\n                    const [sh, sm] = start.split(':').map(Number);\n                    const [eh, em] = end.split(':').map(Number);\n                    let duration = (eh * 60 + em) - (sh * 60 + sm);\n                    if (duration < 0) duration += 24 * 60;\n                    const hours = duration / 60;\n                    \n                    const tags = row.querySelectorAll('.auditor-tag');\n                    tags.forEach(tag => {\n                        const auditorId = tag.dataset.id;\n                        const auditor = auditTeam.find(a => a.id === auditorId);\n                        if (auditor) {\n                            auditor.current += hours;\n                            siteStats[siteId] += hours;\n                        }\n                    });\n                }\n            });\n            \n            auditTeam.forEach(t => {\n                const el = document.getElementById(`stat-${t.id}`);\n                if (el) {\n                    el.textContent = t.current.toFixed(1);\n                    el.className = 'stat-value ' + (t.current > t.maxHours ? 'warning' : '');\n                }\n            });\n            \n            Object.keys(siteStats).forEach(siteId => {\n                const el = document.getElementById(`site-days-${siteId}`);\n                if (el) {\n                    el.textContent = (siteStats[siteId] / 8).toFixed(1);\n                }\n            });\n        }\n\n        function handleSiteExcelUpload(event, siteId) {\n            const file = event.target.files[0];\n            if (!file) return;\n            \n            const reader = new FileReader();\n            reader.onload = function(e) {\n                try {\n                    const data = new Uint8Array(e.target.result);\n                    const workbook = XLSX.read(data, {type: 'array'});\n                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];\n                    const jsonData = XLSX.utils.sheet_to_json(firstSheet);\n                    \n                    const container = document.getElementById(`activityContainer-${siteId}`);\n                    container.innerHTML = '';\n                    \n                    jsonData.forEach(row => {\n                        const auditors = (row['审核人员'] || '').split(/[，,]/).map(s => {\n                            const name = s.trim();\n                            const found = auditTeam.find(a => a.name === name);\n                            return found ? found.id : '';\n                        }).filter(id => id);\n                        \n                        addActivityRow(siteId, {\n                            date: row['日期'] || '2024-04-15',\n                            startTime: row['开始时间'] || '09:00',\n                            endTime: row['结束时间'] || '12:00',\n                            auditors: auditors,\n                            process: row['过程或活动'] || '',\n                            dept: row['部门/场所'] || ''\n                        });\n                    });\n                    \n                    updateAuditStats();\n                    showToast(`成功导入 ${jsonData.length} 条记录到${sitesData[siteId].name}`);\n                } catch (err) {\n                    showToast('Excel解析失败，请检查文件格式', 'error');\n                }\n            };\n            reader.readAsArrayBuffer(file);\n            event.target.value = '';\n        }\n\n        function toggleSection(header) {\n            const content = header.nextElementSibling;\n            const icon = header.querySelector('.fa-chevron-down');\n            \n            if (content.style.maxHeight === '0px') {\n                content.style.maxHeight = '2000px';\n                content.style.overflow = 'visible';\n                content.style.padding = '';\n                if (icon) icon.style.transform = 'rotate(0deg)';\n            } else {\n                content.style.maxHeight = '0px';\n                content.style.overflow = 'hidden';\n                content.style.padding = '0 20px';\n                if (icon) icon.style.transform = 'rotate(-90deg)';\n            }\n        }\n\n        function savePlan() {\n            showToast('审核计划已保存为草稿');\n        }\n\n        function submitPlan() {\n            const rows = document.querySelectorAll('.activity-row');\n            if (rows.length === 0) {\n                showToast('请至少添加一条审核活动', 'error');\n                document.getElementById('section-activity').scrollIntoView({ behavior: 'smooth' });\n                return;\n            }\n            \n            const exceeded = auditTeam.filter(t => t.current > t.maxHours);\n            if (exceeded.length > 0) {\n                showToast(`${exceeded.map(e => e.name).join(',')} 的审核时长已超出最大可用时间`, 'error');\n                return;\n            }\n            \n            if (confirm('确定要提交审核计划吗？提交后将进入审批流程。')) {\n                showToast('审核计划已提交');\n            }\n        }\n\n        function toggleSiteSelectAll(siteId) {\n            const checkbox = document.querySelector(`.site-card[data-site-id=\"${siteId}\"] .select-all-site`);\n            const rowCheckboxes = document.querySelectorAll(`#activityContainer-${siteId} .row-checkbox`);\n            \n            rowCheckboxes.forEach(cb => {\n                cb.checked = checkbox.checked;\n            });\n            \n            updateSiteBatchDeleteBtn(siteId);\n        }\n\n        function updateSiteBatchDeleteBtn(siteId) {\n            const checkedBoxes = document.querySelectorAll(`#activityContainer-${siteId} .row-checkbox:checked`);\n            const btn = document.querySelector(`.batch-delete-site[data-site=\"${siteId}\"]`);\n            \n            if (checkedBoxes.length > 0) {\n                btn.disabled = false;\n                btn.style.opacity = '1';\n                btn.style.cursor = 'pointer';\n                btn.innerHTML = `<i class=\"fas fa-trash-alt\"></i>批量删除(${checkedBoxes.length})`;\n            } else {\n                btn.disabled = true;\n                btn.style.opacity = '0.5';\n                btn.style.cursor = 'not-allowed';\n                btn.innerHTML = `<i class=\"fas fa-trash-alt\"></i>批量删除`;\n            }\n        }\n\n        function batchDeleteSiteRows(siteId) {\n            const checkedBoxes = document.querySelectorAll(`#activityContainer-${siteId} .row-checkbox:checked`);\n            \n            if (checkedBoxes.length === 0) {\n                showToast('请先选择要删除的活动', 'warning');\n                return;\n            }\n            \n            if (confirm(`确定要删除选中的 ${checkedBoxes.length} 条活动记录吗？`)) {\n                checkedBoxes.forEach(cb => {\n                    const rowId = cb.dataset.rowId;\n                    const row = document.querySelector(`[data-row-id=\"${rowId}\"]`);\n                    if (row) row.remove();\n                });\n                \n                document.querySelector(`.site-card[data-site-id=\"${siteId}\"] .select-all-site`).checked = false;\n                updateSiteBatchDeleteBtn(siteId);\n                updateAuditStats();\n                \n                showToast(`已成功删除 ${checkedBoxes.length} 条活动记录`);\n            }\n        }\n\n        function showToast(message, type = 'success') {\n            const toast = document.createElement('div');\n            const bgColor = type === 'error' ? 'bg-red-600' : type === 'warning' ? 'bg-amber-500' : 'bg-green-600';\n            const icon = type === 'error' ? 'fa-exclamation-circle' : type === 'warning' ? 'fa-exclamation-triangle' : 'fa-check-circle';\n            \n            toast.className = `fixed top-24 left-1/2 transform -translate-x-1/2 ${bgColor} text-white px-6 py-3 rounded-lg shadow-2xl z-50 flex items-center gap-2 transition-all duration-300 opacity-0`;\n            toast.innerHTML = `<i class=\"fas ${icon}\"></i><span>${message}</span>`;\n            \n            document.body.appendChild(toast);\n            setTimeout(() => toast.classList.remove('opacity-0'), 10);\n            setTimeout(() => {\n                toast.classList.add('opacity-0');\n                setTimeout(() => toast.remove(), 300);\n            }, 3000);\n        }\n    __COMBINED_SCRIPT_CLOSE__\n\n<script id=\"SIGNATURE_FILE_PREVIEW_SCRIPT\">\n        // SIGNATURE_FILE_PREVIEW_START\n        (function () {\n            var signatureNodes = [\n                { title: '组长', role: '审核组长', signer: '武荣刚', signedAt: '2024-04-12 09:32:18' },\n                { title: '项目管理', role: '项目管理', signer: '周静', signedAt: '2024-04-12 10:05:46' },\n                { title: '客户', role: '客户代表', signer: '刘海峰', signedAt: '2024-04-12 11:18:32' }\n            ];\n\n            function escapeHtml(value) {\n                return String(value == null ? '' : value)\n                    .replace(/&/g, '&amp;')\n                    .replace(/</g, '&lt;')\n                    .replace(/>/g, '&gt;')\n                    .replace(/\"/g, '&quot;')\n                    .replace(/'/g, '&#39;');\n            }\n\n            function normalizeText(value) {\n                return String(value == null ? '' : value)\n                    .replace(/\\u00a0/g, ' ')\n                    .replace(/\\s+/g, ' ')\n                    .replace(/^\\s+|\\s+$/g, '');\n            }\n\n            function controlValue(control) {\n                if (!control) return '';\n                var tag = control.tagName ? control.tagName.toLowerCase() : '';\n                var type = (control.type || '').toLowerCase();\n                if (type === 'checkbox' || type === 'radio') return control.checked ? '是' : '否';\n                if (tag === 'select') {\n                    var option = control.options && control.selectedIndex >= 0 ? control.options[control.selectedIndex] : null;\n                    return normalizeText(option ? option.textContent : control.value);\n                }\n                if (tag === 'textarea') return normalizeText(control.value || control.textContent);\n                return normalizeText(control.value || control.getAttribute('value') || control.textContent);\n            }\n\n            function textFromNode(el) {\n                if (!el) return '';\n                var clone = el.cloneNode(true);\n                var originalControls = Array.from(el.querySelectorAll('input, textarea, select'));\n                var cloneControls = Array.from(clone.querySelectorAll('input, textarea, select'));\n                cloneControls.forEach(function (control, index) {\n                    var span = clone.ownerDocument.createElement('span');\n                    span.textContent = controlValue(originalControls[index]);\n                    control.replaceWith(span);\n                });\n                clone.querySelectorAll('script, style, button, .signature-preview-mask, .signature-preview-toast, .node-popover, .auditor-dropdown, .criteria-expand-icon').forEach(function (item) {\n                    item.remove();\n                });\n                return normalizeText(clone.textContent);\n            }\n\n            function pdfRows(rows) {\n                return rows.map(function (row) {\n                    return '<tr><th>' + escapeHtml(row[0] || '') + '</th><td>' + escapeHtml(row[1] || '-') + '</td></tr>';\n                }).join('');\n            }\n\n            function makePdfTable(title, rows, extraClass) {\n                if (!rows || !rows.length) return '';\n                return '<div class=\"pdf-table-section\"><div class=\"pdf-section-title\">' + escapeHtml(title) + '</div><table class=\"plan-pdf-table ' + (extraClass || '') + '\"><tbody>' + pdfRows(rows) + '</tbody></table></div>';\n            }\n\n            function domTableToPdf(table, title) {\n                if (!table) return '';\n                var rows = Array.from(table.querySelectorAll('tr')).map(function (tr) {\n                    return Array.from(tr.children).map(function (cell) { return textFromNode(cell); });\n                }).filter(function (cells) { return cells.some(Boolean); });\n                if (!rows.length) return '';\n                return '<div class=\"pdf-table-section\"><div class=\"pdf-section-title\">' + escapeHtml(title) + '</div><table class=\"plan-pdf-table matrix\">' + rows.map(function (cells, rowIndex) {\n                    var cellTag = rowIndex === 0 ? 'th' : 'td';\n                    return '<tr>' + cells.map(function (cell) { return '<' + cellTag + '>' + escapeHtml(cell || '-') + '</' + cellTag + '>'; }).join('') + '</tr>';\n                }).join('') + '</table></div>';\n            }\n\n            function buildTypeTable() {\n                var sec = document.getElementById('section-type');\n                if (!sec) return '';\n                return makePdfTable('一、审核类型', [['审核类型及认证体系', textFromNode(sec.querySelector('.tip-box')) || textFromNode(sec)]]);\n            }\n\n            function buildPurposeTable() {\n                var sec = document.getElementById('section-purpose');\n                if (!sec) return '';\n                var rows = Array.from(sec.querySelectorAll('.form-field')).map(function (field) {\n                    var label = textFromNode(field.querySelector('.form-label'));\n                    var control = field.querySelector('textarea, input, select, .readonly-display');\n                    var value = control ? (controlValue(control) || textFromNode(control)) : textFromNode(field);\n                    return [label, value];\n                }).filter(function (row) { return row[0] || row[1]; });\n                return makePdfTable('二、审核目的', rows.length ? rows : [['审核目的', textFromNode(sec)]]);\n            }\n\n            function buildScopeTable() {\n                var sec = document.getElementById('section-scope');\n                if (!sec) return '';\n                var cards = Array.from(sec.querySelectorAll('.scope-site-card'));\n                if (!cards.length) return makePdfTable('三、审核范围', [['审核范围', textFromNode(sec)]]);\n                return '<div class=\"pdf-table-section\"><div class=\"pdf-section-title\">三、审核范围</div>' + cards.map(function (card, index) {\n                    var rows = Array.from(card.querySelectorAll('.scope-line')).map(function (line) {\n                        return [textFromNode(line.querySelector('.scope-label')), textFromNode(line.querySelector('.scope-value'))];\n                    }).filter(function (row) { return row[0] || row[1]; });\n                    return '<table class=\"plan-pdf-table scope-table\"><tbody><tr><th colspan=\"2\">场所 ' + (index + 1) + '</th></tr>' + pdfRows(rows) + '</tbody></table>';\n                }).join('') + '</div>';\n            }\n\n            function buildCriteriaTable() {\n                var sec = document.getElementById('section-criteria');\n                if (!sec) return '';\n                var rows = [];\n                Array.from(sec.querySelectorAll('.criteria-standards-grid .standard-tag')).forEach(function (tag, index) {\n                    rows.push([index === 0 ? '管理体系标准' : '', textFromNode(tag)]);\n                });\n                Array.from(sec.querySelectorAll('.criteria-item')).forEach(function (item) {\n                    var title = textFromNode(item.querySelector('.criteria-label-text'));\n                    if (!title || title === '管理体系标准') return;\n                    var checkbox = item.querySelector('input[type=\"checkbox\"]');\n                    var checkedText = checkbox ? (checkbox.checked ? '适用' : '不适用') : '适用';\n                    var input = item.querySelector('.criteria-content-area input, .criteria-content-area textarea, .readonly-display');\n                    var detail = input ? (controlValue(input) || textFromNode(input)) : '';\n                    rows.push([title, detail ? checkedText + '；' + detail : checkedText]);\n                });\n                return makePdfTable('四、审核准则', rows.length ? rows : [['审核准则', textFromNode(sec)]]);\n            }\n\n            function buildTeamTable() {\n                var sec = document.getElementById('section-team');\n                if (!sec) return '';\n                return domTableToPdf(sec.querySelector('table'), '五、审核组') || makePdfTable('五、审核组', [['审核组', textFromNode(sec)]]);\n            }\n\n            function buildActivityTable() {\n                var sec = document.getElementById('section-activity');\n                if (!sec) return '';\n                var html = '<div class=\"pdf-table-section\"><div class=\"pdf-section-title\">六、审核活动安排</div>';\n                var stats = Array.from(sec.querySelectorAll('.stats-bar .stat-item')).map(function (item) { return textFromNode(item); }).filter(Boolean);\n                if (stats.length) {\n                    html += '<table class=\"plan-pdf-table\"><tbody><tr><th>审核组已安排时长统计</th><td>' + escapeHtml(stats.join('；')) + '</td></tr></tbody></table>';\n                }\n                var cards = Array.from(sec.querySelectorAll('.site-card'));\n                if (!cards.length) return html + '<table class=\"plan-pdf-table\"><tbody><tr><th>审核活动</th><td>' + escapeHtml(textFromNode(sec)) + '</td></tr></tbody></table></div>';\n                cards.forEach(function (card, index) {\n                    var siteTitle = textFromNode(card.querySelector('.site-title')) || ('场所 ' + (index + 1));\n                    var infoRows = [['场所名称', siteTitle]];\n                    Array.from(card.querySelectorAll('.site-info-item')).forEach(function (info) {\n                        var label = textFromNode(info.querySelector('.site-info-label'));\n                        var value = textFromNode(info.querySelector('.site-info-value'));\n                        if (label || value) infoRows.push([label, value]);\n                    });\n                    html += '<table class=\"plan-pdf-table scope-table\"><tbody><tr><th colspan=\"2\">审核场所 ' + (index + 1) + '</th></tr>' + pdfRows(infoRows) + '</tbody></table>';\n                    var table = card.querySelector('table');\n                    var activityRows = Array.from(card.querySelectorAll('.activity-row'));\n                    if (table) {\n                        html += domTableToPdf(table, '审核活动明细');\n                    } else if (activityRows.length) {\n                        html += '<table class=\"plan-pdf-table matrix activity-table\"><tbody>' + activityRows.map(function (row) {\n                            var cells = Array.from(row.children).map(function (cell, colIndex, arr) {\n                                if (colIndex === 0 || colIndex === arr.length - 1) return '';\n                                return textFromNode(cell);\n                            }).filter(Boolean);\n                            return '<tr>' + cells.map(function (cell) { return '<td>' + escapeHtml(cell || '-') + '</td>'; }).join('') + '</tr>';\n                        }).join('') + '</tbody></table>';\n                    }\n                });\n                return html + '</div>';\n            }\n\n            function buildSignaturePageHtml() {\n                var rows = signatureNodes.map(function (item, index) {\n                    return '<tr><td>' + (index + 1) + '</td><td>' + escapeHtml(item.title) + '</td><td>' + escapeHtml(item.signer) + '</td><td>' + escapeHtml(item.role) + '</td><td>' + escapeHtml(item.signedAt) + '</td><td>已签章</td></tr>';\n                }).join('');\n                var sealBlocks = signatureNodes.map(function (item) {\n                    return '<div class=\"pdf-personal-seal-wrap\"><div class=\"pdf-personal-seal\"><div class=\"seal-role\">' + escapeHtml(item.role) + '</div><div class=\"seal-name\">' + escapeHtml(item.signer) + '</div><div class=\"seal-mark\">电子签章</div></div><div class=\"pdf-personal-seal-time\">' + escapeHtml(item.signedAt) + '</div></div>';\n                }).join('');\n                return '<div class=\"signature-page-inner\"><div class=\"signature-page-header\"><div><div class=\"signature-org\">CQC 中国质量认证中心</div><div class=\"signature-en\">CHINA QUALITY CERTIFICATION CENTRE</div></div><div class=\"signature-meta\"><div>文件名称：审核计划</div><div>签署方式：线上电子签章</div><div>签章状态：全部已完成</div></div></div><h2 class=\"signature-title\">审核计划线上签章记录</h2><div class=\"signature-summary\"><strong>说明：</strong>本页汇总当前审核计划的电子签章记录。每个节点签章成功后，系统自动流转至下一节点，并在本页追加个人签章印。</div><table class=\"signature-table\"><thead><tr><th>序号</th><th>节点</th><th>签章人</th><th>角色</th><th>签章时间</th><th>状态</th></tr></thead><tbody>' + rows + '</tbody></table><div class=\"signature-seal-title\">个人签章印</div><div class=\"signature-seal-area\">' + sealBlocks + '</div></div>';\n            }\n\n            function buildPdfPreviewDocument() {\n                var planTables = [\n                    build
