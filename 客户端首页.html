
<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>体系认证管理系统客户端 · 登录</title><link rel="stylesheet" href="assets/client-auth.css"><link rel="stylesheet" href="assets/client-login.css"><link rel="stylesheet" href="assets/client-signup.css"></head>
<body>
  <main class="login-layout">
    <section class="intro" aria-label="认证全流程，一站式管控。业务过程留痕、任务高效协同、多源身份接入。"><div class="brand-copy"><strong>体系认证管理系统客户端</strong><span>Certification Management Platform · Client</span></div><p class="copyright">© 2026 体系认证管理系统客户端</p></section>
    <section class="login-panel"><div class="login-card"><h1>欢迎登录</h1>
      <form id="loginForm" class="login-form">
        <div class="field"><label for="username">用户名</label><div class="input-shell"><span class="input-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></span><input id="username" name="username" autocomplete="username" placeholder="请输入用户名" required><button class="input-action" type="button" aria-label="清空用户名" onclick="document.getElementById('username').value='';document.getElementById('username').focus()">×</button></div></div>
        <div class="field"><label for="password">密码</label><div class="input-shell password-input"><span class="input-icon"><svg viewBox="0 0 24 24"><rect x="6" y="10" width="12" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></span><input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required><button id="togglePassword" class="input-action" type="button" aria-label="显示或隐藏密码"><svg viewBox="0 0 24 24"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
        <div class="login-options"><label class="remember"><input id="rememberAccount" type="checkbox" checked>记住账号</label><button class="link-btn" type="button" onclick="ClientAuth.toast('请联系管理员重置密码')">忘记密码？</button></div><button class="primary" type="submit">登录系统</button>
      </form>
      <button class="register-button" id="registerAccount" type="button">注册账号</button>
      <div class="divider">其他登录方式</div>
      <button class="sso-button" id="companyLogin"><span class="sso-icon"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6Z"/><path d="m8 12 3 3 5-6"/></svg></span><span class="sso-label"><strong>以 中认环宇 账号登录</strong><span>使用证书介质或二维码完成身份校验</span></span><span class="sso-arrow">›</span></button>
    </div></section>
  </main>
  <script src="assets/client-auth.js"></script><script src="assets/client-signup.js"></script><script>
    const passwordInput=document.getElementById('password');document.getElementById('togglePassword').onclick=()=>{passwordInput.type=passwordInput.type==='password'?'text':'password'};
    try{document.getElementById('username').value=localStorage.getItem('clientRememberedUsername')||''}catch(e){}
    document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();try{if(document.getElementById('rememberAccount').checked)localStorage.setItem('clientRememberedUsername',document.getElementById('username').value.trim());else localStorage.removeItem('clientRememberedUsername')}catch(e){}ClientAuth.open('register')});document.getElementById('companyLogin').onclick=()=>ClientAuth.open('sso');
    document.getElementById('registerAccount').onclick=()=>ClientSignup.open();const signupEntry=new URL(location.href);if(signupEntry.searchParams.get('signup')==='1'){ClientSignup.open();signupEntry.searchParams.delete('signup');try{history.replaceState(null,'',signupEntry.href)}catch(e){}}
  </script>
</body></html>
