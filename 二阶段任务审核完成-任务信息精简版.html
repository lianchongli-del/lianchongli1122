:hover {\r\n            background: #94a3b8;\r\n        }\r\n    </style>\r\n<style>\n  /* Unified task-detail interaction style: actions follow 实施记录, readonly follows 审核计划. */\n  html,\n  body {\n    width: 100% !important;\n    min-width: 0 !important;\n    max-width: 100% !important;\n    overflow-x: hidden !important;\n  }\n  body {\n    box-sizing: border-box !important;\n  }\n  *,\n  *::before,\n  *::after {\n    box-sizing: border-box !important;\n  }\n  .container-fixed,\n  .page-container,\n  .main-container,\n  .scheme-shell,\n  .project-header .container-fixed,\n  main.container-fixed {\n    width: 100% !important;\n    max-width: 100% !important;\n    min-width: 0 !important;\n  }\n  .container-fixed,\n  main.container-fixed {\n    padding-left: 16px !important;\n    padding-right: 16px !important;\n  }\n  .page-container {\n    padding-left: 16px !important;\n    padding-right: 16px !important;\n  }\n  .main-container {\n    padding-left: 16px !important;\n    padding-right: 16px !important;\n  }\n  .table-scroll,\n  .table-responsive {\n    width: 100% !important;\n    max-width: 100% !important;\n    overflow-x: auto !important;\n  }\n  .btn {\n    border-radius: 8px !important;\n    font-size: 12px !important;\n    font-weight: 500 !important;\n    transition: all 0.2s !important;\n  }\n  .btn-primary {\n    background: #2563eb !important;\n    border-color: #2563eb !important;\n    color: #fff !important;\n  }\n  .btn-primary:hover {\n    background: #1d4ed8 !important;\n    border-color: #1d4ed8 !important;\n    transform: translateY(-1px);\n    box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);\n  }\n  .btn-default {\n    background: #fff !important;\n    border-color: #d1d5db !important;\n    color: #374151 !important;\n  }\n  .btn-default:hover {\n    border-color: #9ca3af !important;\n    background: #f9fafb !important;\n  }\n  .btn-danger {\n    color: #dc2626 !important;\n    background: #fff !important;\n    border-color: #fca5a5 !important;\n  }\n  .btn-danger:hover {\n    background: #fef2f2 !important;\n    border-color: #dc2626 !important;\n  }\n  .form-input,\n  .form-select,\n  .form-textarea,\n  textarea,\n  select,\n  input[type=\"text\"],\n  input[type=\"number\"],\n  input[type=\"month\"],\n  input[type=\"date\"] {\n    border-radius: 8px !important;\n    transition: all 0.2s !important;\n  }\n  .form-input:hover,\n  .form-select:hover,\n  .form-textarea:hover,\n  textarea:hover,\n  select:hover,\n  input[type=\"text\"]:hover,\n  input[type=\"number\"]:hover,\n  input[type=\"month\"]:hover,\n  input[type=\"date\"]:hover {\n    border-color: #9ca3af !important;\n  }\n  .form-input:focus,\n  .form-select:focus,\n  .form-textarea:focus,\n  textarea:focus,\n  select:focus,\n  input[type=\"text\"]:focus,\n  input[type=\"number\"]:focus,\n  input[type=\"month\"]:focus,\n  input[type=\"date\"]:focus {\n    outline: none !important;\n    border-color: #3b82f6 !important;\n    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1) !important;\n  }\n  .data-table th {\n    background: #f8fafc !important;\n    color: #64748b !important;\n    font-weight: 600 !important;\n  }\n  .data-table tr:hover {\n    background: #eff6ff !important;\n  }\n  .data-table {\n    width: 100% !important;\n  }\n  .table-scroll > .data-table,\n  .table-responsive > .data-table {\n    min-width: 920px;\n  }\n  .content-card,\n  .card,\n  .site-card,\n  .domain-section,\n  .block {\n    max-width: 100% !important;\n  }\n  .info-grid,\n  .site-meta-grid,\n  .compact-row-2,\n  .compact-row-3,\n  .compact-row-4,\n  .team-readonly-summary,\n  .cert-grid {\n    max-width: 100% !important;\n  }\n  img,\n  svg,\n  canvas,\n  video {\n    max-width: 100% !important;\n  }\n  .readonly-display,\n  .readonly,\n  .info-value,\n  .cert-text,\n  .form-input[readonly],\n  .form-input:disabled,\n  input[readonly],\n  input:disabled,\n  textarea[readonly],\n  textarea:disabled {\n    background: #f9fafb !important;\n    border-color: #e2e8f0 !important;\n    color: #334155 !important;\n  }\n  .info-label,\n  .form-label,\n  .detail-label {\n    color: #94a3b8 !important;\n    font-size: 12px !important;\n    font-weight: 500 !important;\n  }\n</style>\n\n</head>\r\n<body>\r\n\r\n   \r\n\r\n    <main class=\"container-fixed\">\r\n        <!-- Tab 状态切换栏 -->\r\n        <div class=\"status-bar-container\">\r\n            <div class=\"tab-navigation\">\r\n                \r\n                <!-- 首次会议 -->\r\n                <div class=\"tab-item completed\" onclick=\"switchModule('first', this)\" data-module=\"first\">\r\n                    <div class=\"tab-header\">\r\n                        <div class=\"tab-title-wrapper\">\r\n                            <div class=\"tab-icon\">\r\n                                <i class=\"fas fa-handshake\"></i>\r\n                            </div>\r\n                            <span class=\"tab-text\">首次会议</span>\r\n                        </div>\r\n                        <span class=\"status-badge status-completed\">\r\n                            <i class=\"fas fa-check-circle text-xs\"></i>\r\n                            已完成\r\n                        </span>\r\n                    </div>\r\n                    <div class=\"tab-progress\">\r\n                        <div class=\"progress-bar-bg\">\r\n                            <div class=\"progress-bar-fill\" style=\"width: 100%; background: #22c55e;\"></div>\r\n                        </div>\r\n                        <span class=\"progress-text\">3/3</span>\r\n                    </div>\r\n                    <div class=\"tab-stats\">\r\n                        <div class=\"stat-item\">\r\n                            <i class=\"fas fa-check-square text-green-500 text-xs\"></i>\r\n                            <span>签到表：<span class=\"stat-value text-green-600\">已上传</span></span>\r\n                        </div>\r\n                        <div class=\"stat-item\">\r\n                            <i class=\"fas fa-clipboard-check text-green-500 text-xs\"></i>\r\n                            <span>确认项：<span class=\"stat-value text-green-600\">7/7</span></span>\r\n                        </div>\r\n                    </div>\r\n                </div>\r\n\r\n                <!-- 现场审核 -->\r\n                <div class=\"tab-item active\" onclick=\"switchModule('field', this)\" data-module=\"field\">\r\n                    <div class=\"tab-header\">\r\n                        <div class=\"tab-title-wrapper\">\r\n                            <div class=\"tab-icon\">\r\n                                <i class=\"fas fa-tasks\"></i>\r\n                            </div>\r\n                            <span class=\"tab-text\">现场审核</span>\r\n                        </div>\r\n                        <span class=\"status-badge status-progress\">\r\n                            <i class=\"fas fa-spinner fa-spin text-xs\"></i>\r\n                            进行中\r\n                        </span>\r\n                    </div>\r\n                    <div class=\"tab-progress\">\r\n                        <div class=\"progress-bar-bg\">\r\n                            <div class=\"progress-bar-fill\" style=\"width: 60%; background: #3b82f6;\"></div>\r\n                        </div>\r\n                        <span class=\"progress-text\">60%</span>\r\n                    </div>\r\n                    <div class=\"tab-stats\">\r\n                        <div class=\"stat-item\">\r\n                            <i class=\"fas fa-users text-blue-500 text-xs\"></i>\r\n                            <span>审核员：<span class=\"stat-value\">4人</span></span>\r\n                        </div>\r\n                        <div class=\"stat-item\">\r\n                            <i class=\"fas fa-file-alt text-blue-500 text-xs\"></i>\r\n                            <span>记录：<span class=\"stat-value\">12条</span></span>\r\n                        </div>\r\n                        <div class=\"stat-item\">\r\n                            <i class=\"fas fa-exclamation-triangle text-orange-500 text-xs\"></i>\r\n                            <span>不符合：<span class=\"stat-value text-orange-600\">2项</span></span>\r\n                        </div>\r\n                    </div>\r\n                </div>\r\n\r\n                <!-- 末次会议 -->\r\n                <div class=\"tab-item pending\" onclick=\"switchModule('last', this)\" data-module=\"last\">\r\n                    <div class=\"tab-header\">\r\n                        <div class=\"tab-title-wrapper\">\r\n                            <div class=\"tab-icon\">\r\n                                <i class=\"fas fa-flag-checkered\"></i>\r\n                            </div>\r\n                            <span class=\"tab-text\">末次会议</span>\r\n                        </div>\r\n                        <span class=\"status-badge status-pending\">\r\n                            <i class=\"fas fa-clock text-xs\"></i>\r\n                            待填报\r\n                        </span>\r\n                    </div>\r\n                    <div class=\"tab-progress\">\r\n                        <div class=\"progress-bar-bg\">\r\n                            <div class=\"progress-bar-fill\" style=\"width: 0%; background: #eab308;\"></div>\r\n                        </div>\r\n                        <span class=\"progress-text\">0%</span>\r\n                    </div>\r\n                    <div class=\"tab-stats\">\r\n                        <div class=\"stat-item\">\r\n                            <i class=\"fas fa-hourglass-start text-gray-400 text-xs\"></i>\r\n                            <span>签到表：<span class=\"stat-value text-gray-400\">未上传</span></span>\r\n                        </div>\r\n                        <div class=\"stat-item\">\r\n                            <i class=\"fas fa-list-check text-gray-400 text-xs\"></i>\r\n                            <span>确认项：<span class=\"stat-value text-green-600\">8/8</span></span>\r\n                        </div>\r\n                    </div>\r\n                </div>\r\n\r\n            </div>\r\n        </div>\r\n\r\n        <!-- 首次会议内容 -->\r\n        <div id=\"first-module\" class=\"module-content\">\r\n            <div class=\"content-card\">\r\n                <div class=\"card-header\">\r\n                    <div class=\"card-title\">\r\n                        <i class=\"fas fa-handshake text-blue-500\"></i>\r\n                        首次会议记录\r\n                    </div>\r\n                </div>\r\n                <div class=\"p-5\">\r\n                    <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 24px;\">\r\n                        <div>\r\n                            <label class=\"form-label\">会议日期</label>\r\n                            <input type=\"date\" class=\"form-input\" value=\"2024-04-15\">\r\n                        </div>\r\n                        <div>\r\n                            <label class=\"form-label\">开始时间</label>\r\n                            <input type=\"time\" class=\"form-input\" value=\"09:00\">\r\n                        </div>\r\n                        <div>\r\n                            <label class=\"form-label\">结束时间</label>\r\n                            <input type=\"time\" class=\"form-input\" value=\"09:30\">\r\n                        </div>\r\n                    </div>\r\n\r\n                    <div class=\"meeting-notice notice-green\">\r\n                        <div class=\"notice-title\">\r\n                            <i class=\"fas fa-exclamation-circle\"></i>\r\n                            首次会议注意事项（请逐项勾选确认）\r\n                        </div>\r\n                        <div class=\"notice-item\">\r\n                            <input type=\"checkbox\" id=\"f_notice1\" checked>\r\n                            <label for=\"f_notice1\">介绍审核组成员及分工，确认审核计划安排</label>\r\n                        </div>\r\n                        <div class=\"notice-item\">\r\n                            <input type=\"checkbox\" id=\"f_notice2\" checked>\r\n                            <label for=\"f_notice2\">确认审核目的、范围、准则及审核程序</label>\r\n                        </div>\r\n                        <div class=\"notice-item\">\r\n                            <input type=\"checkbox\" id=\"f_notice3\" checked>\r\n                            <label for=\"f_notice3\">确认审核组与受审核方之间的沟通渠道</label>\r\n                        </div>\r\n                        <div class=\"notice-item\">\r\n                            <input type=\"checkbox\" id=\"f_notice4\" checked>\r\n                            <label for=\"f_notice4\">确认审核组所需的资源和设施已齐备</label>\r\n                        </div>\r\n                        <div class=\"notice-item\">\r\n                            <input type=\"checkbox\" id=\"f_notice5\" checked>\r\n                            <label for=\"f_notice5\">确认保密事宜及信息安全事项</label>\r\n                        </div>\r\n                        <div class=\"notice-item\">\r\n                            <input type=\"checkbox\" id=\"f_notice6\" checked>\r\n                            <label for=\"f_notice6\">确认陪同人员安排及向导职责</label>\r\n                        </div>\r\n                        <div class=\"notice-item\">\r\n                            <input type=\"checkbox\" id=\"f_notice7\" checked>\r\n                            <label for=\"f_notice7\">确认审核期间的安全事项和应急程序</label>\r\n                        </div>\r\n                    </div>\r\n\r\n                    <div style=\"margin-top: 24px;\">\r\n                        <label class=\"form-label\">\r\n                            <i class=\"fas fa-file-signature text-orange-500 mr-1\"></i>\r\n                            首次会议签到表扫描件\r\n                            <span class=\"text-red-500\">*</span>\r\n                        </label>\r\n                        <div class=\"upload-area\" id=\"firstMeetingUpload\" onclick=\"uploadSignFile('first')\">\r\n                            <i class=\"fas fa-cloud-upload-alt\" style=\"font-size: 32px; color: #3b82f6; margin-bottom: 8px;\"></i>\r\n                            <div style=\"color: #475569; font-size: 13px; margin-bottom: 8px; font-weight: 500;\">点击上传签到表扫描件</div>\r\n                            <div style=\"color: #94a3b8; font-size: 12px;\">支持 PDF、JPG、PNG 格式，单个文件不超过 10MB</div>\r\n                        </div>\r\n                        <input type=\"file\" id=\"firstMeetingFile\" style=\"display: none;\" accept=\".pdf,.jpg,.jpeg,.png\" onchange=\"handleSignUpload(event, 'first')\">\r\n                        \r\n                        <div id=\"firstMeetingFileList\" class=\"hidden\"></div>\r\n                    </div>\r\n\r\n                    <div style=\"margin-top: 24px;\">\r\n                        <label class=\"form-label\">首次会议记录摘要</label>\r\n                        <textarea class=\"form-input\" rows=\"4\" placeholder=\"记录首次会议的重要讨论内容、确认事项及双方达成的共识...\"></textarea>\r\n                    </div>\r\n                </div>\r\n            </div>\r\n        </div>\r\n\r\n        <!-- 现场审核内容 -->\r\n        <div id=\"field-module\" class=\"module-content active\">\r\n            <div class=\"content-card\">\r\n                <div class=\"card-header\">\r\n                    <div class=\"card-title\">\r\n                        <i class=\"fas fa-tasks text-blue-500\"></i>\r\n                        审核人员核查记录执行情况\r\n                    </div>\r\n                    <div class=\"text-xs text-gray-500\">\r\n                        提示：组长和组员核查记录统一在此处管理，所有核查记录均已确认，仅支持查看详情\r\n                    </div>\r\n                </div>\r\n                <div style=\"padding: 16px;\">\r\n                    <table class=\"data-table border border-gray-200\">\r\n                        <thead>\n                            <tr>\n                                <th style=\"width: 100px;\">审核人员</th>\n                                <th style=\"width: 100px;\">组内身份</th>\n                                <th style=\"width: 220px; white-space: nowrap;\">审核日期区间</th>\n                                <th style=\"min-width: 120px;\">审核场所</th>\n                                <th style=\"width: 80px; text-align: center;\">优势亮点</th>\n                                <th style=\"width: 90px; text-align: center;\">轻微不符合</th>\n                                <th style=\"width: 80px; text-align: center;\">严重不符合</th>\n                                <th style=\"width: 90px;\">状态</th>\n                                <th style=\"width: 140px;\">提交时间</th>\n                                <th style=\"width: 220px;\">操作</th>\n                            </tr>\n                        </thead>\r\n                        <tbody id=\"verificationTableBody\"></tbody>\r\n                    </table>\r\n                </div>\r\n            </div>\r\n        </div>\r\n\r\n        <!-- 末次会议内容 -->\r\n        <div id=\"last-module\" class=\"module-content\">\r\n            <div class=\"content-card\">\r\n                <div class=\"card-header\">\r\n                    <div class=\"card-title\">\r\n                        <i class=\"fas fa-flag-checkered text-blue-500\"></i>\r\n                        末次会议记录\r\n                    </div>\r\n                </div>\r\n                <div class=\"p-5\">\r\n                    <div style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 24px;\">\r\n                        <div>\r\n                            <label class=\"form-label\">会议日期</label>\r\n                            <input type=\"date\" class=\"form-input\" value=\"2024-04-18\">\r\n                        </div>\r\n                        <div>\r\n                            <label class=\"form-label\">开始时间</label>\r\n                            <input type=\"time\" class=\"form-input\" value=\"16:00\">\r\n                        </div>\r\n                        <div>\r\n                            <label class=\"form-label\">结束时间</label>\r\n                            <input type=\"time\" class=\"form-input\" value=\"17:00\">\r\n                        </div>\r\n                    </div>\r\n\r\n                    <div class=\"meeting-notice notice-blue\">\r\n                        <div class=\"notice-title\">\r\n                            <i class=\"fas fa-exclamation-circle\"></i>\r\n                            末次会议注意事项（请逐项勾选确认）\r\n                        </div>\r\n                        <div class=\"notice-item\">\r\n                            <input type=\"checkbox\" id=\"l_notice1\" checked>\r\n                            <label for=\"l_notice1\">感谢受审核方的配合与支持</label>\r\n                        </div>\r\n                        <div class=\"notice-item\">\r\n                            <input type=\"checkbox\" id=\"l_notice2\" checked>\r\n                            <label for=\"l_notice2\">重申审核的抽样性质及局限性</label>\r\n                        </div>\r\n                        <div class=\"notice-item\">\r\n                            <input type=\"checkbox\" id=\"l_notice3\" checked>\r\n                            <label for=\"l_notice3\">报告审核发现，包括符合项和不符合项</label>\r\n                        </div>\r\n                        <div class=\"notice-item\">\r\n                            <input type=\"checkbox\" id=\"l_notice4\" checked>\r\n                            <label for=\"l_notice4\">确认不符合项的分类及后续整改要求</label>\r\n                        </div>\r\n                        <div class=\"notice-item\">\r\n                            <input type=\"checkbox\" id=\"l_notice5\" checked>\r\n                            <label for=\"l_notice5\">报告审核结论及推荐意见</label>\r\n                        </div>\r\n                        <div class=\"notice-item\">\r\n                            <input type=\"checkbox\" id=\"l_notice6\" checked>\r\n                            <label for=\"l_notice6\">说明审核后续活动安排及时间安排</label>\r\n                        </div>\r\n                        <div class=\"notice-item\">\r\n                            <input type=\"checkbox\" id=\"l_notice7\" checked>\r\n                            <label for=\"l_notice7\">就审核证据与受审核方达成一致意见</label>\r\n                        </div>\r\n                        <div class=\"notice-item\">\r\n                            <input type=\"checkbox\" id=\"l_notice8\" checked>\r\n                            <label for=\"l_notice8\">受审核方对审核结果的意见反馈</label>\r\n                        </div>\r\n                    </div>\r\n\r\n                    <div style=\"margin-top: 24px;\">\r\n                        <label class=\"form-label\">\r\n                            <i class=\"fas fa-file-signature text-orange-500 mr-1\"></i>\r\n                            末次会议签到表扫描件\r\n                            <span class=\"text-red-500\">*</span>\r\n                        </label>\r\n                        <div class=\"upload-area\" id=\"lastMeetingUpload\" onclick=\"uploadSignFile('last')\">\r\n                            <i class=\"fas fa-cloud-upload-alt\" style=\"font-size: 32px; color: #3b82f6; margin-bottom: 8px;\"></i>\r\n                            <div style=\"color: #475569; font-size: 13px; margin-bottom: 8px; font-weight: 500;\">点击上传签到表扫描件</div>\r\n                            <div style=\"color: #94a3b8; font-size: 12px;\">支持 PDF、JPG、PNG 格式，单个文件不超过 10MB</div>\r\n                        </div>\r\n                        <input type=\"file\" id=\"lastMeetingFile\" style=\"display: none;\" accept=\".pdf,.jpg,.jpeg,.png\" onchange=\"handleSignUpload(event, 'last')\">\r\n                        \r\n                        <div id=\"lastMeetingFileList\" class=\"hidden\"></div>\r\n                    </div>\r\n\r\n                    <div style=\"margin-top: 24px;\">\r\n                        <label class=\"form-label\">末次会议记录摘要</label>\r\n                        <textarea class=\"form-input\" rows=\"4\" placeholder=\"记录末次会议的重要讨论内容、确认的不符合项、整改要求及双方达成的共识...\"></textarea>\r\n                    </div>\r\n                </div>\r\n            </div>\r\n        </div>\r\n    </main>\r\n\r\n    <!-- 核查记录编辑/确认弹窗 -->\r\n    <div class=\"modal-overlay\" id=\"verificationModal\">\r\n        <div class=\"modal-container\" style=\"max-width: 1600px;\">\r\n            <div class=\"modal-header\">\r\n                <div class=\"modal-title\">\r\n                    <i class=\"fas fa-clipboard-check text-blue-500 mr-2\"></i>\r\n                    <span id=\"modalTitle\">核查记录填报</span> - <span id=\"modalAuditorName\">审核人员</span>\r\n                    <span id=\"modalReadOnlyTag\" class=\"ml-2 px-2 py-0.5 bg-gray-100 text-gray-500 rounded text-xs font-medium hidden\">只读模式</span>\r\n                </div>\r\n                <button class=\"modal-close\" onclick=\"closeVerificationModal()\">\r\n                    <i class=\"fas fa-times\"></i>\r\n                </button>\r\n            </div>\r\n            \r\n            <div class=\"modal-body\">\r\n                <div class=\"modal-sidebar\">\r\n                    <div class=\"sidebar-title\">\r\n                        <i class=\"fas fa-list-ul mr-2\"></i>\r\n                        审核活动列表\r\n                    </div>\r\n                    <div id=\"sidebarContent\"></div>\r\n                </div>\r\n                \r\n                <div class=\"modal-main\">\r\n                    <div id=\"verificationForms\"></div>\r\n                    \r\n                    <div style=\"margin-top: 24px; padding-top: 16px; border-top: 1px solid #e2e8f0;\">\r\n                        <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;\">\r\n                            <span class=\"form-label\" style=\"margin-bottom: 0;\">附件资料</span>\r\n                            <button class=\"btn btn-default btn-sm\" id=\"uploadBtn\" onclick=\"uploadAttachment()\">\r\n                                <i class=\"fas fa-upload text-xs\"></i>\r\n                                上传附件\r\n                            </button>\r\n                        </div>\r\n                        <div class=\"attachment-list\" id=\"attachmentList\"></div>\r\n                        <input type=\"file\" id=\"fileInputModal\" style=\"display: none;\" accept=\".doc,.docx,.pdf,.jpg,.jpeg,.png,.gif\" onchange=\"handleFileSelectModal(event)\" multiple>\r\n                    </div>\r\n                </div>\r\n            </div>\r\n            \r\n            <div class=\"modal-footer\">\r\n                <span class=\"text-sm text-gray-500 mr-auto\" id=\"modalHint\">\r\n                    <i class=\"fas fa-info-circle text-blue-500 mr-1\"></i>\r\n                    填写完成后点击提交保存记录\r\n                </span>\r\n                <button class=\"btn btn-default\" onclick=\"closeVerificationModal()\">取消</button>\r\n                <button class=\"btn btn-primary\" id=\"confirmBtn\" onclick=\"saveVerificationRecords()\">\r\n                    <i class=\"fas fa-save text-xs\"></i>\r\n                    提交\r\n                </button>\r\n            </div>\r\n        </div>\r\n    </div>\r\n\r\n    <script>\r\n        // ========== 全局数据 ==========\r\n        \r\n        // 会议签到表文件\r\n        let meetingFiles = {\r\n            first: null,\r\n            last: null\r\n        };\r\n\r\n        // 核查记录数据\r\n        let verificationData = [\r\n            { \r\n                auditorId: 'wurg', \r\n                auditorName: '武荣刚', \r\n                role: '组长', \r\n                roleTag: 'tag-leader',\r\n                dateRange: '2024-04-15 至 2024-04-18', \r\n                sites: '中心职能、场所1、场所2', \r\n                status: 'unsubmitted', \r\n                submitTime: '-',\r\n                records: [\r\n                    {\r\n                        date: '2024-04-15',\r\n                        time: '09:00-12:00',\r\n                        content: '组织环境 4.1-4.4',\r\n                        dept: '中心职能/管理层',\r\n                        record: '审核了公司管理体系的组织环境相关内容，与总经理进行了访谈，了解了管理承诺、方针目标的建立与实施情况。查阅了相关文件化信息，包括内外部环境因素识别表、相关方需求和期望清单等。',\r\n                        decision: '符合',\r\n                        standard: 'GB/T 19001-2016',\r\n                        nonConformityFact: '',\r\n                        nonConformityClause: ''\r\n                    },\r\n                    {\r\n                        date: '2024-04-15',\r\n                        time: '14:00-17:00',\r\n                        content: '领导作用和承诺 5.1-5.3',\r\n                        dept: '中心职能',\r\n                        record: '审核了管理层的领导作用和承诺，包括质量方针的制定与沟通、组织角色职责权限的确定。与部门负责人进行了访谈，检查了管理评审记录。',\r\n                        decision: '符合',\r\n                        standard: 'GB/T 19001-2016',\r\n                        nonConformityFact: '',\r\n                        nonConformityClause: ''\r\n                    },\r\n                    {\r\n                        date: '2024-04-16',\r\n                        time: '09:00-12:00',\r\n                        content: '环境因素识别 6.1.2',\r\n                        dept: '场所1/生产部门',\r\n                        record: '审核了生产现场的环境因素识别与评价过程，检查了重要环境因素清单及控制措施。现场查看了污染物排放控制情况，相关环保设施运行正常。',\r\n                        decision: '观察项',\r\n                        standard: 'GB/T 24001-2016',\r\n                        nonConformityFact: '',\r\n                        nonConformityClause: ''\r\n                    },\r\n                    {\r\n                        date: '2024-04-17',\r\n                        time: '09:00-12:00',\r\n                        content: '危险源辨识 6.1.2',\r\n                        dept: '场所2/安全管理部门',\r\n                        record: '审核了职业健康安全管理体系的危险源辨识、风险评价和控制措施的确定。检查了安全操作规程、应急预案及演练记录。现场查看了安全防护设施配置情况。',\r\n                        decision: '轻微不符合',\r\n                        standard: 'GB/T 45001-2020',\r\n                        nonConformityFact: '未提供2024年第一季度安全演练记录，无法证实应急预案的有效性验证。',\r\n                        nonConformityClause: 'GB/T 45001-2020 8.2'\r\n                    }\r\n                ],\r\n                attachments: []\r\n            },\r\n            { \r\n                auditorId: 'whw', \r\n                auditorName: '王洪伟', \r\n                role: '组员', \r\n                roleTag: 'tag-qms',\r\n                dateRange: '2024-04-15 至 2024-04-16', \r\n                sites: '场所1', \r\n                status: 'confirmed', \r\n                submitTime: '2024-04-16 17:45:00',\r\n                records: [\r\n                    { date: '2024-04-15', time: '09:00-12:00', content: '环境因素识别 6.1.2', dept: '环保部门', record: '审核了环境管理体系的环境因素识别过程...', decision: '符合', standard: 'GB/T 24001-2016', nonConformityFact: '', nonConformityClause: '' }\r\n                ],\r\n                attachments: []\r\n            },\r\n            { \r\n                auditorId: 'lz', \r\n                auditorName: '李战', \r\n                role: '组员', \r\n                roleTag: 'tag-qms',\r\n                dateRange: '2024-04-17 至 2024-04-18', \r\n                sites: '场所2', \r\n                status: 'unsubmitted', \r\n                submitTime: '-',\r\n                records: [],\r\n                attachments: []\r\n            },\r\n            { \r\n                auditorId: 'zq', \r\n                auditorName: '赵强', \r\n                role: '组员', \r\n                roleTag: 'tag-qms',\r\n                dateRange: '2024-04-17', \r\n                sites: '中心职能', \r\n                status: 'submitted', \r\n                submitTime: '2024-04-17 19:20:00',\r\n                records: [\r\n                    { date: '2024-04-17', time: '09:00-12:00', content: '职业健康安全风险识别 6.1.2', dept: '安全管理部门', record: '审核了职业健康安全管理体系的危险源辨识...', decision: '轻微不符合', standard: 'GB/T 45001-2020', nonConformityFact: '部分岗位安全风险告知卡缺失', nonConformityClause: 'GB/T 45001-2020 6.1.2' }\r\n                ],\r\n                attachments: []\r\n            }\r\n        ];\r\n\r\n        let currentVerificationIndex = null;\r\n        let currentActivityIndex = 0;\r\n        let isLeaderEditMode = false;\r\n        let isReadOnlyMode = false;\r\n\r\n        // ========== Tab 切换功能 ==========\r\n        \r\n        function switchModule(module, element) {\r\n            // 移除所有active类\r\n            document.querySelectorAll('.tab-item').forEach(tab => {\r\n                tab.classList.remove('active');\r\n            });\r\n            \r\n            // 隐藏所有内容模块\r\n            document.querySelectorAll('.module-content').forEach(content => {\r\n                content.classList.remove('active');\r\n            });\r\n            \r\n            // 添加active类到当前标签\r\n            element.classList.add('active');\r\n            \r\n            // 显示对应内容\r\n            document.getElementById(module + '-module').classList.add('active');\r\n            \r\n            console.log('切换到模块：' + module);\r\n        }\r\n\r\n        // ========== 首次会议 & 末次会议功能 ==========\r\n        \r\n        function uploadSignFile(type) {\r\n            document.getElementById(type + 'MeetingFile').click();\r\n        }\r\n\r\n        function handleSignUpload(event, type) {\r\n            const file = event.target.files[0];\r\n            if (!file) return;\r\n            \r\n            const validTypes = ['application/pdf', 'image/jpeg', 'image/jpg', 'image/png'];\r\n            if (!validTypes.includes(file.type)) {\r\n                alert('仅支持 PDF、JPG、PNG 格式文件');\r\n                return;\r\n            }\r\n            \r\n            if (file.size > 10 * 1024 * 1024) {\r\n                alert('文件大小不能超过10MB');\r\n                return;\r\n            }\r\n            \r\n            meetingFiles[type] = {\r\n                name: file.name,\r\n                size: (file.size / 1024).toFixed(2) + 'KB',\r\n                type: file.type\r\n            };\r\n            \r\n            const uploadArea = document.getElementById(type + 'MeetingUpload');\r\n            const fileList = document.getElementById(type + 'MeetingFileList');\r\n            \r\n            uploadArea.classList.add('hidden');\r\n            fileList.classList.remove('hidden');\r\n            \r\n            let icon = 'fa-file-pdf';\r\n            if (file.type.startsWith('image/')) icon = 'fa-file-image';\r\n            \r\n            fileList.innerHTML = `\r\n                <div class=\"sign-uploaded\">\r\n                    <i class=\"fas ${icon}\"></i>\r\n                    <span style=\"flex: 1;\">${file.name} (${(file.size / 1024).toFixed(2)}KB)</span>\r\n                    <button class=\"btn btn-default\" onclick=\"previewSignFile('${type}')\" style=\"padding: 4px 10px; font-size: 11px;\">\r\n                        <i class=\"fas fa-eye text-xs\"></i>预览\r\n                    </button>\r\n                    <button class=\"btn btn-default\" onclick=\"deleteSignFile('${type}')\" style=\"padding: 4px 10px; font-size: 11px; color: #dc2626; border-color: #fca5a5;\">\r\n                        <i class=\"fas fa-trash text-xs\"></i>删除\r\n                    </button>\r\n                </div>\r\n            `;\r\n            \r\n            showToast('签到表上传成功', 'success');\r\n        }\r\n\r\n        function previewSignFile(type) {\r\n            const file = meetingFiles[type];\r\n            if (file) {\r\n                showToast('预览: ' + file.name, 'info');\r\n            }\r\n        }\r\n\r\n        function deleteSignFile(type) {\r\n            if (!confirm('确定删除该签到表吗？')) return;\r\n            \r\n            meetingFiles[type] = null;\r\n            \r\n            const uploadArea = document.getElementById(type + 'MeetingUpload');\r\n            const fileList = document.getElementById(type + 'MeetingFileList');\r\n            \r\n            uploadArea.classList.remove('hidden');\r\n            uploadArea.classList.remove('has-file');\r\n            fileList.classList.add('hidden');\r\n            fileList.innerHTML = '';\r\n            \r\n            showToast('签到表已删除', 'success');\r\n        }\r\n\r\n        // ========== 现场审核功能 ==========\r\n        \r\n        function calculateProgressStats(records) {\r\n            if (!records || records.length === 0) {\r\n                return { conform: 0, observation: 0, minor: 0, serious: 0, total: 0 };\r\n            }\r\n            \r\n            const stats = {\r\n                conform: 0,\r\n                observation: 0,\r\n                minor: 0,\r\n                serious: 0,\r\n                total: records.length\r\n            };\r\n            \r\n            records.forEach(record => {\r\n                switch(record.decision) {\r\n                    case '符合':\r\n                        stats.conform++;\r\n                        break;\r\n                    case '观察项':\r\n                        stats.observation++;\r\n                        break;\r\n                    case '轻微不符合':\r\n                        stats.minor++;\r\n                        break;\r\n                    case '严重不符合':\r\n                        stats.serious++;\r\n                        break;\r\n                }\r\n            });\r\n            \r\n            return stats;\r\n        }\r\n\r\n        function renderStatNumber(value, type) {\r\n            if (value === 0) {\r\n                return `<span class=\"stat-number stat-zero\">-</span>`;\r\n            }\r\n            \r\n            let colorClass = '';\r\n            switch(type) {\r\n                case 'conform':\r\n                    colorClass = 'color: #15803d; background: #f0fdf4; border: 1px solid #bbf7d0;';\r\n                    break;\r\n                case 'observation':\r\n                    colorClass = 'color: #92400e; background: #fef3c7; border: 1px solid #fcd34d;';\r\n                    break;\r\n                case 'minor':\r\n                    colorClass = 'color: #dc2626; background: #fef2f2; border: 1px solid #fecaca;';\r\n                    break;\r\n                case 'serious':\r\n                    colorClass = 'color: #991b1b; background: #fee2e2; border: 1px solid #fca5a5;';\r\n                    break;\r\n            }\r\n            \r\n            return `<span class=\"stat-number\" style=\"${colorClass}\">${value}</span>`;\r\n        }\r\n\r\n        function renderProgressBar(records) {\r\n            if (!records || records.length === 0) {\r\n                return `\r\n                    <div class=\"progress-bar-container\" title=\"未开始填报\">\r\n                        <div class=\"progress-bar-fill-table empty\"></div>\r\n                    </div>\r\n                `;\r\n            }\r\n            \r\n            const count = records.length;\r\n            const baseCount = 5;\r\n            const percentage = Math.min((count / baseCount) * 100, 100);\r\n            \r\n            let fillClass = 'low';\r\n            if (percentage >= 100) fillClass = 'full';\r\n            else if (percentage >= 80) fillClass = 'high';\r\n            else if (percentage >= 40) fillClass = 'medium';\r\n            \r\n            return `\r\n                <div class=\"progress-bar-container\" title=\"已填报 ${count} 条核查记录\">\r\n                    <div class=\"progress-bar-fill-table ${fillClass}\" style=\"width: ${percentage}%\">\r\n                    </div>\r\n                </div>\r\n            `;\r\n        }\r\n\r\n        function renderVerificationTable() {\r\n            const tbody = document.getElementById('verificationTableBody');\r\n            tbody.innerHTML = '';\r\n            \r\n            verificationData.forEach((item, index) => {\r\n                const tr = document.createElement('tr');\r\n                \r\n                let statusBadge = '';\r\n                if (item.status === 'unsubmitted') {\r\n                    statusBadge = '<span class=\"status-badge-table badge-draft\">未提交</span>';\r\n                } else if (item.status === 'submitted') {\r\n                    statusBadge = '<span class=\"status-badge-table badge-processing\">已提交</span>';\r\n                } else if (item.status === 'confirmed') {\r\n                    statusBadge = '<span class=\"status-badge-table badge-success\">已确认</span>';\r\n                }\r\n                \r\n                const stats = calculateProgressStats(item.records);\r\n                \r\n                let actionBtns = '<div class=\"action-btns\">';\r\n                \r\n                actionBtns += `<button class=\"btn btn-info btn-sm\" onclick=\"viewVerificationDetails(${index})\">\r\n                    <i class=\"fas fa-eye text-xs\"></i>\r\n                    查看详情\r\n                </button>`;\r\n                \r\n                if (item.role === '组长') {\r\n                    if (item.status === 'unsubmitted') {\r\n                        actionBtns += `<button class=\"btn btn-primary btn-sm\" onclick=\"editLeaderVerification(${index})\">\r\n                            <i class=\"fas fa-edit text-xs\"></i>\r\n                            编辑\r\n                        </button>`;\r\n                    } else {\r\n                        actionBtns += `<button class=\"btn btn-success btn-sm\" disabled>\r\n                            <i class=\"fas fa-check text-xs\"></i>\r\n                            已提交\r\n                        </button>`;\r\n                    }\r\n                } else {\r\n                    if (item.status === 'submitted') {\r\n                        actionBtns += `<button class=\"btn btn-primary btn-sm\" onclick=\"confirmMemberVerification(${index})\">\r\n                            <i class=\"fas fa-check-circle text-xs\"></i>\r\n                            核查记录确认\r\n                        </button>`;\r\n                    } else if (item.status === 'confirmed') {\r\n                        actionBtns += `<button class=\"btn btn-default btn-sm\" disabled>\r\n                            <i class=\"fas fa-check text-xs\"></i>\r\n                            已确认\r\n                        </button>`;\r\n                    } else {\r\n                        actionBtns += `<button class=\"btn btn-default btn-sm\" disabled>\r\n                            <i class=\"fas fa-clock text-xs\"></i>\r\n                            等待提交\r\n                        </button>`;\r\n                    }\r\n                }\r\n                \r\n                actionBtns += '</div>';\r\n                \r\n                tr.innerHTML = `\r\n                    <td class=\"font-medium\">${item.auditorName}</td>\r\n                    <td><span class=\"personnel-tag ${item.roleTag}\">${item.role}</span></td>\r\n                    <td style=\"white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\" title=\"${item.dateRange}\">${item.dateRange}</td>\r\n                    <td>${item.sites}</td>\r\n                    <td>${renderProgressBar(item.records)}</td>\r\n                    <td style=\"text-align: center;\">${renderStatNumber(stats.conform, 'conform')}</td>\r\n                    <td style=\"text-align: center;\">${renderStatNumber(stats.observation, 'observation')}</td>\r\n                    <td style=\"text-align: center;\">${renderStatNumber(stats.minor, 'minor')}</td>\r\n                    <td style=\"text-align: center;\">${renderStatNumber(stats.serious, 'serious')}</td>\r\n                    <td>${statusBadge}</td>\r\n                    <td class=\"text-gray-500\">${item.submitTime}</td>\r\n                    <td>${actionBtns}</td>\r\n                `;\r\n                \r\n                tbody.appendChild(tr);\r\n            });\r\n        }\r\n\r\n        function viewVerificationDetails(index) {\r\n            currentVerificationIndex = index;\r\n            const data = verificationData[index];\r\n            currentActivityIndex = 0;\r\n            isReadOnlyMode = true;\r\n            isLeaderEditMode = false;\r\n            \r\n            document.getElementById('modalTitle').textContent = '核查记录详情';\r\n            document.getElementById('modalAuditorName').textContent = data.auditorName;\r\n            document.getElementById('modalReadOnlyTag').classList.remove('hidden');\r\n            document.getElementById('modalHint').innerHTML = '<i class=\"fas fa-info-circle text-blue-500 mr-1\"></i>当前为只读模式，仅可查看不可编辑';\r\n            document.getElementById('confirmBtn').style.display = 'none';\r\n            document.getElementById('uploadBtn').style.display = 'none';\r\n            \r\n            renderSidebar(data);\r\n            renderVerificationFormsReadOnly(data);\r\n            renderAttachmentsReadOnly(data);\r\n            \r\n            document.getElementById('verificationModal').classList.add('show');\r\n            document.body.style.overflow = 'hidden';\r\n        }\r\n\r\n        function editLeaderVerification(index) {\r\n            currentVerificationIndex = index;\r\n            const data = verificationData[index];\r\n            currentActivityIndex = 0;\r\n            isReadOnlyMode = false;\r\n            isLeaderEditMode = true;\r\n            \r\n            document.getElementById('modalTitle').textContent = '核查记录填报';\r\n            document.getElementById('modalAuditorName').textContent = data.auditorName;\r\n            document.getElementById('modalReadOnlyTag').classList.add('hidden');\r\n            document.getElementById('modalHint').innerHTML = '<i class=\"fas fa-info-circle text-blue-500 mr-1\"></i>组长填报模式：填写完成后点击提交';\r\n            document.getElementById('confirmBtn').style.display = 'inline-flex';\r\n            document.getElementById('uploadBtn').style.display = 'inline-flex';\r\n            \r\n            renderSidebar(data);\r\n            renderVerificationForms();\r\n            renderAttachments();\r\n            \r\n            document.getElementById('verificationModal').classList.add('show');\r\n            document.body.style.overflow = 'hidden';\r\n        }\r\n\r\n        function confirmMemberVerification(index) {\r\n            currentVerificationIndex = index;\r\n            const data = verificationData[index];\r\n            currentActivityIndex = 0;\r\n            isReadOnlyMode = false;\r\n            isLeaderEditMode = false;\r\n            \r\n            document.getElementById('modalTitle').textContent = '核查记录确认';\r\n            document.getElementById('modalAuditorName').textContent = data.auditorName;\r\n            document.getElementById('modalReadOnlyTag').classList.add('hidden');\r\n            document.getElementById('modalHint').innerHTML = '<i class=\"fas fa-info-circle text-blue-500 mr-1\"></i>确认后该核查记录将不可再次修改';\r\n            document.getElementById('confirmBtn').style.display = 'inline-flex';\r\n            document.getElementById('uploadBtn').style.display = 'inline-flex';\r\n            \r\n            renderSidebar(data);\r\n            renderVerificationForms();\r\n            renderAttachments();\r\n            \r\n            document.getElementById('verificationModal').classList.add('show');\r\n            document.body.style.overflow = 'hidden';\r\n        }\r\n\r\n        function renderSidebar(data) {\r\n            const sidebarContent = document.getElementById('sidebarContent');\r\n            sidebarContent.innerHTML = '';\r\n            \r\n            if (!data.records || data.records.length === 0) {\r\n                sidebarContent.innerHTML = '<div style=\"padding: 12px; color: #64748b; font-size: 13px;\">暂无记录</div>';\r\n                return;\r\n            }\r\n            \r\n            data.records.forEach((record, idx) => {\r\n                const item = document.createElement('div');\r\n                item.className = 'sidebar-item ' + (idx === currentActivityIndex ? 'active' : '');\r\n                item.onclick = () => switchActivity(idx);\r\n                \r\n                const hasNC = record.decision === '轻微不符合' || record.decision === '严重不符合';\r\n                const ncIcon = hasNC ? '<i class=\"fas fa-exclamation-circle\" style=\"color: #dc2626; margin-right: 4px;\"></i>' : '';\r\n                \r\n                item.innerHTML = `\r\n                    <div style=\"font-weight: 600; margin-bottom: 2px; color: ${idx === currentActivityIndex ? '#1d4ed8' : '#334155'};\">${ncIcon}${record.date} ${record.time}</div>\r\n                    <div style=\"color: ${idx === currentActivityIndex ? '#60a5fa' : '#94a3b8'}; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">${record.content || '未填写内容'}</div>\r\n                `;\r\n                sidebarContent.appendChild(item);\r\n            });\r\n        }\r\n\r\n        function switchActivity(index) {\r\n            if (!isReadOnlyMode && currentVerificationIndex !== null) {\r\n                saveCurrentFormData();\r\n            }\r\n            \r\n            currentActivityIndex = index;\r\n            \r\n            document.querySelectorAll('.sidebar-item').forEach((item, idx) => {\r\n                item.classList.toggle('active', idx === index);\r\n            });\r\n            \r\n            if (isReadOnlyMode) {\r\n                renderVerificationFormsReadOnly(verificationData[currentVerificationIndex]);\r\n            } else {\r\n                renderVerificationForms();\r\n            }\r\n        }\r\n\r\n        function saveCurrentFormData() {\r\n            const data = verificationData[currentVerificationIndex];\r\n            if (!data.records || data.records.length === 0) return;\r\n            \r\n            const record = data.records[currentActivityIndex];\r\n            const dateTime = document.getElementById('recordDateTime')?.value.split(' ');\r\n            \r\n            if (dateTime && dateTime.length >= 2) {\r\n                record.date = dateTime[0];\r\n                record.time = dateTime.slice(1).join(' ');\r\n            }\r\n            \r\n            const decisionEl = document.getElementById('recordDecision');\r\n            if (decisionEl) record.decision = decisionEl.value;\r\n            \r\n            const contentEl = document.getElementById('recordContent');\r\n            if (contentEl) record.content = contentEl.value;\r\n            \r\n            const deptEl = document.getElementById('recordDept');\r\n            if (deptEl) record.dept = deptEl.value;\r\n            \r\n            const richEditor = document.getElementById('richEditor');\r\n            if (richEditor) record.record = richEditor.innerHTML;\r\n            \r\n            const ncFactEl = document.getElementById('nonConformityFact');\r\n            if (ncFactEl) record.nonConformityFact = ncFactEl.value;\r\n            \r\n            const ncClauseEl = document.getElementById('nonConformityClause');\r\n            if (ncClauseEl) record.nonConformityClause = ncClauseEl.value;\r\n        }\r\n\r\n        function handleDecisionChange() {\r\n            const decision = document.getElementById('recordDecision').value;\r\n            const ncSection = document.getElementById('nonConformitySection');\r\n            \r\n            if (decision === '轻微不符合' || decision === '严重不符合') {\r\n                if (!ncSection) {\r\n                    renderNonConformityFields();\r\n                }\r\n            } else {\r\n                if (ncSection) {\r\n                    ncSection.remove();\r\n                }\r\n            }\r\n        }\r\n\r\n        function renderNonConformityFields() {\r\n            const container = document.getElementById('verificationForms');\r\n            const ncSection = document.createElement('div');\r\n            ncSection.id = 'nonConformitySection';\r\n            ncSection.className = 'nonconformity-section';\r\n            \r\n            const record = verificationData[currentVerificationIndex].records[currentActivityIndex];\r\n            \r\n            ncSection.innerHTML = `\r\n                <div class=\"nonconformity-title\">\r\n                    <i class=\"fas fa-exclamation-triangle\"></i>\r\n                    不符合项信息\r\n                </div>\r\n                <div style=\"margin-bottom: 12px;\">\r\n                    <label class=\"form-label\">不符合事实 <span class=\"text-red-500\">*</span></label>\r\n                    <textarea class=\"form-input\" id=\"nonConformityFact\" rows=\"3\" placeholder=\"请详细描述不符合事实的具体情况...\">${record.nonConformityFact || ''}</textarea>\r\n                </div>\r\n                <div>\r\n                    <label class=\"form-label\">不符合条款 <span class=\"text-red-500\">*</span></label>\r\n                    <input type=\"text\" class=\"form-input\" id=\"nonConformityClause\" value=\"${record.nonConformityClause || ''}\" placeholder=\"如：GB/T 19001-2016 8.5.1\">\r\n                </div>\r\n            `;\r\n            \r\n            container.appendChild(ncSection);\r\n        }\r\n\r\n        function renderVerificationForms() {\r\n            const container = document.getElementById('verificationForms');\r\n            const data = verificationData[currentVerificationIndex];\r\n            \r\n            if (!data.records || data.records.length === 0) {\r\n                container.innerHTML = '<div class=\"empty-state\"><i class=\"fas fa-inbox\"></i><p>暂无核查记录</p></div>';\r\n                return;\r\n            }\r\n            \r\n            const record = data.records[currentActivityIndex];\r\n            \r\n            container.innerHTML = `\r\n                <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;\">\r\n                    <div>\r\n                        <label class=\"form-label\">日期/时间</label>\r\n                        <input type=\"text\" class=\"form-input\" id=\"recordDateTime\" value=\"${record.date} ${record.time}\" placeholder=\"如：2024-04-15 09:00-12:00\">\r\n                    </div>\r\n                    <div>\r\n                        <label class=\"form-label\">判定</label>\r\n                        <select class=\"form-input\" id=\"recordDecision\" onchange=\"handleDecisionChange()\">\r\n                            <option value=\"符合\" ${record.decision === '符合' ? 'selected' : ''}>符合</option>\r\n                            <option value=\"观察项\" ${record.decision === '观察项' ? 'selected' : ''}>观察项</option>\r\n                            <option value=\"轻微不符合\" ${record.decision === '轻微不符合' ? 'selected' : ''}>轻微不符合</option>\r\n                            <option value=\"严重不符合\" ${record.decision === '严重不符合' ? 'selected' : ''}>严重不符合</option>\r\n                        </select>\r\n                    </div>\r\n                </div>\r\n                \r\n                <div style=\"margin-bottom: 16px;\">\r\n                    <label class=\"form-label\">检查内容/涉及标准条款</label>\r\n                    <input type=\"text\" class=\"form-input\" id=\"recordContent\" value=\"${record.content} ${record.standard}\" style=\"width: 100%;\" placeholder=\"如：组织环境 4.1-4.4 GB/T 19001-2016\">\r\n                </div>\r\n                \r\n                <div style=\"margin-bottom: 16px;\">\r\n                    <label class=\"form-label\">涉及部门/场所</label>\r\n                    <input type=\"text\" class=\"form-input\" id=\"recordDept\" value=\"${record.dept}\" style=\"width: 100%;\" placeholder=\"涉及部门/场所\">\r\n                </div>\r\n                \r\n                <div style=\"margin-bottom: 16px;\">\r\n                    <label class=\"form-label\">审核记录 <span class=\"text-red-500\">*</span></label>\r\n                    <div class=\"rich-editor\">\r\n                        <div class=\"rich-editor-toolbar\">\r\n                            <button type=\"button\" class=\"toolbar-btn\" onclick=\"execCmd('bold')\" title=\"加粗\"><i class=\"fas fa-bold\"></i></button>\r\n                            <button type=\"button\" class=\"toolbar-btn\" onclick=\"execCmd('italic')\" title=\"斜体\"><i class=\"fas fa-italic\"></i></button>\r\n                            <button type=\"button\" class=\"toolbar-btn\" onclick=\"execCmd('underline')\" title=\"下划线\"><i class=\"fas fa-underline\"></i></button>\r\n                            <div style=\"width: 1px; height: 20px; background: #e2e8f0; margin: 0 4px;\"></div>\r\n                            <button type=\"button\" class=\"toolbar-btn\" onclick=\"insertImage()\" title=\"插入图片\"><i class=\"fas fa-image\"></i></button>\r\n                        </div>\r\n                        <div class=\"rich-editor-content\" contenteditable=\"true\" id=\"richEditor\">\r\n                            ${record.record}\r\n                        </div>\r\n                    </div>\r\n                </div>\r\n            `;\r\n            \r\n            if (record.decision === '轻微不符合' || record.decision === '严重不符合') {\r\n                renderNonConformityFields();\r\n            }\r\n        }\r\n\r\n        function renderVerificationFormsReadOnly(data) {\r\n            const container = document.getElementById('verificationForms');\r\n            \r\n            if (!data.records || data.records.length === 0) {\r\n                container.innerHTML = '<div class=\"empty-state\"><i class=\"fas fa-inbox\"></i><p>暂无核查记录</p></div>';\r\n                return;\r\n            }\r\n            \r\n            const record = data.records[currentActivityIndex];\r\n            const isNC = record.decision === '轻微不符合' || record.decision === '严重不符合';\r\n            \r\n            let ncHtml = '';\r\n            if (isNC) {\r\n                ncHtml = `\r\n                    <div class=\"nonconformity-section\" style=\"margin-top: 16px;\">\r\n                        <div class=\"nonconformity-title\">\r\n                            <i class=\"fas fa-exclamation-triangle\"></i>\r\n                            不符合项信息\r\n                        </div>\r\n                        <div style=\"margin-bottom: 12px;\">\r\n                            <label class=\"form-label\">不符合事实</label>\r\n                            <div style=\"background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; font-size: 13px; line-height: 1.6;\">\r\n                                ${record.nonConformityFact || '<span style=\"color: #94a3b8;\">无</span>'}\r\n                            </div>\r\n                        </div>\r\n                        <div>\r\n                            <label class=\"form-label\">不符合条款</label>\r\n                            <div style=\"background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; font-size: 13px;\">\r\n                                ${record.nonConformityClause || '<span style=\"color: #94a3b8;\">无</span>'}\r\n                            </div>\r\n                        </div>\r\n                    </div>\r\n                `;\r\n            }\r\n            \r\n            container.innerHTML = `\r\n                <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;\">\r\n                    <div>\r\n                        <label class=\"form-label\">日期/时间</label>\r\n                        <input type=\"text\" class=\"form-input\" value=\"${record.date} ${record.time}\" readonly style=\"background: #f8fafc;\">\r\n                    </div>\r\n                    <div>\r\n                        <label class=\"form-label\">判定</label>\r\n                        <input type=\"text\" class=\"form-input\" value=\"${record.decision}\" readonly style=\"background: #f8fafc; ${isNC ? 'color: #dc2626; font-weight: 600;' : ''}\">\r\n                    </div>\r\n                </div>\r\n                \r\n                <div style=\"margin-bottom: 16px;\">\r\n                    <label class=\"form-label\">检查内容/涉及标准条款</label>\r\n                    <input type=\"text\" class=\"form-input\" value=\"${record.content} ${record.standard}\" style=\"width: 100%;\" readonly style=\"background: #f8fafc;\">\r\n                </div>\r\n                \r\n                <div style=\"margin-bottom: 16px;\">\r\n                    <label class=\"form-label\">涉及部门/场所</label>\r\n                    <input type=\"text\" class=\"form-input\" value=\"${record.dept}\" style=\"width: 100%;\" readonly style=\"background: #f8fafc;\">\r\n                </div>\r\n                \r\n                <div style=\"margin-bottom: 16px;\">\r\n                    <label class=\"form-label\">审核记录</label>\r\n                    <div style=\"min-height: 200px; background: #f8fafc; border: 1px solid #e2e8f0; padding: 16px; border-radius: 8px; font-size: 14px; line-height: 1.7; color: #334155;\">\r\n                        ${record.record || '<span style=\"color: #94a3b8;\">无记录内容</span>'}\r\n                    </div>\r\n                </div>\r\n                ${ncHtml}\r\n            `;\r\n        }\r\n\r\n        function execCmd(command) {\r\n            document.execCommand(command, false, null);\r\n            document.getElementById('richEditor').focus();\r\n        }\r\n\r\n        function insertImage() {\r\n            const url = prompt('请输入图片URL:');\r\n            if (url) {\r\n                document.execCommand('insertImage', false, url);\r\n            }\r\n        }\r\n\r\n        function renderAttachments() {\r\n            const container = document.getElementById('attachmentList');\r\n            const data = verificationData[currentVerificationIndex];\r\n            \r\n            container.innerHTML = '';\r\n            \r\n            data.attachments.forEach((att, index) => {\r\n                const item = document.createElement('div');\r\n                item.className = 'attachment-item';\r\n                \r\n                let icon = 'fa-file';\r\n                if (att.type === 'word') icon = 'fa-file-word';\r\n                if (att.type === 'pdf') icon = 'fa-file-pdf';\r\n                if (att.type === 'image') icon = 'fa-file-image';\r\n                \r\n                item.innerHTML = `\r\n                    <i class=\"fas ${icon}\"></i>\r\n                    <span>${att.name}</span>\r\n                    <span class=\"remove\" onclick=\"removeAttachment(${index})\"><i class=\"fas fa-times\"></i></span>\r\n                `;\r\n                \r\n                container.appendChild(item);\r\n            });\r\n        }\r\n\r\n        function renderAttachmentsReadOnly(data) {\r\n            const container = document.getElementById('attachmentList');\r\n            container.innerHTML = '';\r\n            \r\n            if (!data.attachments || data.attachments.length === 0) {\r\n                container.innerHTML = '<span style=\"color: #94a3b8; font-size: 13px;\">无附件</span>';\r\n                return;\r\n            }\r\n            \r\n            data.attachments.forEach((att) => {\r\n                const item = document.createElement('div');\r\n                item.className = 'attachment-item';\r\n                item.style.cursor = 'default';\r\n                \r\n                let icon = 'fa-file';\r\n                if (att.type === 'word') icon = 'fa-file-word';\r\n                if (att.type === 'pdf') icon = 'fa-file-pdf';\r\n                if (att.type === 'image') icon = 'fa-file-image';\r\n                \r\n                item.innerHTML = `\r\n                    <i class=\"fas ${icon}\"></i>\r\n                    <span>${att.name}</span>\r\n                `;\r\n                \r\n                container.appendChild(item);\r\n            });\r\n        }\r\n\r\n        function uploadAttachment() {\r\n            document.getElementById('fileInputModal').click();\r\n        }\r\n\r\n        function handleFileSelectModal(event) {\r\n            const files = event.target.files;\r\n            const data = verificationData[currentVerificationIndex];\r\n            \r\n            for (let file of files) {\r\n                let type = 'file';\r\n                if (file.name.endsWith('.doc') || file.name.endsWith('.docx')) type = 'word';\r\n                else if (file.name.endsWith('.pdf')) type = 'pdf';\r\n                else if (file.name.match(/\\.(jpg|jpeg
