
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>移动端签章方式</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: transparent;
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
            font-size: 14px;
        }

        .sign-modal-mask {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(15, 23, 42, 0.48);
            backdrop-filter: blur(3px);
            z-index: 9999;
        }

        .sign-modal-card {
            width: min(680px, calc(100% - 32px));
            overflow: hidden;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.28);
            display: flex;
            flex-direction: column;
            animation: signModalIn .22s ease-out;
        }

        @keyframes signModalIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sign-modal-header {
            flex: 0 0 auto;
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 20px 28px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .sign-modal-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #0f172a;
            font-size: 17px;
            font-weight: 800;
        }

        .sign-modal-subtitle {
            margin-top: 4px;
            color: #64748b;
            font-size: 12px;
            font-weight: 500;
        }

        .sign-modal-head-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sign-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 28px;
            padding: 0 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .sign-status-pending { background: #dbeafe; color: #1d4ed8; }
        .sign-status-signing { background: #fef3c7; color: #92400e; }
        .sign-status-signed { background: #dcfce7; color: #166534; }

        .sign-modal-close {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            transition: all .18s;
        }

        .sign-modal-close:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        .sign-modal-body {
            padding: 28px;
            background: #fff;
        }

        .mobile-sign-panel {
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            background: #f8fafc;
            padding: 24px;
        }

        .mobile-sign-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .mobile-sign-heading strong {
            display: block;
            color: #0f172a;
            font-size: 15px;
            font-weight: 800;
        }

        .mobile-sign-heading span {
            display: block;
            margin-top: 4px;
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
        }

        .mobile-sign-icon {
            width: 42px;
            height: 42px;
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: #dbeafe;
            color: #2563eb;
            font-size: 20px;
        }

        .sign-process-list {
            display: grid;
            gap: 8px;
        }

        .sign-process-line {
            height: 58px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #fff;
            color: #475569;
            font-size: 13px;
            font-weight: 700;
        }

        .sign-process-line i {
            width: 18px;
            color: currentColor;
            text-align: center;
        }

        .sign-process-line span {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 3px;
            min-height: 34px;
        }

        .sign-process-line small {
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
        }

        .sign-process-line.running {
            background: #eff6ff;
            border-color: #bfdbfe;
            color: #1d4ed8;
        }

        .sign-process-line.done {
            background: #f0fdf4;
            border-color: #bbf7d0;
            color: #166534;
        }

        .sign-modal-footer {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 14px;
            padding: 20px 28px;
            border-top: 1px solid #e2e8f0;
            background: #fff;
        }

        .action-btn {
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: #fff;
            color: #334155;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
            cursor: pointer;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: #f8fafc;
            border-color: #94a3b8;
        }

        .action-btn.primary {
            border-color: #2563eb;
            background: #2563eb;
            color: #fff;
            box-shadow: 0 6px 14px rgba(37, 99, 235, 0.2);
        }

        .action-btn.primary:hover {
            border-color: #1d4ed8;
            background: #1d4ed8;
        }

        .action-btn:disabled {
            cursor: not-allowed;
            opacity: .72;
            transform: none;
        }

        .sign-toast {
            position: fixed;
            left: 50%;
            bottom: 32px;
            transform: translateX(-50%) translateY(18px);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            max-width: calc(100vw - 32px);
            padding: 10px 14px;
            border-radius: 999px;
            background: #0f172a;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: all .2s;
            z-index: 10001;
            box-shadow: 0 14px 30px rgba(15, 23, 42, .22);
        }

        .sign-toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 520px) {
            .sign-modal-mask {
                padding: 16px;
            }

            .sign-modal-card {
                width: 100%;
            }

            .sign-modal-header,
            .sign-modal-body,
            .sign-modal-footer {
                padding-left: 18px;
                padding-right: 18px;
            }

            .sign-modal-header {
                align-items: flex-start;
            }

            .sign-modal-footer {
                justify-content: stretch;
            }

            .action-btn {
                flex: 1 1 0;
                min-width: 0;
            }
        }
    </style>
</head>
<body>
    <div class="sign-modal-mask" id="onlineSignModal" role="dialog" aria-modal="true" aria-labelledby="onlineSignTitle">
        <div class="sign-modal-card">
            <div class="sign-modal-header">
                <div>
                    <div class="sign-modal-title" id="onlineSignTitle"><i class="fas fa-mobile-screen-button"></i>移动端签章</div>
                    <div class="sign-modal-subtitle">发送审核计划 PDF 至移动端，完成签署后自动更新状态。</div>
                </div>
                <div class="sign-modal-head-actions">
                    <span class="sign-status-pill sign-status-pending" id="modalSignStatus"><i class="fas fa-clock"></i>待签章</span>
                    <button type="button" class="sign-modal-close" onclick="closeSignModal()" aria-label="关闭"><i class="fas fa-times"></i></button>
                </div>
            </div>

            <div class="sign-modal-body">
                <div class="mobile-sign-panel" id="mobileSignPanel">
                    <div class="mobile-sign-heading">
                        <div>
                            <strong>签章人：北京地铁集团</strong>
                        </div>
                        <div class="mobile-sign-icon"><i class="fas fa-mobile-screen-button"></i></div>
                    </div>
                    <div class="sign-process-list" id="mobileSignProgress">
                        <div class="sign-process-line" data-mobile-progress="0"><i class="fas fa-file-pdf"></i><span>发送PDF文件<small>等待开始</small></span></div>
                        <div class="sign-process-line" data-mobile-progress="1"><i class="fas fa-mobile-screen-button"></i><span>移动端签署中<small>等待签署</small></span></div>
                        <div class="sign-process-line" data-mobile-progress="2"><i class="fas fa-circle-check"></i><span>签署完成<small>等待完成</small></span></div>
                    </div>
                </div>
            </div>

            <div class="sign-modal-footer">
                <button type="button" class="action-btn" onclick="closeSignModal()">取消</button>
                <button type="button" class="action-btn primary" id="confirmSignBtn" onclick="simulateMobileSign()"><i class="fas fa-paper-plane"></i>开始签章</button>
            </div>
        </div>
    </div>

    <div class="sign-toast" id="signToast"><i class="fas fa-check-circle"></i><span id="signToastText"></span></div>

    <script>
        let signModalPhase = 'pending';
        let toastTimer = null;

        function setModalStatus(status) {
            const badge = document.getElementById('modalSignStatus');
            const meta = {
                pending: { text: '待签章', icon: 'fa-clock', cls: 'sign-status-pending' },
                signing: { text: '签章中', icon: 'fa-spinner fa-spin', cls: 'sign-status-signing' },
                signed: { text: '已签章', icon: 'fa-circle-check', cls: 'sign-status-signed' }
            }[status] || { text: '待签章', icon: 'fa-clock', cls: 'sign-status-pending' };

            badge.className = 'sign-status-pill ' + meta.cls;
            badge.innerHTML = '<i class="fas ' + meta.icon + '"></i>' + meta.text;
        }

        function setConfirmButton(icon, text, disabled) {
            const btn = document.getElementById('confirmSignBtn');
            btn.disabled = !!disabled;
            btn.innerHTML = '<i class="fas ' + icon + '"></i>' + text;
        }

        function setMobileProcessLineState(doneCount, runningIndex) {
            const lines = Array.from(document.querySelectorAll('#mobileSignProgress .sign-process-line'));
            lines.forEach(function (line, index) {
                const small = line.querySelector('small');
                line.classList.remove('running', 'done');
                if (index < doneCount) {
                    line.classList.add('done');
                    if (small) small.textContent = '已完成';
                } else if (index === runningIndex) {
                    line.classList.add('running');
                    if (small) small.textContent = '处理中';
                } else if (small) {
                    small.textContent = index === 0 ? '等待开始' : index === 1 ? '等待签署' : '等待完成';
                }
            });
        }

        function simulateMobileSign() {
            if (signModalPhase === 'signed') {
                closeSignModal();
                return;
            }

            if (signModalPhase === 'signing') return;

            signModalPhase = 'signing';
            setModalStatus('signing');
            setConfirmButton('fa-spinner fa-spin', '处理中', true);
            setMobileProcessLineState(0, 0);

            setTimeout(function () {
                setMobileProcessLineState(1, 1);
            }, 600);

            setTimeout(function () {
                setMobileProcessLineState(3, -1);
                setModalStatus('signed');
                setConfirmButton('fa-circle-check', '确定', false);
                signModalPhase = 'signed';
                showSignToast('移动端签署完成');
            }, 5600);
        }

        function closeSignModal() {
            document.getElementById('onlineSignModal').style.display = 'none';
        }

        function showSignToast(text) {
            const toast = document.getElementById('signToast');
            const textEl = document.getElementById('signToastText');
            textEl.textContent = text;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () {
                toast.classList.remove('show');
            }, 1800);
        }
    </script>
</body>
</html>
