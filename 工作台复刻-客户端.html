<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>体系认证数字化项目 · 客户端工作台 · 项目进度查询</title>
  <style>
    :root {
      --blue: #1f6cff;
      --ink: #172b4d;
      --muted: #7e8da3;
      --line: #e4ebf4;
      --green: #14ad72;
      --red: #ff5c64;
      --gold: #ffad14;
      --shadow: 0 3px 12px rgba(34, 67, 111, .07);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-width: 1200px;
      color: var(--ink);
      background: #eef3f9;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      font-size: 13px;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .dashboard {
      min-height: 100vh;
      padding: 0 14px 30px;
      background: linear-gradient(180deg, #e5ebf6 0, #f0f3f7 202px, #edf1f6 216px);
    }
    .topbar {
      height: 86px;
      display: flex;
      align-items: center;
      padding: 0 7px;
      position: relative;
      overflow: hidden;
    }
    .topbar:after {
      content: "";
      position: absolute;
      inset: -36px -34px auto auto;
      width: 430px;
      height: 125px;
      opacity: .46;
      pointer-events: none;
      background:
        linear-gradient(147deg, transparent 40%, rgba(126, 177, 255, .16) 41% 52%, transparent 53%),
        linear-gradient(29deg, transparent 49%, rgba(126, 177, 255, .12) 50% 67%, transparent 68%);
      transform: skewX(-20deg);
    }
    .welcome { position: relative; z-index: 1; }
    .welcome h1 { margin: 0 0 8px; color: #12233d; font-size: 20px; }
    .welcome p { margin: 0; color: #78869b; font-size: 12px; }
    .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 13px; }
    .stat-card {
      height: 116px;
      border-top: 2px solid var(--blue);
      background: linear-gradient(#fcfdff, #f5f7f9);
      padding: 19px 25px;
      position: relative;
    }
    .stat-title { color: #48566e; font-size: 12px; }
    .stat-value { margin: 11px 0 10px; color: #101e31; font-size: 25px; line-height: 1; font-weight: 700; }
    .stat-foot { color: #8a95a6; font-size: 12px; }
    .stat-foot .up { color: var(--red); margin-left: 3px; }
    .stat-foot .down { color: var(--green); margin-left: 3px; }
    .stat-icon {
      position: absolute;
      right: 20px;
      top: 33px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--blue);
      background: #eff5ff;
    }
    .stat-icon svg { width: 21px; height: 21px; }
    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 2.57fr) minmax(330px, 1fr);
      gap: 14px;
      margin-top: 14px;
    }
    .panel {
      overflow: hidden;
      border: 1px solid #dbe4f0;
      border-radius: 10px;
      background: #fff;
      box-shadow: var(--shadow);
    }
    .work-panel { height: 474px; }
    .work-head {
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 19px;
      border-bottom: 1px solid var(--line);
    }
    .tabs { height: 100%; display: flex; align-items: center; gap: 24px; }
    .tab {
      height: 100%;
      border: 0;
      background: none;
      color: #8290a7;
      position: relative;
      padding: 0;
    }
    .tab.active { color: var(--blue); font-weight: 700; }
    .tab.active:after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      background: var(--blue);
    }
    .count { margin-left: 6px; color: var(--red); font-size: 11px; }
    .tools { display: flex; align-items: center; gap: 9px; }
    .module-picker { position: relative; }
    .module-trigger {
      width: 182px;
      height: 26px;
      border: 1px solid #dbe4f0;
      border-radius: 4px;
      background: #fff;
      color: #60738f;
      padding: 0 27px 0 9px;
      text-align: left;
      font-size: 11px;
      position: relative;
    }
    .module-trigger:after {
      content: "";
      position: absolute;
      right: 10px;
      top: 10px;
      border: 4px solid transparent;
      border-top-color: #8595ad;
    }
    .module-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 31px;
      z-index: 8;
      width: 238px;
      max-height: 290px;
      overflow: auto;
      border: 1px solid #dbe4f0;
      border-radius: 8px;
      background: white;
      box-shadow: 0 16px 42px rgba(24, 44, 77, .16);
      padding: 8px;
    }
    .module-picker.open .module-menu { display: block; }
    .module-menu label {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 28px;
      padding: 4px 6px;
      border-radius: 4px;
      color: #3b506c;
      font-size: 12px;
    }
    .module-menu label:hover { background: #f5f8fc; }
    .module-actions {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 4px 2px;
      border-top: 1px solid var(--line);
      margin-top: 4px;
    }
    .module-actions button, .tools button {
      height: 26px;
      border: 0;
      border-radius: 4px;
      color: white;
      background: var(--blue);
      padding: 0 12px;
      font-size: 11px;
    }
    .module-actions .clear-btn { background: #8796ab; }
    .tools .more-btn { background: #0fbd83; }
    .task-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .task-table th {
      height: 44px;
      color: #65758f;
      background: #f7f9fc;
      font-size: 11px;
      font-weight: 500;
      text-align: left;
      padding: 0 10px;
      white-space: nowrap;
    }
    .task-table td {
      height: 64px;
      border-bottom: 1px solid #edf1f6;
      padding: 0 10px;
      color: #294567;
      vertical-align: middle;
      font-size: 11px;
    }
    .task-table th:nth-child(1), .task-table td:nth-child(1) { width: 32%; }
    .task-table th:nth-child(2), .task-table td:nth-child(2) { width: 18%; }
    .task-table th:nth-child(3), .task-table td:nth-child(3) { width: 15%; }
    .task-table th:nth-child(4), .task-table td:nth-child(4) { width: 13%; }
    .task-table th:nth-child(5), .task-table td:nth-child(5) { width: 12%; }
    .task-table th:nth-child(6), .task-table td:nth-child(6) { width: 10%; }
    .task-name { color: #1f3653; font-weight: 700; }
    .tag {
      display: block;
      width: fit-content;
      border-radius: 3px;
      padding: 2px 5px;
      margin-top: 5px;
      color: #2874ff;
      background: #eef5ff;
      font-size: 10px;
      line-height: 1.5;
      font-weight: 500;
    }
    .tag.green { color: #1aa872; background: #e8fbf2; }
    .tag.gold { color: #b77700; background: #fff4d9; }
    .tag.gray { color: #7488a2; background: #f0f3f7; }
    .sub { display: block; color: #8796ab; font-size: 10px; margin-top: 4px; }
    .handle {
      color: var(--blue);
      border: 1px solid #bcd3ff;
      border-radius: 3px;
      background: #fff;
      padding: 4px 10px;
      font-size: 11px;
      white-space: nowrap;
    }
    .empty-row { display: none; height: 260px; text-align: center; color: #9aa8b9; }
    .table-pager, .pager {
      height: 38px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      color: #6f7e92;
      font-size: 12px;
      border-top: 1px solid var(--line);
    }
    .table-pager button, .pager button {
      height: 26px;
      min-width: 28px;
      border: 1px solid #d4dfed;
      border-radius: 4px;
      background: white;
      color: #31547c;
    }
    .table-pager button.active, .pager button.active { background: var(--blue); color: white; border-color: var(--blue); }
    .table-pager button:disabled, .pager button:disabled { color: #b4bfcc; cursor: not-allowed; }
    .work-panel.history-mode .task-table th:nth-child(1), .work-panel.history-mode .task-table td:nth-child(1) { width: 34%; }
    .work-panel.history-mode .task-table th:nth-child(2), .work-panel.history-mode .task-table td:nth-child(2) { width: 20%; }
    .work-panel.history-mode .task-table th:nth-child(3), .work-panel.history-mode .task-table td:nth-child(3) { width: 16%; }
    .work-panel.history-mode .task-table th:nth-child(4), .work-panel.history-mode .task-table td:nth-child(4) { width: 14%; }
    .work-panel.history-mode .task-table th:nth-child(5), .work-panel.history-mode .task-table td:nth-child(5) { width: 16%; }
    .panel-heading {
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
    }
    .panel-heading h2 { margin: 0; color: #1b2e4b; font-size: 13px; }
    .panel-heading h2:before {
      content: "";
      display: inline-block;
      width: 3px;
      height: 16px;
      margin-right: 8px;
      border-radius: 2px;
      background: var(--blue);
      vertical-align: -3px;
    }
    .panel-heading a { color: #56708f; font-size: 11px; text-decoration: none; }
    .monitor-panel { height: 474px; }
    .monitor-panel .panel-heading h2:before { background: var(--red); }
    .monitor-tabs {
      height: 32px;
      display: flex;
      gap: 16px;
      padding: 0 17px;
      border-bottom: 1px solid var(--line);
    }
    .monitor-tabs button {
      position: relative;
      border: 0;
      background: none;
      color: #8290a7;
      font-size: 10px;
      padding: 0;
    }
    .monitor-tabs button.active { color: #1d2738; font-weight: 700; }
    .monitor-tabs button.active:after {
      content: "";
      height: 2px;
      background: var(--blue);
      position: absolute;
      left: -3px;
      right: -3px;
      bottom: -1px;
    }
    .monitor-list { height: 396px; overflow: auto; padding: 12px 16px 0; }
    .monitor-item {
      min-height: 98px;
      border: 1px solid #ffd77c;
      border-radius: 7px;
      padding: 10px 10px 8px;
      margin-bottom: 10px;
      background: #fffbef;
      font-size: 11px;
      position: relative;
    }
    .monitor-item.blue { border-color: #bdd8ff; background: #f1f7ff; }
    .monitor-item strong { display: block; color: #1b2b41; margin: 7px 0 4px; }
    .monitor-item .kind { color: #a67200; font-weight: 700; }
    .monitor-item.blue .kind { color: #2e60bf; }
    .pill {
      float: right;
      padding: 3px 6px;
      border-radius: 4px;
      background: #fff0c2;
      color: #b87800;
      font-weight: 700;
    }
    .blue .pill { color: #3270da; background: #e0edff; }
    .monitor-meta { display: flex; justify-content: space-between; gap: 8px; color: #415676; }
    .monitor-status {
      display: inline-block;
      color: #a77b00;
      background: #fff2bf;
      padding: 2px 4px;
      margin-top: 7px;
      border-radius: 3px;
    }
    .blue .monitor-status { color: #159964; background: #dcf8e9; }
    .monitor-action { float: right; color: var(--blue); text-decoration: none; margin-top: 8px; }
    .notice-panel { height: 300px; margin-top: 14px; }
    .notice-panel .panel-heading h2:before { background: var(--gold); }
    .notice-list { height: 254px; overflow: auto; padding: 12px 16px; display: grid; gap: 10px; }
    .notice-item {
      border: 1px solid #e8eef7;
      border-radius: 7px;
      background: #fbfcff;
      padding: 10px 12px;
      font-size: 11px;
    }
    .notice-date { color: var(--blue); font-weight: 700; margin-right: 8px; }
    .notice-title { color: #1b2b41; font-weight: 700; }
    .notice-content { margin: 6px 0; color: #415676; line-height: 1.55; }
    .notice-time { color: #95a2b5; }
    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
    .chart-panel { height: 300px; }
    .chart-panel .panel-heading { border-bottom: 0; }
    .chart-panel.domain .panel-heading h2:before { background: var(--green); }
    .chart-area { height: 245px; padding: 7px 18px 12px; position: relative; }
    .bar-chart {
      height: 192px;
      margin: 0 10px 0 31px;
      position: relative;
      display: flex;
      align-items: end;
      justify-content: space-around;
      background: repeating-linear-gradient(to bottom, #e8edf5 0 1px, transparent 1px 38.4px);
    }
    .y-labels {
      position: absolute;
      left: -28px;
      top: -4px;
      bottom: -4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #98a3b1;
      font-size: 10px;
    }
    .bar {
      width: 16px;
      border-radius: 4px 4px 0 0;
      background: #3e82ef;
      min-height: 7px;
      position: relative;
      transition: filter .15s;
    }
    .bar:hover { filter: brightness(1.08); }
    .bar:after {
      content: attr(data-label);
      position: absolute;
      top: calc(100% + 8px);
      width: 45px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: #7889a1;
      font-size: 10px;
    }
    .donut-wrap { height: 220px; display: flex; align-items: center; justify-content: center; gap: 28px; }
    .donut-svg { width: 168px; height: 168px; transform: rotate(-90deg); overflow: visible; }
    .donut-seg {
      fill: none;
      stroke-width: 28;
      cursor: default;
      transition: stroke-width .15s, opacity .15s;
    }
    .donut-seg:hover { stroke-width: 31; opacity: .92; }
    .donut-hole { fill: white; }
    .legend { display: grid; gap: 6px; color: #6f7e92; font-size: 10px; }
    .legend i { display: inline-block; width: 8px; height: 8px; margin-right: 7px; }
    .tooltip {
      position: fixed;
      z-index: 20;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -110%);
      background: #1e2d45;
      color: white;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      white-space: nowrap;
      box-shadow: 0 10px 28px rgba(10, 29, 55, .18);
      transition: opacity .12s;
    }
    .tooltip.show { opacity: 1; }
    dialog {
      width: 1120px;
      max-width: 94vw;
      border: 1px solid #dbe4f0;
      border-radius: 10px;
      padding: 0;
      color: var(--ink);
      box-shadow: 0 20px 80px rgba(24, 44, 77, .25);
    }
    dialog::backdrop { background: rgba(23, 43, 77, .35); }
    .dialog-head {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
    }
    .dialog-head h2 { margin: 0; font-size: 17px; }
    .dialog-head button { border: 0; background: none; color: #8090a9; font-size: 24px; }
    .dialog-body { padding: 18px 22px 20px; line-height: 1.7; }
    .dialog-actions { border-top: 1px solid var(--line); padding: 14px 22px; text-align: right; }
    .dialog-actions button {
      border: 1px solid #cad9ed;
      background: #fff;
      border-radius: 4px;
      padding: 7px 16px;
      margin-left: 8px;
      color: #31547c;
    }
    .modal-filter-row { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-bottom: 16px; }
    .modal-table { width: 100%; border-collapse: collapse; table-layout: fixed; border: 1px solid var(--line); }
    .modal-table th, .modal-table td {
      border-bottom: 1px solid var(--line);
      padding: 9px 10px;
      text-align: left;
      font-size: 12px;
      vertical-align: top;
    }
    .modal-table th { background: #f7f9fc; color: #65758f; font-weight: 500; }
    .modal-table th:nth-child(1), .modal-table td:nth-child(1) { width: 32%; }
    .modal-table th:nth-child(2), .modal-table td:nth-child(2) { width: 18%; }
    .modal-table th:nth-child(3), .modal-table td:nth-child(3) { width: 15%; }
    .modal-table th:nth-child(4), .modal-table td:nth-child(4) { width: 13%; }
    .modal-table th:nth-child(5), .modal-table td:nth-child(5) { width: 12%; }
    .modal-table th:nth-child(6), .modal-table td:nth-child(6) { width: 10%; }
    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #1e2d45;
      color: white;
      padding: 11px 16px;
      border-radius: 7px;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(10px);
      transition: .2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* 通用B端设计规范重构 */
    :root {
      --blue: #2563eb;
      --blue-hover: #1d4ed8;
      --ink: #1e293b;
      --muted: #64748b;
      --line: #e2e8f0;
      --soft-line: #f1f5f9;
      --page: #f8fafc;
      --surface: #fff;
      --green: #059669;
      --red: #dc2626;
      --gold: #d97706;
      --shadow: 0 1px 2px rgba(15, 23, 42, .04);
      --shadow-hover: 0 4px 12px rgba(59, 130, 246, .12);
      --shadow-float: 0 8px 24px rgba(15, 23, 42, .12);
    }
    body {
      min-width: 0;
      background: var(--page);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.6;
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    .dashboard {
      min-height: 100vh;
      padding: 0 32px 40px;
      background: var(--page);
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 68px;
      margin: 0 -32px 20px;
      padding: 0 32px;
      background: rgba(255, 255, 255, .96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }

    .welcome h1 {
      margin-bottom: 2px;
      color: #0f172a;
      font-size: 20px;
      font-weight: 700;
    }
    .welcome p { color: var(--muted); font-size: 12px; }
    .stats {
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .stat-card {
      height: 104px;
      padding: 16px;
      border: 1px solid var(--line);

    .stat-title { color: var(--muted); font-size: 12px; }

    .stat-foot { color: #94a3b8; font-size: 12px; }
    .stat-foot .up { color: var(--red); }
    .stat-foot .down { color: var(--green); }
    .stat-icon {
      top: 22px;
      right: 16px;
      width: 40px;
      height: 40px;
      color: #2563eb;
      background: #eff6ff;
    }

      grid-template-columns: minmax(720px, 1fr) minmax(360px, 420px);
      gap: 16px;
      margin-top: 0;
      align-items: start;
    }
    .panel {
      border: 1px solid var(--line);

      background: var(--surface);

      border-bottom: 1px solid var(--line);

    function taskLabel(item) {
      return `<span class="task-name">${esc(item.desc)}</span><span class="tag ${moduleClassMap[item.module] || ''}">${esc(item.module)}</span>`;
    }
    function filteredRows(source) {
      return source.filter(item => {
        const moduleMatched = source === historyItems || state.selectedModules.includes(item.module);
        return moduleMatched;
      });
    }

      return filteredRows(state.tab === 'history' ? historyItems : todoItems);

      const common = `<tr><td>${taskLabel(item)}</td><td>${esc(item.submitter)}</td><td>${esc(item.createDate)}</td><td>${esc(item.duration)}</td><td>${esc(item.processTime)}</td>`;
      return state.tab === 'history' ? `${common}</tr>` : `${common}<td><button class="handle" type="button" data-id="${esc(item.id)}">处理</button></td></tr>`;
    }
    function renderPager(target, page, pageCount, prefix, total) {
      target.innerHTML = `<span>共 ${total} 条，第 ${page} / ${pageCount} 页</span><button type="button" data-${prefix}="prev" ${page === 1 ? 'disabled' : ''}>上一页</button>${Array.from({ length: pageCount }, (_, i) => `<button type="button" data-${prefix}="${i + 1}" class="${page === i + 1 ? 'active' : ''}">${i + 1}</button>`).join('')}<button type="button" data-${prefix}="next" ${page === pageCount ? 'disabled' : ''}>下一页</button>`;
    }
    function renderMainTasks() {
      const rows = visibleRows();
      const pageCount = Math.max(1, Math.ceil(rows.length / state.pageSize));
      state.page = Math.min(state.page, pageCount);
      const pageRows = rows.slice((state.page - 1) * state.pageSize, state.page * state.pageSize);
      const empty = $('#emptyRow');
      $('.work-panel').classList.toggle('history-mode', state.tab === 'history');
      $('#taskHead').innerHTML = headersHTML();
      $('#taskBody').innerHTML = pageRows.map(item => rowHTML(item)).join('');
      $('#taskBody').append(empty);
      empty.firstElementChild.colSpan = state.tab === 'history' ? 5 : 6;
      empty.style.display = rows.length ? 'none' : 'table-row';
      $('#visibleCount').textContent = todoItems.length;
      renderPager($('#mainPager'), state.page, pageCount, 'page', rows.length);
    }
    function filteredProjectRows() {
      return projectProgressItems.filter(item => {
        const auditTypeMatched = !state.progressAuditType || item.auditType === state.progressAuditType;
        const fieldMatched = !state.progressField || item.field === state.progressField;
        const stageMatched = !state.progressStage || item.stage === state.progressStage;
        return auditTypeMatched && fieldMatched && stageMatched;
      });
    }
    function renderProgressFilters() {
      $('#progressAuditTypeFilter').innerHTML = '<option value="">全部审核类型</option>' + auditTypes.map(type => `<option value="${esc(type)}">${esc(type)}</option>`).join('');
      $('#progressFieldFilter').innerHTML = '<option value="">全部认证领域</option>' + certificationFields.map(field => `<option value="${esc(field)}">${esc(field)}</option>`).join('');
      $('#progressStageFilter').innerHTML = '<option value="">全部项目进度</option>' + projectStages.map(stage => `<option value="${esc(stage)}">${esc(stage)}</option>`).join('');
    }
    function progressRowHTML(item) {
      return `<tr><td><span class="task-name">${esc(item.customer)}</span></td><td>${esc(item.field)}</td><td><span class="progress-code">${esc(item.projectNo)}</span></td><td>${esc(item.auditType)}</td><td><button class="progress-stage" type="button" data-project-no="${esc(item.projectNo)}">${esc(item.stage)}</button></td><td>${esc(item.createDate)}</td><td>${esc(item.duration)}</td><td>${esc(item.handler)}</td><td><button class="handle" type="button" data-project-no="${esc(item.projectNo)}">查看详情</button></td></tr>`;
    }
    function renderProjectProgress() {
      const rows = filteredProjectRows();
      const pageCount = Math.max(1, Math.ceil(rows.length / state.progressPageSize));
      state.progressPage = Math.min(state.progressPage, pageCount);
      const pageRows = rows.slice((state.progressPage - 1) * state.progressPageSize, state.progressPage * state.progressPageSize);
      $('#progressBody').innerHTML = pageRows.map(progressRowHTML).join('') || '<tr><td colspan="9">没有匹配的项目进度</td></tr>';
      renderPager($('#progressPager'), state.progressPage, pageCount, 'progresspage', rows.length);
    }
    function applicableProjectStages(item) {
      if (item.auditType === '监督' || item.auditType === '证书变更') {
        return projectStages.filter(stage => !['认证申请', '一阶段审核任务'].includes(stage));
      }
      if (item.auditType === '认证转换') {
        return projectStages.filter(stage => !['一阶段审核任务', '二阶段审核任务'].includes(stage));
      }
      return projectStages;
    }
    function stageCompletionRows(item) {
      const applicableStages = applicableProjectStages(item);
      const activeIndex = applicableStages.indexOf(item.stage);
      const start = new Date(item.createDate + 'T09:00:00');
      return projectStages.map((stage, index) => {
        if (!applicableStages.includes(stage)) return { stage, time: '-', handler: '-', state: 'not-applicable' };
        const applicableIndex = applicableStages.indexOf(stage);
        const handler = projectHandlers[(index + projectProgressItems.indexOf(item)) % projectHandlers.length];
        if (applicableIndex > activeIndex) return { stage, time: '-', handler: '-', state: 'pending' };
        const d = new Date(start);
        d.setDate(start.getDate() + applicableIndex);
        const pad = n => String(n).padStart(2, '0');
        const time = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(9 + (applicableIndex % 7))}:30`;
        return { stage, time: applicableIndex === activeIndex ? '-' : time, handler, state: applicableIndex === activeIndex ? 'active' : 'completed' };
      });
    }
    function showProjectTrack(projectNo) {
      const item = projectProgressItems.find(row => row.projectNo === projectNo);

    function bindTooltip(el, text) {

        tooltip.classList.add('show');

        bar.style.height = `${value / 150 * 100}%`;
        bindTooltip(bar, `${label}：${value} 单`);
        $('#trendChart').append(bar);
      });

    function renderDomainChart() {
      const data = [['QMS',520,'#3f82ee'], ['EMS',90,'#14ad72'], ['OHSMS',190,'#ffac11'], ['FSMS',100,'#8954e7'], ['HACCP',50,'#ee4c94'], ['其他',50,'#68758b']];
      const total = data.reduce((sum, row) => sum + row[1], 0);
      const radius = 62;
      const circumference = 2 * Math.PI * radius;
      let offset = 0;
      $('#domainChart').innerHTML = '<circle class="donut-hole" cx="90" cy="90" r="50"></circle>';
      data.forEach(([name, value, color]) => {
        const seg = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        const length = value / total * circumference;
        seg.setAttribute('class', 'donut-seg');
        seg.setAttribute('cx', '90');
        seg.setAttribute('cy', '90');
        seg.setAttribute('r', String(radius));
        seg.setAttribute('stroke', color);
        seg.setAttribute('stroke-dasharray', `${length} ${circumference - length}`);
        seg.setAttribute('stroke-dashoffset', String(-offset));
        bindTooltip(seg, `${name}：${value} 张`);
        $('#domainChart').append(seg);
        offset += length;
      });
      $('#domainLegend').innerHTML = data.map(([name, value, color]) => `<span><i style="background:${color}"></i>${name} ${value}</span>`).join('');
    }

      return `<article class="notice-item"><div><span class="notice-date">${esc(date)}</span><span class="notice-title">${esc(title)}</span></div><div class="notice-content">${esc(content)}</div><div class="notice-time">发布时间：${esc(time)}</div></article>`;
    }
    function renderNotices() {
      $('#noticeList').innerHTML = notices.slice(0, 5).map(noticeHTML).join('');
    }
    function renderNoticeDialog() {
      const rows = filteredNotices();
      const pageCount = Math.max(1, Math.ceil(rows.length / state.noticePageSize));
      state.noticePage = Math.min(state.noticePage, pageCount);
      const pageRows = rows.slice((state.noticePage - 1) * state.noticePageSize, state.noticePage * state.noticePageSize);
      $('.notice-dialog-body').innerHTML = `<div class="notice-list notice-dialog-list">${pageRows.map(noticeHTML).join('') || '<article class="notice-item">暂无通知内容</article>'}</div><div class="pager" id="noticePager"></div>`;
      renderPager($('#noticePager'), state.noticePage, pageCount, 'noticepage', rows.length);
      $('#noticePager').onclick = handlePagerClick;
    }
    function filteredMonitorItems() {
      return monitorItems.filter(item => !state.monitorCategory || item.category === state.monitorCategory);
    }
    function monitorCardHTML(item) {
      const toneClass = item.tone === 'info' ? 'blue' : item.tone === 'risk' ? 'risk' : '';
      return `<article class="monitor-item ${toneClass}"><span class="kind">${esc(item.category)}</span><span class="pill">剩${esc(item.days)}天</span><strong>${esc(item.company)}</strong><div class="monitor-meta"><span>${esc(item.field)}</span><span>审核截止日：${esc(item.dueDate)}</span></div><span class="monitor-status">${esc(item.status)}</span></article>`;
    }
    function renderMonitorTabs() {
      const allCount = monitorItems.length;
      const buttons = [`<button class="${state.monitorCategory === '' ? 'active' : ''}" type="button" data-monitor-category="">全部 (${allCount})</button>`].concat(monitorCategories.map(category => {
        const count = monitorItems.filter(item => item.category === category).length;
        return `<button class="${state.monitorCategory === category ? 'active' : ''}" type="button" data-monitor-category="${esc(category)}">${esc(category)} (${count})</button>`;
      }));
      $('#monitorTabs').innerHTML = buttons.join('');
      $$('#monitorTabs button').forEach(button => {
        button.onclick = () => {
          state.monitorCategory = button.dataset.monitorCategory;
          state.monitorPage = 1;
          renderMonitorTabs();
          renderMonitorList();
          if ($('#monitorDialog').open) renderMonitorDialog();
        };
      });
    }
    function renderMonitorList() {
      $('#monitorList').innerHTML = filteredMonitorItems().slice(0, 5).map(monitorCardHTML).join('');
    }
    function renderMonitorDialog() {
      const rows = filteredMonitorItems();
      const pageCount = Math.max(1, Math.ceil(rows.length / state.monitorPageSize));
      state.monitorPage = Math.min(state.monitorPage, pageCount);
      const pageRows = rows.slice((state.monitorPage - 1) * state.monitorPageSize, state.monitorPage * state.monitorPageSize);
      const filterButtons = [''].concat(monitorCategories).map(category => {
        const label = category || '全部';
        const count = category ? monitorItems.filter(item => item.category === category).length : monitorItems.length;
        return `<button class="${state.monitorCategory === category ? 'active' : ''}" type="button" data-dialog-monitor-category="${esc(category)}">${esc(label)} (${count})</button>`;
      }).join('');
      const bodyRows = pageRows.map(item => `<tr><td>${esc(item.category)}</td><td>${esc(item.company)}</td><td>${esc(item.field)}</td><td>${esc(item.dueDate)}</td><td>剩${esc(item.days)}天</td><td><span class="monitor-status">${esc(item.status)}</span></td></tr>`).join('');
      $('.monitor-dialog-body').innerHTML = `<div class="modal-filter-row monitor-filter-row"><div class="monitor-filter-tabs">${filterButtons}</div></div><table class="modal-table monitor-modal-table"><thead><tr><th>类别</th><th>企业名称</th><th>领域</th><th>审核截止日</th><th>剩余天数</th><th>状态</th></tr></thead><tbody>${bodyRows || '<tr><td colspan="6">没有匹配的数据</td></tr>'}</tbody></table><div class="pager" id="monitorPager"></div>`;
      renderPager($('#monitorPager'), state.monitorPage, pageCount, 'monitorpage', rows.length);
      $$('.monitor-filter-tabs button').forEach(button => {
        button.onclick = () => {
          state.monitorCategory = button.dataset.dialogMonitorCategory;
          state.monitorPage = 1;
          renderMonitorTabs();
          renderMonitorList();
          renderMonitorDialog();
        };
      });
      $('#monitorPager').onclick = handlePagerClick;
    }
    function handlePagerClick(event) {
      const button = event.target.closest('button');
      if (!button || button.disabled) return;
      const pageCount = Math.max(1, Math.ceil(visibleRows().length / state.pageSize));
      const modalPageCount = Math.max(1, Math.ceil(visibleRows().length / state.modalPageSize));
      if (button.dataset.page) {
        const page = button.dataset.page;
        state.page = page === 'prev' ? Math.max(1, state.page - 1) : page === 'next' ? Math.min(pageCount, state.page + 1) : Number(page);
        renderMainTasks();
      }
      if (button.dataset.modalpage) {
        const page = button.dataset.modalpage;
        state.modalPage = page === 'prev' ? Math.max(1, state.modalPage - 1) : page === 'next' ? Math.min(modalPageCount, state.modalPage + 1) : Number(page);
        renderMoreDialog();
      }
      if (button.dataset.progresspage) {
        const progressPageCount = Math.max(1, Math.ceil(filteredProjectRows().length / state.progressPageSize));
        const page = button.dataset.progresspage;
        state.progressPage = page === 'prev' ? Math.max(1, state.progressPage - 1) : page === 'next' ? Math.min(progressPageCount, state.progressPage + 1) : Number(page);
        renderProjectProgress();
      }
      if (button.dataset.noticepage) {
        const noticePageCount = Math.max(1, Math.ceil(filteredNotices().length / state.noticePageSize));
        const page = button.dataset.noticepage;
        state.noticePage = page === 'prev' ? Math.max(1, state.noticePage - 1) : page === 'next' ? Math.min(noticePageCount, state.noticePage + 1) : Number(page);
        renderNoticeDialog();
      }
      if (button.dataset.monitorpage) {
        const monitorPageCount = Math.max(1, Math.ceil(filteredMonitorItems().length / state.monitorPageSize));
        const page = button.dataset.monitorpage;
        state.monitorPage = page === 'prev' ? Math.max(1, state.monitorPage - 1) : page === 'next' ? Math.min(monitorPageCount, state.monitorPage + 1) : Number(page);
        renderMonitorDialog();
      }
    }
    $('#moduleTrigger').onclick = () => $('#modulePicker').classList.toggle('open');
    $('#moduleMenu').onclick = event => {
      if (event.target.id === 'applyModules') {
        state.selectedModules = $$('#moduleMenu input:checked').map(input => input.value);
        state.page = 1;
        renderMainTasks();
        updateModuleTrigger();
        $('#modulePicker').classList.remove('open');
      }
      if (event.target.id === 'clearModules') {
        state.selectedModules = [];
        state.page = 1;
        renderModuleMenu();
        renderMainTasks();
        $('#modulePicker').classList.remove('open');
      }
    };
    $('.dialog-body').onclick = event => {
      const button = event.target.closest('.handle');
      if (button) showToast(state.tab === 'history' ? '已查看已办记录' : '已进入处理流程');
    };
    $('#mainPager').onclick = handlePagerClick;
    $('#progressPager').onclick = handlePagerClick;
    $('#progressSearchBtn').onclick = runProgressSearch;
    $('#progressAuditTypeFilter').onchange = runProgressSearch;
    $('#progressFieldFilter').onchange = runProgressSearch;
    $('#progressStageFilter').onchange = runProgressSearch;
    $('#progressBody').onclick = event => {
      const button = event.target.closest('[data-project-no]');
      if (button) showProjectTrack(button.dataset.projectNo);
    };
    $('#projectTrackDialog .dialog-head button').onclick = () => $('#projectTrackDialog').close();
    function runMainSearch() {
      syncFilters('main');
      state.page = 1;
      state.modalPage = 1;
      renderMainTasks();
      if ($('#moreDialog').open) renderMoreDialog();
    }
    $('#searchBtn').onclick = runMainSearch;
    $('#moreBtn').onclick = () => {
      state.modalPage = 1;
      syncFilters('main');
      $('#moreDialog').showModal();
      renderMoreDialog();
    };
    $('#moreDialog .dialog-head button').onclick = () => $('#moreDialog').close();
    $('#noticeMoreBtn').onclick = event => {
      event.preventDefault();
      state.noticePage = 1;
      renderNoticeDialog();
      $('#noticeDialog').showModal();
    };
    $('#noticeDialog .dialog-head button').onclick = () => $('#noticeDialog').close();
    $('#monitorMoreBtn').onclick = event => {
      event.preventDefault();
      state.monitorPage = 1;
      renderMonitorTabs();
      renderMonitorDialog();
      $('#monitorDialog').showModal();
    };
    $('#monitorDialog .dialog-head button').onclick = () => $('#monitorDialog').close();
    $('#taskBody').onclick = event => {
      const button = event.target.closest('.handle');
      if (!button) return;
      showToast(state.tab === 'history' ? '已查看已办记录' : '已进入处理流程');
    };
    $$('.tab').forEach(button => {
      button.onclick = () => {
        state.tab = button.dataset.tab;
        state.page = 1;
        $$('.tab').forEach(tab => tab.classList.toggle('active', tab === button));
        renderMainTasks();
      };
    });
    document.addEventListener('click', event => {
      if (!event.target.closest('#modulePicker')) $('#modulePicker').classList.remove('open');
      if (!event.target.closest('#modalModulePicker')) $('#modalModulePicker')?.classList.remove('open');
    });
    renderModuleMenu();
    renderMainTasks();
    renderProgressFilters();
    renderProjectProgress();
    renderTrendChart();
    renderDomainChart();
    renderMonitorTabs();
    renderMonitorList();
    renderNotices();
  </script>
</body>
</html>
