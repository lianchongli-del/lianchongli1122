<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上传客户签名扫描件</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 600px;
      height: 480px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      font-size: 14px;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .upload-modal {
      width: 600px;
      height: 480px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      box-shadow: 0 28px 80px rgba(15, 23, 42, .18);
    }

    .modal-header {
      flex: 0 0 auto;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 28px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }

    .modal-title {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #0f172a;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
    }

    .modal-title i {
      color: #2563eb;
      font-size: 17px;
    }

    .close-btn {
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      font-size: 16px;
      transition: background .18s ease, color .18s ease;
    }

    .close-btn:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    .modal-body {
      flex: 1 1 auto;
      min-height: 0;
      padding: 24px 28px;
      overflow: auto;
      background: #fff;
    }

    .process-flow {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 30px minmax(0, 1fr) 30px minmax(0, 1fr);
      align-items: start;
      margin-bottom: 18px;
    }

    .flow-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .step-num {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: #e2e8f0;
      color: #64748b;
      font-size: 13px;
      font-weight: 800;
    }

    .flow-step.completed .step-num {
      background: #dcfce7;
      color: #15803d;
    }

    .flow-step.active .step-num {
      background: #dbeafe;
      color: #2563eb;
    }

    .step-text {
      max-width: 118px;
      text-align: center;
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
    }

    .flow-step.completed .step-text,
    .flow-step.active .step-text {
      color: #334155;
    }

    .flow-arrow {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 800;
    }

    .info-banner {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 16px;
      padding: 12px 14px;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 13px;
      line-height: 1.55;
      font-weight: 600;
    }

    .info-banner i {
      margin-top: 2px;
      color: #2563eb;
    }

    .upload-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 142px;
      padding: 26px 20px;
      border: 1.5px dashed #cbd5e1;
      border-radius: 14px;
      background: #f8fafc;
      text-align: center;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }

    .upload-container:hover,
    .upload-container.dragging {
      border-color: #2563eb;
      background: #eff6ff;
      box-shadow: inset 0 0 0 1px rgba(37, 99, 235, .08);
    }

    .upload-icon {
      width: 46px;
      height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      border-radius: 16px;
      background: #e0edff;
      color: #2563eb;
      font-size: 22px;
    }

    .upload-text p {
      margin: 0;
    }

    .primary-text {
      color: #334155;
      font-size: 14px;
      font-weight: 800;
    }

    .secondary-text {
      margin-top: 5px !important;
      color: #64748b;
      font-size: 12px;
      font-weight: 500;
    }

    .file-list {
      max-height: 108px;
      margin-top: 14px;
      overflow: auto;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      padding: 10px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      background: #fff;
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1 1 auto;
      min-width: 0;
    }

    .file-icon {
      flex: 0 0 auto;
      color: #2563eb;
      font-size: 15px;
    }

    .file-name {
      min-width: 0;
      overflow: hidden;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-size {
      flex: 0 0 auto;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
    }

    .file-delete {
      flex: 0 0 auto;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #ef4444;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 8px;
    }

    .file-delete:hover {
      background: #fee2e2;
    }

    .modal-footer {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 18px 28px;
      background: #fff;
      border-top: 1px solid #e2e8f0;
    }

    .btn {
      min-width: 108px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid #d7dee8;
      border-radius: 10px;
      background: #fff;
      color: #334155;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 2px 5px rgba(15, 23, 42, .06);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: #cbd5e1;
      box-shadow: 0 8px 20px rgba(15, 23, 42, .1);
    }

    .btn-primary {
      border-color: #2563eb;
      background: #2563eb;
      color: #fff;
      box-shadow: 0 10px 24px rgba(37, 99, 235, .24);
    }

    .btn-primary:hover {
      border-color: #1d4ed8;
      background: #1d4ed8;
      box-shadow: 0 12px 28px rgba(37, 99, 235, .28);
    }

    .modal-body::-webkit-scrollbar,
    .file-list::-webkit-scrollbar {
      width: 6px;
    }

    .modal-body::-webkit-scrollbar-track,
    .file-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .modal-body::-webkit-scrollbar-thumb,
    .file-list::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="upload-modal">
    <div class="modal-header">
      <div class="modal-title"><i class="fas fa-file-arrow-up"></i>上传客户签名扫描件</div>
      <button class="close-btn" onclick="closeModal()" aria-label="关闭"><i class="fas fa-times"></i></button>
    </div>

    <div class="modal-body">
      <div class="process-flow">
        <div class="flow-step completed">
          <span class="step-num">1</span>
          <span class="step-text">回传客户</span>
        </div>
        <div class="flow-arrow"><i class="fas fa-angle-right"></i></div>
        <div class="flow-step completed">
          <span class="step-num">2</span>
          <span class="step-text">客户下载盖章</span>
        </div>
        <div class="flow-arrow"><i class="fas fa-angle-right"></i></div>
        <div class="flow-step active">
          <span class="step-num">3</span>
          <span class="step-text">客服上传扫描件</span>
        </div>
      </div>

      <div class="info-banner">
        <i class="fas fa-circle-info"></i>
        <span>客户已完成线下签字盖章，请将扫描后的文件上传至系统。</span>
      </div>

      <div class="upload-container" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" style="display: none;" accept=".pdf,.jpg,.jpeg,.png" multiple onchange="handleFiles(this.files)">
        <div class="upload-icon"><i class="fas fa-cloud-arrow-up"></i></div>
        <div class="upload-text">
          <p class="primary-text">点击或拖拽文件至此处上传</p>
          <p class="secondary-text">支持 PDF、JPG、PNG 格式，单个文件不超过 20MB</p>
        </div>
      </div>

      <div class="file-list" id="fileList">
        <!-- 已上传文件将显示在这里 -->
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()"><i class="fas fa-xmark"></i>取消</button>
      <button class="btn btn-primary" onclick="submitUpload()"><i class="fas fa-check"></i>确认上传</button>
    </div>
  </div>

  <script>
    let uploadedFiles = [];

    function handleFiles(files) {
      const fileList = document.getElementById('fileList');

      Array.from(files).forEach(function (file) {
        const validTypes = ['application/pdf', 'image/jpeg', 'image/jpg', 'image/png'];
        if (!validTypes.includes(file.type)) {
          alert('不支持的文件格式：' + file.name);
          return;
        }

        if (file.size > 20 * 1024 * 1024) {
          alert('文件大小超过20MB限制：' + file.name);
          return;
        }

        uploadedFiles.push(file);

        const fileSize = formatFileSize(file.size);
        const fileItem = document.createElement('div');
        fileItem.className = 'file-item';
        fileItem.innerHTML =
          '<div class="file-info">' +
            '<i class="file-icon fas fa-file-lines"></i>' +
            '<span class="file-name" title="' + escapeHtml(file.name) + '">' + escapeHtml(file.name) + '</span>' +
            '<span class="file-size">' + fileSize + '</span>' +
          '</div>' +
          '<button class="file-delete" onclick="removeFile(this, ' + JSON.stringify(file.name).replace(/"/g, '&quot;') + ')">删除</button>';

        fileList.appendChild(fileItem);
      });

      document.getElementById('fileInput').value = '';
    }

    function formatFileSize(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function removeFile(btn, fileName) {
      const item = btn.closest('.file-item');
      if (item) item.remove();
      uploadedFiles = uploadedFiles.filter(function (file) { return file.name !== fileName; });
    }

    function submitUpload() {
      if (uploadedFiles.length === 0) {
        alert('请先选择要上传的文件');
        return;
      }

      alert('成功上传 ' + uploadedFiles.length + ' 个文件，申请单状态将更新为待受理');
      closeModal();
    }

    function closeModal() {
      if (confirm('确定要关闭弹窗吗？未上传的文件将丢失。')) {
        document.querySelector('.upload-modal').style.display = 'none';
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, function (char) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[char];
      });
    }

    const dropZone = document.getElementById('dropZone');

    dropZone.addEventListener('dragover', function (event) {
      event.preventDefault();
      dropZone.classList.add('dragging');
    });

    dropZone.addEventListener('dragleave', function (event) {
      event.preventDefault();
      dropZone.classList.remove('dragging');
    });

    dropZone.addEventListener('drop', function (event) {
      event.preventDefault();
      dropZone.classList.remove('dragging');
      handleFiles(event.dataTransfer.files);
    });
  </script>
</body>
</html>
