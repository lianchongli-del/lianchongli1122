class=\"hidden conditional-field mt-2\">\n                                    <textarea rows=\"2\" placeholder=\"请描述具体情况...\" class=\"w-full\"></textarea>\n                                </div>\n                            </div>\n                            <div>\n                                <div class=\"text-sm text-slate-600 mb-2\">3)指定了体系负责人（如管代），并职责明确符合：</div>\n                                <div class=\"radio-group\">\n                                    <label class=\"radio-item\">\n                                        <input type=\"radio\" name=\"leader2-3\" value=\"yes\" checked onchange=\"toggleRadioText(this, 'leader2-3-text')\">\n                                        <span>是</span>\n                                    </label>\n                                    <label class=\"radio-item\">\n                                        <input type=\"radio\" name=\"leader2-3\" value=\"no\" onchange=\"toggleRadioText(this, 'leader2-3-text')\">\n                                        <span>否</span>\n                                    </label>\n                                </div>\n                                <div id=\"leader2-3-text\" class=\"hidden conditional-field mt-2\">\n                                    <textarea rows=\"2\" placeholder=\"请描述具体情况...\" class=\"w-full\"></textarea>\n                                </div>\n                            </div>\n                            <div>\n                                <div class=\"text-sm text-slate-600 mb-2\">4)食品安全文化建立情况（H）：</div>\n                                <textarea rows=\"2\" placeholder=\"非必填项，仅H体系显示\" class=\"w-full\"></textarea>\n                            </div>\n                            <div>\n                                <div class=\"text-sm text-slate-600 mb-2\">5)其他评价（需要时）：</div>\n                                <textarea rows=\"2\" placeholder=\"非必填项\" class=\"w-full\"></textarea>\n                            </div>\n                        </div>\n                    </div>\n\n                    <!-- 3.3 工作人员协商和参与（仅OHSMS） -->\n                    <div class=\"mb-6\">\n                        <div class=\"text-sm font-medium text-slate-700 mb-3\">3. 工作人员的协商和参与情况（仅OHSMS）</div>\n                        <div class=\"bg-slate-50 rounded-lg p-4\">\n                            <textarea rows=\"3\" placeholder=\"仅OHSMS显示该条，文本录入\" class=\"w-full\"></textarea>\n                        </div>\n                    </div>\n\n                    <!-- 3.4 管理体系方针 -->\n                    <div class=\"mb-6\">\n                        <div class=\"text-sm font-medium text-slate-700 mb-3\">4. 管理体系方针</div>\n                        <div class=\"bg-slate-50 rounded-lg p-4 space-y-3\">\n                            <div>\n                                <div class=\"text-sm text-slate-600 mb-2\">1)方针是否符合标准要求和切合组织情况：</div>\n                                <div class=\"radio-group\">\n                                    <label class=\"radio-item\">\n                                        <input type=\"radio\" name=\"policy4-1\" value=\"yes\" checked onchange=\"toggleRadioText(this, 'policy4-1-text')\">\n                                        <span>是</span>\n                                    </label>\n                                    <label class=\"radio-item\">\n                                        <input type=\"radio\" name=\"policy4-1\" value=\"no\" onchange=\"toggleRadioText(this, 'policy4-1-text')\">\n                                        <span>否</span>\n                                    </label>\n                                </div>\n                                <div id=\"policy4-1-text\" class=\"hidden conditional-field mt-2\">\n                                    <textarea rows=\"2\" placeholder=\"请描述具体情况...\" class=\"w-full\"></textarea>\n                                </div>\n                            </div>\n                            <div>\n                                <div class=\"text-sm text-slate-600 mb-2\">2)沟通、理解、被相关方获取较好：</div>\n                                <div class=\"radio-group\">\n                                    <label class=\"radio-item\">\n                                        <input type=\"radio\" name=\"policy4-2\" value=\"yes\" checked onchange=\"toggleRadioText(this, 'policy4-2-text')\">\n                                        <span>是</span>\n                                    </label>\n                                    <label class=\"radio-item\">\n                                        <input type=\"radio\" name=\"policy4-2\" value=\"no\" onchange=\"toggleRadioText(this, 'policy4-2-text')\">\n                                        <span>否</span>\n                                    </label>\n                                </div>\n                                <div id=\"policy4-2-text\" class=\"hidden conditional-field mt-2\">\n                                    <textarea rows=\"2\" placeholder=\"请描述具体情况...\" class=\"w-full\"></textarea>\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n\n                    <!-- 3.5 管理体系目标 -->\n                    <div class=\"mb-6\">\n                        <div class=\"text-sm font-medium text-slate-700 mb-3\">5. 管理体系目标及实现情况</div>\n                        <div class=\"bg-slate-50 rounded-lg p-4\">\n                            <textarea rows=\"4\" placeholder=\"请就组织目标制订及完成情况进行评价。包括：为实现方针，在相关职能、层次（和过程）上建立目标的情况；管理体系目标有哪些，是否与方针保持一致，是否适宜、可测量；是否有实现目标的具体措施（如方案）。目标是否得到沟通和监视、是否按计划完成。\" class=\"w-full\"></textarea>\n                        </div>\n                    </div>\n\n                    <!-- 3.6 法律法规 -->\n                    <div class=\"mb-6\">\n                        <div class=\"text-sm font-medium text-slate-700 mb-3\">6. 法律法规及其他要求（合规性义务）</div>\n                        <div class=\"bg-slate-50 rounded-lg p-4\">\n                            <textarea rows=\"6\" placeholder=\"请就法律法规的获取、识别，合规性评价开展情况，及组织的合规情况进行评价。包括：\n组织法律法规（如质量、环境及职业健康安全、食品安全方面法律法规）及其他要求获取是否充分，适用法律法规和相应要求识别是否合理、全面进行评价，有无遗漏等。出口企业申请HACCP应识别目的地国家的法规要求。\n组织如何开展合规性评价、评价频次、评价方法，评价内容是否全面，评价结果是否真实、合理。\n组织对法律及其他要的履行情况（实际守法情况）...\" class=\"w-full\"></textarea>\n                        </div>\n                    </div>\n\n                    <!-- 3.7 QMS产品/服务提供过程 -->\n                    <div class=\"mb-6\">\n                        <div class=\"text-sm font-medium text-slate-700 mb-3\">7. 产品/服务提供过程及运行控制(QMS)</div>\n                        <div class=\"bg-slate-50 rounded-lg p-4\">\n                            <textarea rows=\"6\" placeholder=\"请评价组织产品/服务提供过程的运行策划及控制情况，包括：\n1）针对组织产品和服务的特点识别的主要过程（或价值创造过程）有哪些，详细评述其控制方法和达成其结果的程度，包括正面的或负面的。可能的主要过程如订单接收、设计开发、采购（外包提供的产品/服务）、生产或服务提供、不合格和纠正、更改等；\n2）需要时，描述质量关键特性及其控制情况;产品和服务有关的应急措施情况。\n3）评述应基于审核证据，可以从PDCA、5M1E、符合性有效性等方面考虑。\n监督、再认证时关注持续的运作控制和对变更的管理。\" class=\"w-full\"></textarea>\n                        </div>\n                    </div>\n\n                    <!-- 3.8 EMS环境因素控制 -->\n                    <div class=\"mb-6\">\n                        <div class=\"text-sm font-medium text-slate-700 mb-3\">8. 与重要环境因素有关的过程及运行控制(EMS)</div>\n                        <div class=\"bg-slate-50 rounded-lg p-4\">\n                            <textarea rows=\"6\" placeholder=\"请就环境因素的识别和重要环境因素的确定，重要环境因素的控制措施及控制情况进行评价，包括：\n1）针对环境因素识别的充分性，环境影响评价及重要环境因素确定的合理性；控制措施的确定；控制措施实施的有效性及过程预期结果是否达到进行全面详细评价...\n2）生命周期观点如何体现、对相关方施加影响方面的评价；\n3）组织紧急情况识别的充分性、应急准备和响应措施的有效性进行评价...\" class=\"w-full\"></textarea>\n                        </div>\n                    </div>\n\n                    <!-- 3.9 OHSMS危险源控制 -->\n                    <div class=\"mb-6\">\n                        <div class=\"text-sm font-medium text-slate-700 mb-3\">9. 与OH&S风险有关的过程及运行控制（OHSMS）</div>\n                        <div class=\"bg-slate-50 rounded-lg p-4\">\n                            <textarea rows=\"6\" placeholder=\"请就危险源识别、风险评价，OH&S风险控制措施及控制情况进行评价，包括：\n1）针对危险源识别的充分性、风险评价的合理性，控制措施的确定实施的有效性...\n2）如何基于风险考虑，对相关方（尤其是承包方）进行管理及有效性；\n3）组织紧急情况识别的充分性、应急准备和响应措施的有效性进行评价...\" class=\"w-full\"></textarea>\n                        </div>\n                    </div>\n\n                    <!-- 3.10 FH食品危害控制 -->\n                    <div class=\"mb-6 hidden\" id=\"fh-process-section\">\n                        <div class=\"text-sm font-medium text-slate-700 mb-3\">10. 与食品危害控制有关的运行过程管理（F/H）</div>\n                        <div class=\"bg-slate-50 rounded-lg p-4\">\n                            <textarea rows=\"6\" placeholder=\"评价的内容需包括：\n1. 良好卫生规范/前提方案的适宜性、有效性（可简述）\n2.食品安全危害的识别及控制...\n3. 原辅料采购/致敏物质管理/食品防护计划...\n4. 监督、再认证时关注保持和对变更的管理。\" class=\"w-full\"></textarea>\n                        </div>\n                    </div>\n\n                    <!-- 3.11 QMS顾客满意 -->\n                    <div class=\"mb-6\">\n                        <div class=\"text-sm font-medium text-slate-700 mb-3\">11. 顾客满意（Q）</div>\n                        <div class=\"bg-slate-50 rounded-lg p-4\">\n                            <textarea rows=\"3\" placeholder=\"请就组织针对顾客满意程度进行监视、信息收集、分析、处理的方法及有效性进行评价，以及组织目前的顾客满意处于什么程度。\" class=\"w-full\"></textarea>\n                        </div>\n                    </div>\n\n                    <!-- 3.12 FH/HACCP验证 -->\n                    <div class=\"mb-6 hidden\" id=\"fh-verify-section\">\n                        <div class=\"text-sm font-medium text-slate-700 mb-3\">12. 验证（F/H/DG)</div>\n                        <div class=\"bg-slate-50 rounded-lg p-4\">\n                            <textarea rows=\"6\" placeholder=\"评价的内容需包括：\n1.策划的验证活动是否满足标准的要求;\n2.验证活动的实施情况...\n3.验证结果的分析\" class=\"w-full\"></textarea>\n                        </div>\n                    </div>\n\n                    <!-- 3.13 监视测量分析评价 -->\n                    <div class=\"mb-6\">\n                        <div class=\"text-sm font-medium text-slate-700 mb-3\">13. 监视、测量、分析和评价</div>\n                        <div class=\"bg-slate-50 rounded-lg p-4\">\n                            <textarea rows=\"5\" placeholder=\"请就组织开展监视和测量内容是否全面，监视、测量方法及监视过程是否有效；以及组织对监视、测量所获得的信息进行分析和评价的时机、方法、评价准则及评价结果的有效性等进行逐一评价...\" class=\"w-full\"></textarea>\n                        </div>\n                    </div>\n\n                    <!-- 3.14 内部审核 -->\n                    <div class=\"mb-6\">\n                        <div class=\"text-sm font-medium text-slate-700 mb-3\">14. 内部审核</div>\n                        <div class=\"bg-slate-50 rounded-lg p-4\">\n                            <textarea rows=\"3\" placeholder=\"就组织内审工作开展的有效性进行评价，包括：内审的频次、何时实施、审核方案的策划、内审范围、审核人员的能力及公正性、内审不符合项及整改的有效性、内审结果的汇报等\n评价内审是否有效。\" class=\"w-full\"></textarea>\n                        </div>\n                    </div>\n\n                    <!-- 3.15 管理评审 -->\n                    <div class=\"mb-6\">\n                        <div class=\"text-sm font-medium text-slate-700 mb-3\">15. 管理评审</div>\n                        <div class=\"bg-slate-50 rounded-lg p-4\">\n                            <textarea rows=\"3\" placeholder=\"就组织管理评审工作开展的有效性进行评价，包括：管理评审频次、何时实施、由谁主持实施、评审输入/输出、以往评审结果的落实等。\n评价管理评审是否有效。\" class=\"w-full\"></textarea>\n                        </div>\n                    </div>\n\n                    <!-- 3.16 不符合和纠正措施 -->\n                    <div class=\"mb-6\">\n                        <div class=\"text-sm font-medium text-slate-700 mb-3\">16. 不符合和纠正措施</div>\n                        <div class=\"bg-slate-50 rounded-lg p-4\">\n                            <textarea rows=\"3\" placeholder=\"就组织的不符合与纠正措施的管理机制的有效性进行评价，包括：不符合的调查、原因分析、制定并采取纠正和纠正措施、纠正措施的有效性等；\n对FH还应包括对组织召回策划及实施的评价。\" class=\"w-full\"></textarea>\n                        </div>\n                    </div>\n\n                    <!-- 3.17 主要绩效及改进 -->\n                    <div class=\"mb-6\">\n                        <div class=\"text-sm font-medium text-slate-700 mb-3\">17. 主要绩效及其改进</div>\n                        <div class=\"bg-slate-50 rounded-lg p-4\">\n                            <textarea rows=\"4\" placeholder=\"请就组织（组织层面）在体系运行期间/认证周期内所取得的主要绩效及趋势进行评述。（包括质量绩效、环境绩效、OH&S绩效……等），侧重相应管理体系的预期结果及其能力评价；\n评价组织的持续改进机制是否健全、有效...\" class=\"w-full\"></textarea>\n                        </div>\n                    </div>\n\n                    <!-- 3.18 人员能力 -->\n                    <div class=\"mb-6\">\n                        <div class=\"text-sm font-medium text-slate-700 mb-3\">18. 人员的能力、意识和培训</div>\n                        <div class=\"bg-slate-50 rounded-lg p-4\">\n                            <textarea rows=\"3\" placeholder=\"请就组织不同（主要是重点）岗位人员能力和意识的情况进行评价，是否可以胜任管理体系中的相关工作，以及评价组织为确保相应人员具备应有的能力和意识所采取的措施及其有效性...\" class=\"w-full\"></textarea>\n                        </div>\n                    </div>\n\n                    <!-- 3.19 体系运行支持 -->\n                    <div class=\"mb-6\">\n                        <div class=\"text-sm font-medium text-slate-700 mb-3\">19. 体系运行支持和保障（资源、文件化信息、信息沟通等）</div>\n                        <div class=\"bg-slate-50 rounded-lg p-4 space-y-3\">\n                            <div>\n                                <div class=\"text-sm text-slate-600 mb-2\">1)基础设施的配置和维护能满足管理体系有效运行的需要：</div>\n                                <div class=\"radio-group\">\n                                    <label class=\"radio-item\">\n                                        <input type=\"radio\" name=\"resource19-1\" value=\"yes\" checked>\n                                        <span>是</span>\n                                    </label>\n                                    <label class=\"radio-item\">\n                                        <input type=\"radio\" name=\"resource19-1\" value=\"no\">\n                                        <span>否</span>\n                                    </label>\n                                </div>\n                            </div>\n                            <div>\n                                <div class=\"text-sm text-slate-600 mb-2\">2)运行所需的设备包括附属设备的配置和维护能满足过程运行的需要：</div>\n                                <div class=\"radio-group\">\n                                    <label class=\"radio-item\">\n                                        <input type=\"radio\" name=\"resource19-2\" value=\"yes\" checked>\n                                        <span>是</span>\n                                    </label>\n                                    <label class=\"radio-item\">\n                                        <input type=\"radio\" name=\"resource19-2\" value=\"no\">\n                                        <span>否</span>\n                                    </label>\n                                </div>\n                            </div>\n                            <div>\n                                <div class=\"text-sm text-slate-600 mb-2\">3）监视和测量设备的配置和校准能有效确保各类监视和测量活动：</div>\n                                <div class=\"radio-group\">\n                                    <label class=\"radio-item\">\n                                        <input type=\"radio\" name=\"resource19-3\" value=\"yes\" checked>\n                                        <span>是</span>\n                                    </label>\n                                    <label class=\"radio-item\">\n                                        <input type=\"radio\" name=\"resource19-3\" value=\"no\">\n                                        <span>否</span>\n                                    </label>\n                                </div>\n                            </div>\n                            <div>\n                                <div class=\"text-sm text-slate-600 mb-2\">4）过程运行环境能确保达到过程的预期结果：</div>\n                                <div class=\"radio-group\">\n                                    <label class=\"radio-item\">\n                                        <input type=\"radio\" name=\"resource19-4\" value=\"yes\" checked>\n                                        <span>是</span>\n                                    </label>\n                                    <label class=\"radio-item\">\n                                        <input type=\"radio\" name=\"resource19-4\" value=\"no\">\n                                        <span>否</span>\n                                    </label>\n                                </div>\n                                <div class=\"mt-2\">\n                                    <span class=\"text-xs text-slate-500\">评价说明：</span>\n                                    <textarea rows=\"2\" placeholder=\"文本录入\" class=\"w-full mt-1\"></textarea>\n                                </div>\n                            </div>\n                            <div>\n                                <div class=\"text-sm text-slate-600 mb-2\">5）知识管理评价（Q）：</div>\n                                <textarea rows=\"3\" placeholder=\"就组织如何确定和维护运行中所需的知识...\" class=\"w-full\"></textarea>\n                            </div>\n                            <div>\n                                <div class=\"text-sm text-slate-600 mb-2\">6）信息交流情况：</div>\n                                <textarea rows=\"3\" placeholder=\"请就组织内部信息交流和外部信息交流的有效性进行评价...\" class=\"w-full\"></textarea>\n                            </div>\n                            <div>\n                                <div class=\"text-sm text-slate-600 mb-2\">7）其它：</div>\n                                <textarea rows=\"2\" placeholder=\"需要时评价...\" class=\"w-full\"></textarea>\n                            </div>\n                        </div>\n                    </div>\n\n                    <!-- 3.20 资质有效性验证 -->\n                    <div class=\"mb-6\">\n                        <div class=\"text-sm font-medium text-slate-700 mb-3\">20. 组织认证有关的资质有效性验证（适用时）</div>\n                        <div class=\"bg-slate-50 rounded-lg p-4\">\n                            <textarea rows=\"3\" placeholder=\"写明资质的名称、有效期，需要时表明范围等；验证其有效性。\" class=\"w-full\"></textarea>\n                        </div>\n                    </div>\n\n                    <!-- 3.21 产品安全性验证（仅F/H/DG） -->\n                    <div class=\"mb-6 hidden\" id=\"fh-safety-section\">\n                        <div class=\"text-sm font-medium text-slate-700 mb-3\">21. 产品安全性验证（适用于F/H/DG）</div>\n                        <div class=\"bg-slate-50 rounded-lg p-4\">\n                            <textarea rows=\"4\" placeholder=\"请描述本次审核覆盖范围的产品安全性验证情况...\" class=\"w-full\"></textarea>\n                        </div>\n                    </div>\n\n                    <!-- （二）其他事项 -->\n                    <div class=\"text-sm font-medium text-slate-700 mb-4 mt-8 pl-2 border-l-4 border-blue-500\">（二）其他事项</div>\n\n                    <!-- 3.22 认证证书及标志使用 -->\n                    <div class=\"mb-6 hidden\" id=\"cert-usage-section\">\n                        <div class=\"text-sm font-medium text-slate-700 mb-3\">1. 认证证书及标志的使用（初审不适用）</div>\n                        <div class=\"bg-slate-50 rounded-lg p-4\">\n                            <textarea rows=\"3\" placeholder=\"请就客户在认证证书、徽标、认可标志方面的使用情况是否符合要求进行评价...\" class=\"w-full\"></textarea>\n                        </div>\n                    </div>\n\n                    <!-- 3.23 紧急情况事故 -->\n                    <div class=\"mb-6\">\n                        <div class=\"text-sm font-medium text-slate-700 mb-3\">2. 紧急情况、事故</div>\n                        <div class=\"bg-slate-50 rounded-lg p-4\">\n                            <div class=\"radio-group mb-3\">\n                                <label class=\"radio-item\">\n                                    <input type=\"radio\" name=\"emergency\" value=\"no\" checked onchange=\"toggleEmergency(false)\">\n                                    <span>否</span>\n                                </label>\n                                <label class=\"radio-item\">\n                                    <input type=\"radio\" name=\"emergency\" value=\"yes\" onchange=\"toggleEmergency(true)\">\n                                    <span>是</span>\n                                </label>\n                            </div>\n                            <div id=\"emergency-content\" class=\"hidden conditional-field\">\n                                <textarea rows=\"3\" placeholder=\"请就组织是否发生了紧急情况、事故等情况，及处理措施是否有效进行评价...\" class=\"w-full\"></textarea>\n                            </div>\n                        </div>\n                    </div>\n\n                    <!-- 3.24 上次审核不符合纠正措施验证 -->\n                    <div class=\"mb-6 hidden\" id=\"last-ncr-section\">\n                        <div class=\"text-sm font-medium text-slate-700 mb-3\">3. 上次审核不符合纠正措施的验证（初审不适用）</div>\n                        <div class=\"bg-slate-50 rounded-lg p-4\">\n                            <textarea rows=\"3\" placeholder=\"请就审核组对组织针对上次审核发现的不符合项的纠正和纠正措施进行现场确认、验证情况进行描述...\" class=\"w-full\"></textarea>\n                        </div>\n                    </div>\n\n                    <!-- 3.25 分歧意见 -->\n                    <div class=\"mb-6\">\n                        <div class=\"text-sm font-medium text-slate-700 mb-3\">4. 审核组和客户之间的尚未解决的分歧意见（适用时）</div>\n                        <div class=\"bg-slate-50 rounded-lg p-4\">\n                            <div class=\"radio-group mb-3\">\n                                <label class=\"radio-item\">\n                                    <input type=\"radio\" name=\"disagreement\" value=\"no\" checked onchange=\"toggleDisagreement(false)\">\n                                    <span>否</span>\n                                </label>\n                                <label class=\"radio-item\">\n                                    <input type=\"radio\" name=\"disagreement\" value=\"yes\" onchange=\"toggleDisagreement(true)\">\n                                    <span>是</span>\n                                </label>\n                            </div>\n                            <div id=\"disagreement-content\" class=\"hidden conditional-field\">\n                                <textarea rows=\"2\" placeholder=\"请描述分歧意见的具体内容...\" class=\"w-full\"></textarea>\n                            </div>\n                        </div>\n                    </div>\n\n                    <!-- （三）不符合项 -->\n                    <div class=\"text-sm font-medium text-slate-700 mb-4 mt-8 pl-2 border-l-4 border-blue-500\">（三）不符合项</div>\n                    <div class=\"bg-slate-50 rounded-lg p-4\">\n                        <table class=\"problem-table border border-slate-200 rounded-lg overflow-hidden\" id=\"ncrTable\">\n                            <thead>\n                                <tr>\n                                    <th style=\"width: 60px;\">序号</th>\n                                    <th style=\"width: 120px;\">部门/过程</th>\n                                    <th style=\"width: 200px;\">标准及条款</th>\n                                    <th>不符合事实</th>\n                                    <th style=\"width: 100px;\">不符合性质</th>\n                                    <th style=\"width: 100px;\">操作</th>\n                                </tr>\n                            </thead>\n                            <tbody id=\"ncrTableBody\">\n                                <tr>\n                                    <td>1</td>\n                                    <td><input type=\"text\" class=\"w-full\" value=\"安全管理部门\"></td>\n                                    <td><input type=\"text\" class=\"w-full\" value=\"GB/T 45001-2020 6.1.2\"></td>\n                                    <td>\n                                        <textarea class=\"w-full\" rows=\"2\">审核发现未对新设备操作岗位进行系统的危险源辨识。抽查2024年3月新投入使用的自动检票机维护岗位，未提供相应的危险源辨识记录。</textarea>\n                                    </td>\n                                    <td>\n                                        <select class=\"w-full\">\n                                            <option value=\"minor\" selected>轻微</option>\n                                            <option value=\"major\">严重</option>\n                                        </select>\n                                    </td>\n                                    <td>\n                                        <button class=\"px-3 py-1 text-xs border border-red-300 text-red-600 rounded hover:bg-red-50\" onclick=\"deleteNcrRow(this)\">\n                                            <i class=\"fas fa-trash mr-1\"></i>删除\n                                        </button>\n                                    </td>\n                                </tr>\n                                <tr>\n                                    <td>2</td>\n                                    <td><input type=\"text\" class=\"w-full\" value=\"运营管理部门\"></td>\n                                    <td><input type=\"text\" class=\"w-full\" value=\"GB/T 19001-2016 7.5\"></td>\n                                    <td>\n                                        <textarea class=\"w-full\" rows=\"2\">审核发现现场作业指导书未更新，与实际操作不符。2024年3月修订的设备维护流程未在作业指导书中体现。</textarea>\n                                    </td>\n                                    <td>\n                                        <select class=\"w-full\">\n                                            <option value=\"minor\" selected>轻微</option>\n                                            <option value=\"major\">严重</option>\n                                        </select>\n                                    </td>\n                                    <td>\n                                        <button class=\"px-3 py-1 text-xs border border-red-300 text-red-600 rounded hover:bg-red-50\" onclick=\"deleteNcrRow(this)\">\n                                            <i class=\"fas fa-trash mr-1\"></i>删除\n                                        </button>\n                                    </td>\n                                </tr>\n                            </tbody>\n                        </table>\n                        <div class=\"mt-4\">\n                            <button class=\"px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 transition-all flex items-center gap-2\" onclick=\"addNcrRow()\">\n                                <i class=\"fas fa-plus text-xs\"></i>\n                                新增不符合项\n                            </button>\n                        </div>\n                    </div>\n                </div>\n            </div>\n\n            <!-- 4. 其他事项 -->\n            <div id=\"section-others\" class=\"form-section bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden\">\n                <div class=\"bg-slate-50 px-6 py-4 border-b border-slate-200 flex items-center justify-between cursor-pointer hover:bg-slate-100 transition-colors\" onclick=\"toggleSection(this)\">\n                    <div class=\"flex items-center gap-2\">\n                        <div class=\"w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs font-bold\">4</div>\n                        <h3 class=\"font-semibold text-slate-900\">审核中观察到的其他事项</h3>\n                    </div>\n                    <i class=\"fas fa-chevron-down text-slate-400 transition-transform duration-300 text-xs\"></i>\n                </div>\n                <div class=\"p-6 transition-all duration-300\" style=\"max-height: 2000px; overflow: visible;\">\n                    <div class=\"info-row\">\n                        <div class=\"info-label\">组织的其他优势项</div>\n                        <div class=\"info-value\">\n                            <textarea rows=\"3\" placeholder=\"请描述审核中发现的其他优势项...（非必填项）\" class=\"w-full\"></textarea>\n                        </div>\n                    </div>\n                    <div class=\"info-row\">\n                        <div class=\"info-label\">改进建议/机会</div>\n                        <div class=\"info-value\">\n                            <textarea rows=\"3\" placeholder=\"请提出改进建议或机会...（非必填项）\" class=\"w-full\"></textarea>\n                        </div>\n                    </div>\n                </div>\n            </div>\n\n            <!-- 5. 审核结论及推荐意见 -->\n            <div id=\"section-conclusion\" class=\"form-section bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden\">\n                <div class=\"bg-slate-50 px-6 py-4 border-b border-slate-200 flex items-center justify-between cursor-pointer hover:bg-slate-100 transition-colors\" onclick=\"toggleSection(this)\">\n                    <div class=\"flex items-center gap-2\">\n                        <div class=\"w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs font-bold\">5</div>\n                        <h3 class=\"font-semibold text-slate-900\">审核结论及推荐意见</h3>\n                    </div>\n                    <i class=\"fas fa-chevron-down text-slate-400 transition-transform duration-300 text-xs\"></i>\n                </div>\n                <div class=\"p-6 transition-all duration-300\" style=\"max-height: 5000px; overflow: visible;\">\n\n                    <div class=\"conclusion-card mb-6\">\n                        <div class=\"conclusion-block-title\">审核结论</div>\n                        <div class=\"conclusion-hint\">请就受审核方管理体系的符合性和有效性，以及其满足适用要求和实现预期结果的能力做总结性阐述。</div>\n                        <textarea rows=\"3\" class=\"w-full\" id=\"auditConclusionText\" placeholder=\"请输入审核结论总结性描述\">经现场审核确认，北京市地铁运营有限公司质量管理体系、环境管理体系、职业健康安全管理体系运行持续符合GB/T 19001-2016、GB/T 24001-2016、GB/T 45001-2020标准要求。</textarea>\n\n                        <div class=\"conclusion-sentence mt-4\">\n                            综上所述，审核组一致认为，\n                            <input type=\"text\" class=\"w-72 inline-block mx-1\" value=\"北京市地铁运营有限公司\">\n                            （组织名称）的\n                            <input type=\"text\" class=\"w-56 inline-block mx-1\" value=\"QMS、EMS、OHSMS\">\n                            管理体系：\n                        </div>\n\n                        <div class=\"conclusion-option-panel\">\n                            <div class=\"conclusion-option-line\">\n                                <span class=\"font-medium text-slate-700\">初审：</span>\n                                <label class=\"radio-item\"><input type=\"radio\" name=\"initial-conformity\" checked> 建立、实施符合</label>\n                                <label class=\"radio-item\"><input type=\"radio\" name=\"initial-conformity\"> 不符合</label>\n                                <span>审核准则的要求，体系运行</span>\n                                <label class=\"radio-item\"><input type=\"radio\" name=\"initial-effective\" checked> 有效</label>\n                                <label class=\"radio-item\"><input type=\"radio\" name=\"initial-effective\"> 失效</label>\n                                <span>。</span>\n                            </div>\n\n                            <div class=\"conclusion-option-line\">\n                                <span class=\"font-medium text-slate-700\">监督：</span>\n                                <label class=\"radio-item\"><input type=\"radio\" name=\"surveillance-keep\"> 得到</label>\n                                <label class=\"radio-item\"><input type=\"radio\" name=\"surveillance-keep\"> 未得到良好的实施和保持</label>\n                                <span>，体系运行</span>\n                                <label class=\"radio-item\"><input type=\"radio\" name=\"surveillance-effective\"> 有效</label>\n                                <label class=\"radio-item\"><input type=\"radio\" name=\"surveillance-effective\"> 失效</label>\n                                <span>。</span>\n                            </div>\n\n                            <div class=\"conclusion-option-line\">\n                                <span class=\"font-medium text-slate-700\">再认证：</span>\n                                <label class=\"radio-item\"><input type=\"radio\" name=\"recertification-conform\"> 持续符合</label>\n                                <label class=\"radio-item\"><input type=\"radio\" name=\"recertification-conform\"> 未持续符合</label>\n                                <span>审核准则的要求，体系运行持续</span>\n                                <label class=\"radio-item\"><input type=\"radio\" name=\"recertification-effective\"> 有效</label>\n                                <label class=\"radio-item\"><input type=\"radio\" name=\"recertification-effective\"> 失效</label>\n                                <span>。</span>\n                            </div>\n\n                            <div class=\"conclusion-option-line\">\n                                <span class=\"font-medium text-slate-700\">变更：</span>\n                                <label class=\"radio-item\"><input type=\"radio\" name=\"change-conform\"> 符合</label>\n                                <label class=\"radio-item\"><input type=\"radio\" name=\"change-conform\"> 不符合</label>\n                                <span>审核准则的要求，体系运行有效。（变更）</span>\n                            </div>\n\n                            <div class=\"conclusion-option-line\">\n                                <label class=\"radio-item\"><input type=\"checkbox\" onchange=\"togglePurposeExtra(this, 'other-conclusion-input')\"> 其他：</label>\n                                <input type=\"text\" id=\"other-conclusion-input\" class=\"flex-1 min-w-[360px]\" placeholder=\"请输入其他审核结论\" disabled>\n                            </div>\n                        </div>\n                    </div>\n\n                    <div class=\"recommendation-card\">\n                        <div class=\"conclusion-block-title\">推荐意见</div>\n                        <div class=\"conclusion-option-panel\">\n                            <div class=\"recommendation-option-line active\" data-recommendation-row=\"recommend\">\n                                <label class=\"recommend-major\">\n                                    <input type=\"radio\" name=\"recommendation-main\" value=\"recommend\" checked onchange=\"updateRecommendationState()\">\n                                    推荐\n                                </label>\n                                <span class=\"recommendation-child\" data-recommendation-child=\"recommend\">（\n                                    <label class=\"radio-item\"><input type=\"radio\" name=\"recommend-type\" checked> 认证</label>\n                                    <label class=\"radio-item\"><input type=\"radio\" name=\"recommend-type\"> 保持认证</label>\n                                    <label class=\"radio-item\"><input type=\"radio\" name=\"recommend-type\"> 再认证</label>\n                                    <label class=\"radio-item\"><input type=\"radio\" name=\"recommend-type\"> 证书变更</label>\n                                    <label class=\"radio-item\"><input type=\"radio\" name=\"recommend-type\"> 其他：</label>\n                                    <input type=\"text\" class=\"w-40 inline-block\" placeholder=\"请输入\">）\n                                </span>\n                            </div>\n\n                            <div class=\"recommendation-option-line\" data-recommendation-row=\"rectified-recommend\">\n                                <label class=\"recommend-major\">\n                                    <input type=\"radio\" name=\"recommendation-main\" value=\"rectified-recommend\" onchange=\"updateRecommendationState()\">\n                                    在规定时限内对不符合采取了经审核组评审、接受并证实有效的纠正和纠正措施后，推荐\n                                </label>\n                                <span class=\"recommendation-child is-disabled\" data-recommendation-child=\"rectified-recommend\">（\n                                    <label class=\"radio-item\"><input type=\"radio\" name=\"rectified-recommend-type\"> 认证</label>\n                                    <label class=\"radio-item\"><input type=\"radio\" name=\"rectified-recommend-type\"> 保持认证</label>\n                                    <label class=\"radio-item\"><input type=\"radio\" name=\"rectified-recommend-type\"> 再认证</label>\n                                    <label class=\"radio-item\"><input type=\"radio\" name=\"rectified-recommend-type\"> 证书变更</label>\n                                    <label class=\"radio-item\"><input type=\"radio\" name=\"rectified-recommend-type\"> 其他：</label>\n                                    <input type=\"text\" class=\"w-40 inline-block\" placeholder=\"请输入\">）\n                                </span>\n                            </div>\n\n                            <div class=\"recommendation-option-line\" data-recommendation-row=\"not-recommend\">\n                                <label class=\"recommend-major\">\n                                    <input type=\"radio\" name=\"recommendation-main\" value=\"not-recommend\" onchange=\"updateRecommendationState()\">\n                                    不予推荐\n                                </label>\n                                <span class=\"recommendation-child is-disabled\" data-recommendation-child=\"not-recommend\">（\n                                    <label class=\"radio-item\"><input type=\"radio\" name=\"not-recommend-type\"> 认证</label>\n                                    <label class=\"radio-item\"><input type=\"radio\" name=\"not-recommend-type\"> 保持认证</label>\n                                    <label class=\"radio-item\"><input type=\"radio\" name=\"not-recommend-type\"> 再认证</label>\n                                    <label class=\"radio-item\"><input type=\"radio\" name=\"not-recommend-type\"> 证书变更</label>\n                                    <label class=\"radio-item\"><input type=\"radio\" name=\"not-recommend-type\"> 其他：</label>\n                                    <input type=\"text\" class=\"w-40 inline-block\" placeholder=\"请输入\">）\n                                </span>\n                            </div>\n\n                            <div class=\"recommendation-option-line\" data-recommendation-row=\"suspend-withdraw\">\n                                <label class=\"recommend-major\">\n                                    <input type=\"radio\" name=\"recommendation-main\" value=\"suspend\" onchange=\"updateRecommendationState()\">\n                                    暂停认证\n                                </label>\n                                <label class=\"recommend-major ml-8\">\n                                    <input type=\"radio\" name=\"recommendation-main\" value=\"withdraw\" onchange=\"updateRecommendationState()\">\n                                    撤销认证\n                                </label>\n                                <span class=\"recommend-note\">仅监督阶段存在</span>\n                            </div>\n                        </div>\n\n                        <div class=\"sign-row\">\n                            <div class=\"sign-field\">\n                                <span>审核组长（签字）：</span>\n                                <input type=\"text\" class=\"w-48\" placeholder=\"请输入\">\n                            </div>\n                            <div class=\"sign-field\">\n                                <span>日期：</span>\n                                <input type=\"date\" class=\"w-44\">\n                            </div>\n                        </div>\n                    </div>\n                </div>\n            </div>\n\n            <!-- 6. 后续行动 -->\n            <div id=\"section-followup\" class=\"form-section bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden\">\n                <div class=\"bg-slate-50 px-6 py-4 border-b border-slate-200 flex items-center justify-between cursor-pointer hover:bg-slate-100 transition-colors\" onclick=\"toggleSection(this)\">\n                    <div class=\"flex items-center gap-2\">\n                        <div class=\"w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs font-bold\">6</div>\n                        <h3 class=\"font-semibold text-slate-900\">后续行动</h3>\n                    </div>\n                    <i class=\"fas fa-chevron-down text-slate-400 transition-transform duration-300 text-xs\"></i>\n                </div>\n                <div class=\"p-6 transition-all duration-300\" style=\"max-height: 3000px; overflow: visible;\">\n\n                    <!-- 6.1 不符合项整改要求 -->\n                    <div class=\"info-row\">\n                        <div class=\"info-label\">1. 不符合项整改要求</div>\n                        <div class=\"info-value\">\n                            <div id=\"ncr-rectification\" class=\"bg-orange-50 border border-orange-200 rounded-lg p-4 text-sm text-slate-600 leading-7\">\n                                不符合项的纠正措施及相应证明资料（轻微不符合可以是整改计划）需要在\n                                <input type=\"date\" class=\"w-36 inline-block mx-1\">\n                                之前提交给审核组，审核组将采取\n                                <select class=\"w-32 inline-block mx-1\">\n                                    <option value=\"document\">材料评审</option>\n                                    <option value=\"onsite\">现场跟踪审核</option>\n                                </select>\n                                的方式，对不符合项的纠正措施的有效性进行确认。\n                                <div class=\"mt-2 text-red-600 font-medium text-xs\">\n                                    <i class=\"fas fa-exclamation-circle mr-1\"></i>\n                                    注：不符合项的整改措施应在规定的时间内提交，否则，本次审核将失效，组织的认证证书将被暂停或撤销。\n                                </div>\n                            </div>\n                            <div id=\"no-ncr-notice\" class=\"hidden bg-green-50 border border-green-200 rounded-lg p-4 text-sm text-green-700\">\n                                <i class=\"fas fa-check-circle mr-1\"></i> 本次审核未开具不符合项，无需整改。\n                            </div>\n                        </div>\n                    </div>\n\n                    <!-- 6.2 下次审核的说明 -->\n                    <div class=\"info-row\" style=\"margin-top: 16px;\">\n                        <div class=\"info-label\">2. 下次审核的说明</div>\n                        <div class=\"info-value text-sm text-slate-600 leading-7\">\n                            <div class=\"mb-2\">\n                                <i class=\"fas fa-check-square text-blue-500 mr-2\"></i>\n                                下一次审核的审核类型：\n                                <span class=\"font-medium text-slate-800\">QMS第一次监督审核，EMS第一次监督审核，OHSMS第一次监督审核</span>\n                            </div>\n                            <div class=\"mb-2\">\n                                <i class=\"fas fa-calendar-alt text-blue-500 mr-2\"></i>\n                                下次审核需要在\n                                <input type=\"date\" class=\"w-36 inline-block mx-1\">\n                                之前完成\n                            </div>\n                            <div>\n                                <i class=\"fas fa-eye text-blue-500 mr-2\"></i>\n                                下次审核的关注点：\n                                <input type=\"text\" class=\"w-96 inline-block\" placeholder=\"手动录入\">\n                            </div>\n                        </div>\n                    </div>\n\n                    <!-- 6.3 其他说明 -->\n                    <div class=\"info-row\">\n                        <div class=\"info-label\">3. 其他说明（适用时）</div>\n                        <div class=\"info-value\">\n                            <div class=\"text-xs text-slate-500 mb-2\">与末次会议上提供给客户信息的差异说明：</div>\n                            <textarea rows=\"2\" placeholder=\"请输入其他说明...\" class=\"w-full\"></textarea>\n                        </div>\n                    </div>\n\n                    <!-- 6.4 派出机构意见 -->\n                    <div class=\"info-row\">\n                        <div class=\"info-label\">4. 审核派出机构意见</div>\n                        <div class=\"info-value\">\n                            <div class=\"radio-group mb-4\">\n                                <label class=\"radio-item\">\n                                    <input type=\"radio\" name=\"org-opinion\" value=\"agree\" checked>\n                                    <span>同意审核组意见</span>\n                                </label>\n                                <label class=\"radio-item\">\n                                    <input type=\"radio\" name=\"org-opinion\" value=\"disagree\">\n                                    <span>不同意审核组意见</span>\n                                </label>\n                            </div>\n                            <div class=\"grid grid-cols-2 gap-4 max-w-md\">\n                                <div>\n                                    <label class=\"form-label text-xs text-slate-500 mb-1\">授权人（签字）</label>\n                                    <input type=\"text\" disabled placeholder=\"二阶段审核报告审核组长提交后，需要领导审批\" class=\"w-full bg-slate-50\">\n                                </div>\n                                <div>\n                                    <label class=\"form-label text-xs text-slate-500 mb-1\">日期</label>\n                                    <input type=\"text\" disabled class=\"w-full bg-slate-50\">\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                </div>\n            </div>\n\n        </div>\n    </div>\n\n    <!-- Toast提示 -->\n    <div id=\"toast\">\n        <i id=\"toastIcon\" class=\"fas fa-check-circle text-green-400\"></i>\n        <span id=\"toastMessage\">操作成功</span>\n    </div>\n\n    <script>\n        // 初始化\n        document.addEventListener('DOMContentLoaded', function() {\n            initScrollSpy();\n            updateNcrVisibility();\n            updateRecommendationState();\n        });\n\n        // 区块折叠展开\n        function toggleSection(header) {\n            const content = header.nextElementSibling;\n            const icon = header.querySelector('.fa-chevron-down');\n\n            if (!content) return;\n\n            const isCollapsed = content.style.maxHeight === '0px';\n\n            if (isCollapsed) {\n                content.style.maxHeight = '8000px';\n                content.style.overflow = 'visible';\n                content.style.paddingTop = '';\n                content.style.paddingBottom = '';\n                if (icon) icon.style.transform = 'rotate(0deg)';\n            } else {\n                content.style.maxHeight = '0px';\n                content.style.overflow = 'hidden';\n                content.style.paddingTop = '0';\n                content.style.paddingBottom = '0';\n                if (icon) icon.style.transform = 'rotate(-90deg)';\n            }\n        }\n\n\n        function toggleCriteriaItem(item, event) {\n            if (!item || item.id === 'criteria-item-standard') return;\n            const checkbox = item.querySelector('.criteria-checkbox');\n            if (!checkbox || checkbox.disabled) return;\n            if (!(event && event.target && event.target.classList && event.target.classList.contains('criteria-checkbox'))) {\n                checkbox.checked = !checkbox.checked;\n            }\n            toggleCriteriaField(checkbox.id.replace('criteria-', ''));\n        }\n\n        function toggleCriteriaField(type) {\n            const checkbox = document.getElementById(`criteria-${type}`);\n            const item = document.getElementById(`criteria-item-${type}`);\n            const input = document.getElementById(`input-${type}`);\n            if (!checkbox || !item) return;\n            if (checkbox.checked) {\n                item.classList.add('expanded', 'active');\n            } else {\n                item.classList.remove('expanded', 'active');\n                if (input) input.value = '';\n            }\n        }\n\n        function togglePurposeExtra(checkbox, inputId) {\n            const input = document.getElementById(inputId);\n            if (!input) return;\n            input.disabled = !checkbox.checked;\n            if (!checkbox.checked) input.value = '';\n            if (checkbox.checked) input.focus();\n        }\n\n        function updateRecommendationState() {\n            const checked = document.querySelector('input[name=\"recommendation-main\"]:checked');\n            const value = checked ? checked.value : '';\n            document.querySelectorAll('.recommendation-option-line').forEach(row => {\n                const rowKey = row.getAttribute('data-recommendation-row');\n                row.classList.toggle('active', rowKey === value || (rowKey === 'suspend-withdraw' && (value === 'suspend' || value === 'withdraw')));\n            });\n            document.querySelectorAll('.recommendation-child').forEach(child => {\n                const key = child.getAttribute('data-recommendation-child');\n                const disabled = key !== value;\n                child.classList.toggle('is-disabled', disabled);\n                child.querySelectorAll('input').forEach(input => {\n                    input.disabled = disabled;\n                    if (disabled && (input.type === 'radio' || input.type === 'checkbox')) input.checked = false;\n                    if (disabled && input.type === 'text') input.value = '';\n                });\n            });\n        }\n\n        // 滚动监听\n        function initScrollSpy() {\n            const sections = document.querySelectorAll('.form-section[id]');\n            const navItems = document.querySelectorAll('.nav-item');\n\n            const observer = new IntersectionObserver((entries) => {\n                entries.forEach(entry => {\n                    if (entry.isIntersecting) {\n                        const id = entry.target.getAttribute('id');\n                        navItems.forEach(item => {\n                            item.classList.remove('active');\n                            if (item.getAttribute('data-section') === id) {\n                                item.classList.add('active');\n                            }\n                        });\n                    }\n                });\n            }, { rootMargin: '-20% 0px -80% 0px', threshold: 0 });\n\n            sections.forEach(section => observer.observe(section));\n        }\n\n        // Toast提示\n        function showToast(message, type = 'success') {\n            const toast = document.getElementById('toast');\n            const icon = document.getElementById('toastIcon');\n            const msg = document.getElementById('toastMessage');\n\n            msg.textContent = message;\n            icon.className = type === 'error' ? 'fas fa-exclamation-circle text-red-400' : \n                            type === 'warning' ? 'fas fa-exclamation-triangle text-yellow-400' : \n                            type === 'info' ? 'fas fa-info-circle text-blue-400' :\n                            'fas fa-check-circle text-green-400';\n\n            toast.classList.add('show');\n\n            setTimeout(() => {\n                toast.classList.remove('show');\n            }, 3000);\n        }\n\n        // 切换条件字段显示\n        function toggleField(elementId, show) {\n            const el = document.getElementById(elementId);\n            if (!el) return;\n            if (show) {\n                el.classList.remove('hidden');\n                el.classList.add('active');\n            } else {\n                el.classList.add('hidden');\n                el.classList.remove('active');\n            }\n        }\n\n        // 切换radio对应的文本域\n        function toggleRadioText(radio, textId) {\n            const show = radio.value === 'no' && radio.checked;\n            toggleField(textId, show);\n        }\n\n        // 审核综述相关函数\n        function toggleDocReview(show) {\n            toggleField('doc-review-unsatisfied', show);\n        }\n\n        function toggleStage1(show) {\n            toggleField('stage1-issues', show);\n        }\n\n        function togglePlanAdjust(show) {\n            toggleField('plan-adjust-content', show);\n        }\n\n        function togglePlanComplete(show) {\n            toggleField('plan-uncomplete-content', show);\n        }\n\n        function toggleCombinedAudit(checked) {\n            const el = document.getElementById('combined-audit-content');\n            if (el) el.classList.toggle('hidden', !checked);\n        }\n\n        function toggleSystemChange(show) {\n            toggleField('system-change-content', show);\n        }\n\n        function toggleQmsNa(show) {\n            toggleField('qms-na-content', show);\n        }\n\n        function toggleScopeChange(show) {\n            toggleField('scope-change-content', show);\n        }\n\n        function togglePurposeAchieved(show) {\n            toggleField('purpose-achieved-content', show);\n        }\n\n        // 其他事项相关函数\n        function toggleEmergency(show) {\n            toggleField('emergency-content', show);\n        }\n\n        function toggleDisagreement(show) {\n            toggleField('disagreement-content', show);\n        }\n\n        // 不符合项表格操作\n        function addNcrRow() {\n            const tbody = document.getElementById('ncrTableBody');\n            const rowCount = tbody.rows.length + 1;\n            const newRow = document.createElement('tr');\n            newRow.innerHTML = `\n                <td>${rowCount}</td>\n                <td><input type=\"text\" class=\"w-full\" placeholder=\"部门/过程\"></td>\n                <td><input type=\"text\" class=\"w-full\" placeholder=\"标准及条款\"></td>\n                <td><textarea class=\"w-full\" rows=\"2\" placeholder=\"不符合事实描述...\"></textarea></td>\n                <td>\n                    <select class=\"w-full\">\n                        <option value=\"minor\">轻微</option>\n                        <option value=\"major\">严重</option>\n                    </select>\n                </td>\n                <td>\n                    <button class=\"px-3 py-1 text-xs border border-red-300 text-red-600 rounded hover:bg-red-50\" onclick=\"deleteNcrRow(this)\">\n                        <i class=\"fas fa-trash mr-1\"></i>删除\n                    </button>\n                </td>\n            `;\n            tbody.appendChild(newRow);\n            updateNcrVisibility();\n        }\n\n        function deleteNcrRow(btn) {\n            if (confirm('确定删除该不符合项吗？')) {\n                const row = btn.closest('tr');\n                row.remove();\n                const tbody = document.getElementById('ncrTableBody');\n                Array.from(tbody.rows).forEach((row, index) => {\n                    row.cells[0].textContent = index + 1;\n                });\n                updateNcrVisibility();\n            }\n        }\n\n        function updateNcrVisibility() {\n            const tbody = document.getElementById('ncrTableBody');\n            const hasNcr = tbody.rows.length > 0;\n            const ncrRect = document.getElementById('ncr-rectification');\n            const noNcr = document.getElementById('no-ncr-notice');\n            if (ncrRect) ncrRect.classList.toggle('hidden', !hasNcr);\n            if (noNcr) noNcr.classList.toggle('hidden', hasNcr);\n        }\n\n        // 保存和提交\n        function saveReport() {\n            showToast('审核报告草稿已保存', 'success');\n        }\n\n        function submitReport() {\n            if (confirm('确定提交审核报告吗？提交后将不可再修改。')) {\n                document.getElementById('headerStatusBadge').textContent = '已提交';\n                document.getElementById('headerStatusBadge').className = 'status-badge badge-success';\n                document.getElementById('submitBtn').disabled = true;\n                document.getElementById('submitBtn').innerHTML = '<i class=\"fas fa-check text-xs\"></i> 已提交';\n                showToast('审核报告已提交', 'success');\n            }\n        }\n\n        function goBack() {\n            if (confirm('确定返回列表页？未保存的数据将丢失。')) {\n                console.log('返回列表页');\n            }\n        }\n    __COMBINED_SCRIPT_CLOSE__\n\n<style id=\"READONLY_EMBEDDED_REPORT_FINAL\">\n  button, .upload-btn, .remove-btn, .file-tag-action.delete { display: none !important; }\n  input, textarea, select, [contenteditable=\"true\"] {\n    background: #f9fafb !important;\n    border-color: #e2e8f0 !important;\n    color: #334155 !important;\n    cursor: default !important;\n    box-shadow: none !important;\n  }\n  a, .nav-item { pointer-events: auto !important; }\n  body::after {\n    content: \"只读\";\n    position: fixed;\n    right: 18px;\n    bottom: 18px;\n    z-index: 99999;\n    padding: 6px 12px;\n    border-radius: 999px;\n    background: #eff6ff;\n    border: 1px solid #bfdbfe;\n    color: #2563eb;\n    font-size: 12px;\n    font-weight: 700;\n    box-shadow: 0 6px 18px rgba(15, 23, 42, 0.10);\n  }\n</style>\n<script>\n(function(){\n  function lockReport(){\n    document.querySelectorAll('input, textarea, select').forEach(function(el){\n      el.setAttribute('readonly','readonly');\n      el.setAttribute('disabled','disabled');\n      el.setAttribute('tabindex','-1');\n    });\n    document.querySelectorAll('[contenteditable=\"true\"]').forEach(function(el){ el.setAttribute('contenteditable','false'); });\n    document.querySelectorAll('button, .upload-btn, .remove-btn, .file-tag-action.delete').forEach(function(el){ el.remove(); });\n  }\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', lockReport);\n  else lockReport();\n})();\n__COMBINED_SCRIPT_CLOSE__\n\n<script id=\"AUDIT_REPORT_ANCHOR_FIX_FINAL\">\n(function(){\n  function initAuditAnchors(){\n    document.querySelectorAll('a.nav-item[href^=\"#\"]').forEach(function(a){\n      a.addEventListener('click', function(e){\n        var id = a.getAttribute('href');\n        var target = document.querySelector(id);\n        if (target) { e.preventDefault(); target.scrollIntoView({ behavior:'smooth', block:'start' }); }\n      });\n    });\n  }\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initAuditAnchors);\n  else initAuditAnchors();\n})();\n__COMBINED_SCRIPT_CLOSE__\n\n\n<script id=\"AUDIT_REPORT_ANCHOR_SAFE_PATCH\">\n(function(){\n  function bindAnchors(){\n    document.querySelectorAll('a[href^=\"#\"], .nav-item[data-section]').forEach(function(el){\n      el.addEventListener('click', function(e){\n        var id = el.getAttribute('href') || ('#' + el.getAttribute('data-section'));\n        if (!id || id === '#') return;\n        var target = document.querySelector(id);\n        if (target) { e.preventDefault(); target.scrollIntoView({behavior:'smooth', block:'start'}); }\n      });\n    });\n  }\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bindAnchors); else bindAnchors();\n})();\n__COMBINED_SCRIPT_CLOSE__\n\n\n<script id=\"AUDIT_REPORT_IFRAME_ANCHOR_FIX_AGAIN\">\n(function(){\n  function bind(){\n    document.querySelectorAll('a[href^=\"#\"], .nav-item[data-section]').forEach(function(el){\n      el.addEventListener('click', function(e){\n        var id = el.getAttribute('href') || ('#' + el.getAttribute('data-section'));\n        if (!id || id === '#') return;\n        var target = document.querySelector(id);\n        if(target){ e.preventDefault(); target.scrollIntoView({behavior:'smooth', block:'start'}); }\n      });\n    });\n  }\n  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind); else bind();\n})();\n__COMBINED_SCRIPT_CLOSE__\n</body>\n</html>\n"];
    const tabs = Array.from(document.querySelectorAll('.main-tab'));
    const frames = Array.from(document.querySelectorAll('.page-frame'));

    function restoreCombinedHtml(html) {
      return html.replaceAll('__COMBINED_SCRIPT_CLOSE__', '</' + 'script>');
    }

    function loadFrame(frame) {
      const index = Number(frame.dataset.pageIndex);
      if (!Number.isFinite(index) || !pageHtml[index]) return;
      frame.srcdoc = restoreCombinedHtml(pageHtml[index]);
    }

    frames.forEach(loadFrame);

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        const target = tab.dataset.target;
        tabs.forEach((item) => item.classList.toggle('active', item === tab));
        frames.forEach((frame) => frame.classList.toggle('active', frame.id === 'frame-' + target));
      });
    });
  </script>
