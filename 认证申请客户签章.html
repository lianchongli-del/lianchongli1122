

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>认证申请客户签章</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
            background-color: rgba(255, 255, 255, 0) !important;
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
        }
        html {
            background: transparent !important;
            background-color: rgba(255, 255, 255, 0) !important;
        }
        body {
            background: transparent !important;
            background-color: rgba(255, 255, 255, 0) !important;
        }
        html.signature-page-closed body {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .page-shell {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .top-titlebar {
            min-height: 72px;
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 0 28px;
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
            z-index: 20;
        }
        .title-left {
            display: flex;
            align-items: center;
            gap: 18px;
            min-width: 0;
            flex: 1 1 auto;
        }
        .back-btn,
        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: #fff;
            color: #334155;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .back-btn {
            padding: 0;
            border: 0;
            color: #64748b;
            background: transparent;
        }
        .back-btn:hover { color: #1e293b; }
        .title-divider {
            width: 1px;
            height: 28px;
            background: #cbd5e1;
        }
        .title-text {
            font-size: 20px;
            font-weight: 800;
            color: #0f172a;
            white-space: nowrap;
            min-width: 0;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            height: 26px;
            padding: 0 10px;
            border-radius: 999px;
            border: 1px solid #bfdbfe;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }
        .badge-green {
            border-color: #a7f3d0;
            background: #ecfdf5;
            color: #047857;
        }
        .title-tags {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            flex: 0 1 auto;
            min-width: 0;
        }
        .action-btn {
            height: 38px;
            padding: 0 16px;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
        }
        .action-btn:hover {
            background: #f8fafc;
            border-color: #94a3b8;
        }
        .action-btn.primary {
            border-color: #2563eb;
            background: #2563eb;
            color: #fff;
            box-shadow: 0 6px 14px rgba(37, 99, 235, 0.2);
        }
        .action-btn.primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
        .action-btn.danger {
            border-color: #fecaca;
            color: #dc2626;
        }
        .action-btn.danger:hover {
            background: #fef2f2;
            border-color: #fca5a5;
        }
        .frame-stage {
            flex: 1 1 auto;
            min-height: 0;
            min-width: 0;
            background: #f5f7fa;
        }
        .plan-frame {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #fff;
        }
        @media (max-width: 760px) {
            .top-titlebar {
                min-height: auto;
                align-items: flex-start;
                flex-direction: column;
                padding: 14px 16px;
            }
            .title-left { align-items: flex-start; flex-direction: column; gap: 10px; }
            .title-divider { display: none; }
            .actions { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
        }
        @media (max-width: 520px) {
            .title-tags { width: 100%; }
            .action-btn {
                flex: 1 1 0;
                min-width: 0;
            }
        }


        /* 线上签章流程 / PDF预览弹窗 */
        .sign-modal-mask {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(15, 23, 42, 0.48);
            backdrop-filter: blur(3px);
            z-index: 9999;
        }
        .sign-modal-mask.show { display: flex; }
        .sign-modal-card {
            width: min(680px, calc(100% - 32px));
            max-height: calc(100vh - 48px);
            overflow: hidden;
            border-radius: 14px;
            background: #fff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.28);
            display: flex;
            flex-direction: column;
            animation: signModalIn .22s ease-out;
        }
        @keyframes signModalIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .sign-modal-card.pdf {
            width: 100vw;
            height: 100vh;
            max-height: 100vh;
            border-radius: 0;
            border: 0;
        }
        .sign-modal-header {
            flex: 0 0 auto;
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 20px 28px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }
        .sign-modal-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #0f172a;
            font-size: 17px;
            font-weight: 800;
        }
        .sign-modal-subtitle {
            margin-top: 4px;
            color: #64748b;
            font-size: 12px;
            font-weight: 500;
        }
        .sign-modal-close {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            transition: all .18s;
        }
        .sign-modal-close:hover { background: #e2e8f0; color: #0f172a; }
        .sign-modal-body {
            padding: 28px;
            overflow: auto;
        }
        .sign-modal-footer {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 14px;
            padding: 20px 28px;
            border-top: 1px solid #e2e8f0;
            background: #fff;
        }
        .sign-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 28px;
            padding: 0 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }
        .sign-status-pending { background: #dbeafe; color: #1d4ed8; }
        .sign-status-signing { background: #fef3c7; color: #92400e; }
        .sign-status-signed { background: #dcfce7; color: #166534; }
        .sign-status-error { background: #fee2e2; color: #b91c1c; }
        .sign-status-waiting { background: #f1f5f9; color: #64748b; }
        .sign-platform-card {
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            background: #f8fafc;
            padding: 24px;
        }
        .sign-platform-info {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 22px;
        }
        .sign-platform-info small {
            display: block;
            color: #64748b;
            font-size: 12px;
            margin-bottom: 4px;
        }
        .sign-platform-info strong {
            color: #0f172a;
            font-size: 17px;
        }
        .sign-process-list {
            display: grid;
            gap: 12px;
            margin-top: 20px;
        }
        .sign-process-line {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 50px;
            padding: 13px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #fff;
            color: #475569;
            font-size: 13px;
            font-weight: 600;
        }
        .sign-process-line.running {
            background: #eff6ff;
            border-color: #bfdbfe;
            color: #1d4ed8;
        }
        .sign-process-line.done {
            background: #f0fdf4;
            border-color: #bbf7d0;
            color: #166534;
        }
        .sign-process-line.failed {
            background: #fef2f2;
            border-color: #fecaca;
            color: #b91c1c;
        }
        .sign-error-box {
            display: none;
            margin-top: 16px;
            padding: 13px 15px;
            border: 1px solid #fecaca;
            border-radius: 10px;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.6;
        }
        .sign-error-box.show {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .return-reason-label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 13px;
            font-weight: 700;
        }
        .return-reason-textarea {
            width: 100%;
            min-height: 118px;
            resize: vertical;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            color: #0f172a;
            font: inherit;
            font-size: 13px;
            line-height: 1.6;
            outline: none;
        }
        .return-reason-textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
        }
        .return-tip {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 12px;
            line-height: 1.5;
        }
        .pdf-viewer {
            flex: 1 1 auto;
            overflow: auto;
            background: #dbe2ea;
            padding: 18px;
        }
        .pdf-sheet {
            width: min(1040px, 100%);
            min-height: 1320px;
            margin: 0 auto;
            padding: 42px 48px;
            background: #fff;
            border: 1px solid #cbd5e1;
            box-shadow: 0 18px 45px rgba(15, 23, 42, .18);
            color: #111827;
            position: relative;
            overflow: hidden;
        }
        .pdf-watermark {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 8px;
            color: rgba(37, 99, 235, .045);
            transform: rotate(-28deg);
            pointer-events: none;
            user-select: none;
        }
        .pdf-inner { position: relative; z-index: 1; }
        .pdf-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            padding-bottom: 14px;
            border-bottom: 2px solid #111827;
            margin-bottom: 24px;
        }
        .pdf-org { font-size: 25px; font-weight: 900; letter-spacing: .5px; }
        .pdf-en { margin-top: 4px; color: #64748b; font-size: 11px; letter-spacing: 1px; }
        .pdf-meta { color: #374151; font-size: 12px; line-height: 1.8; text-align: right; }
        .pdf-title {
            margin: 0 0 20px;
            text-align: center;
            color: #111827;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 4px;
        }
        .pdf-section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 18px 0 8px;
            color: #111827;
            font-size: 14px;
            font-weight: 900;
        }
        .pdf-section-title::before {
            content: '';
            width: 4px;
            height: 14px;
            background: #111827;
            border-radius: 999px;
        }
        .pdf-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 12px;
            line-height: 1.65;
            background: rgba(255,255,255,.92);
        }
        .pdf-table th,
        .pdf-table td {
            border: 1px solid #111827;
            padding: 7px 9px;
            vertical-align: top;
            word-break: break-word;
        }
        .pdf-table th {
            width: 16%;
            background: #f3f4f6;
            text-align: center;
            font-weight: 900;
        }
        .pdf-table.small th,
        .pdf-table.small td { padding: 6px 7px; }
        .pdf-seal-area {
            min-height: 168px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 18px;
            margin-top: 18px;
            padding: 16px 18px;
            border: 1px dashed #94a3b8;
            background: rgba(248,250,252,.8);
        }
        .pdf-seals {
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            gap: 28px;
            flex-wrap: wrap;
        }
        .personal-seal-wrap { text-align: center; }
        .personal-seal {
            width: 92px;
            height: 92px;
            border: 3px solid #dc2626;
            border-radius: 999px;
            color: #dc2626;
            background: rgba(255,255,255,.78);
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transform: rotate(-12deg);
            font-weight: 900;
            box-shadow: 0 4px 12px rgba(220, 38, 38, .12);
            position: relative;
            animation: sealStamp .35s cubic-bezier(.2, .85, .24, 1.25);
        }
        .personal-seal::before {
            content: '';
            position: absolute;
            inset: 7px;
            border: 1.5px solid #dc2626;
            border-radius: inherit;
        }
        .personal-seal .role { font-size: 12px; line-height: 1; }
        .personal-seal .name { font-size: 16px; letter-spacing: 2px; line-height: 1.1; }
        .personal-seal-time { margin-top: 8px; color: #334155; font-size: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
        @keyframes sealStamp {
            0% { opacity: 0; transform: scale(1.85) rotate(-20deg); }
            100% { opacity: 1; transform: scale(1) rotate(-12deg); }
        }
        .empty-seal-tip { color: #94a3b8; font-size: 13px; font-weight: 700; }
        .pdf-footer {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            margin-top: 26px;
            padding-top: 12px;
            border-top: 1px solid #94a3b8;
            color: #64748b;
            font-size: 11px;
        }
        .sign-toast {
            position: fixed;
            left: 50%;
            bottom: 32px;
            transform: translateX(-50%) translateY(18px);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            max-width: calc(100vw - 32px);
            padding: 10px 14px;
            border-radius: 999px;
            background: #0f172a;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: all .2s;
            z-index: 10001;
            box-shadow: 0 14px 30px rgba(15, 23, 42, .22);
        }
        .sign-toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
        @media (max-width: 780px) {
            .pdf-sheet { padding: 28px 22px; min-height: 1000px; }
            .pdf-top { flex-direction: column; }
            .pdf-meta { text-align: left; }
            .pdf-seal-area { align-items: flex-start; flex-direction: column; }
            .pdf-seals { justify-content: flex-start; }
        }

    
        .pdf-preview-frame {
            width: 100%;
            height: calc(100vh - 86px);
            border: 0;
            background: #e2e8f0;
            display: block;
        }

        .page-shell {
            display: none;
        }

        #onlineSignModal.sign-modal-mask,
        #onlineSignModal.sign-modal-mask.show {
            background: transparent !important;
            background-color: rgba(255, 255, 255, 0) !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }

    </style>
</head>
<body>
    <!-- 退回原因弹窗 -->
    <div class="sign-modal-mask" id="returnReasonModal" role="dialog" aria-modal="true" aria-labelledby="returnReasonTitle">
        <div class="sign-modal-card">
            <div class="sign-modal-header">
                <div>
                    <div class="sign-modal-title" id="returnReasonTitle"><i class="fas fa-reply text-red-500"></i>退回原因</div>
                    <div class="sign-modal-subtitle">退回后系统保留当前认证申请单内容，等待重新调整后再次提交。</div>
                </div>
                <button type="button" class="sign-modal-close" onclick="closeSignModalById('returnReasonModal')" aria-label="关闭"><i class="fas fa-times"></i></button>
            </div>
            <div class="sign-modal-body">
                <label class="return-reason-label" for="returnReasonText">请填写或查看本次退回原因</label>
                <textarea id="returnReasonText" class="return-reason-textarea" placeholder="请输入退回原因">认证申请单中的客户信息或认证需求需补充确认，请调整后重新提交签章。</textarea>
                <div class="return-tip"><i class="fas fa-circle-info"></i><span>点击“确认退回”后，系统将记录退回原因并停留在当前页面。</span></div>
            </div>
            <div class="sign-modal-footer">
                <button type="button" class="action-btn" onclick="closeSignModalById('returnReasonModal')">取消</button>
                <button type="button" class="action-btn danger" onclick="confirmReturnReason()">确认退回</button>
            </div>
        </div>
    </div>

    <!-- 线上签章平台处理弹窗 -->
    <div class="sign-modal-mask" id="onlineSignModal" role="dialog" aria-modal="true" aria-labelledby="onlineSignTitle">
        <div class="sign-modal-card">
            <div class="sign-modal-header">
                <div>
                    <div class="sign-modal-title" id="onlineSignTitle"><i class="fas fa-stamp text-blue-600"></i>线上签章平台处理</div>
                </div>
                <div style="display:flex;align-items:center;gap:10px;">
                    <span class="sign-status-pill sign-status-pending" id="modalSignStatus"><i class="fas fa-clock"></i>待签章</span>
                    <button type="button" class="sign-modal-close" onclick="closeSignModalById('onlineSignModal')" aria-label="关闭"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="sign-modal-body">
                <div class="sign-platform-card">
                    <div style="color:#475569;font-size:13px;line-height:1.65;">当前文件将以认证申请表 PDF 样式提交线上签章，完成后展示认证申请表预览内容。</div>
                    <div class="sign-process-list" id="platformProgress">
                        <div class="sign-process-line" data-progress="0"><i class="fas fa-file-circle-check"></i><span>校验认证申请单完整性校验</span></div>
                        <div class="sign-process-line" data-progress="1"><i class="fas fa-stamp"></i><span>线上签章平台执行盖章</span></div>
                    </div>
                    <div class="sign-error-box" id="modalErrorBox"><i class="fas fa-triangle-exclamation"></i><span id="modalErrorText"></span></div>
                </div>
            </div>
            <div class="sign-modal-footer">
                <button type="button" class="action-btn" onclick="openPdfPreview()"><i class="fas fa-eye"></i>预览当前文件</button>
                <button type="button" class="action-btn primary" id="confirmSignBtn" onclick="simulatePlatformSign()"><i class="fas fa-paper-plane"></i>签章</button>
            </div>
        </div>
    </div>

    <!-- PDF样式预览弹窗 -->
    <div class="sign-modal-mask" id="pdfPreviewModal" role="dialog" aria-modal="true" aria-labelledby="pdfPreviewTitle">
        <div class="sign-modal-card pdf">
            <div class="sign-modal-header">
                <div>
                    <div class="sign-modal-title" id="pdfPreviewTitle"><i class="fas fa-file-pdf text-red-500"></i>认证申请表 PDF 预览</div>
                    <div class="sign-modal-subtitle" id="pdfPreviewSubtitle">签章完成后展示认证申请表预览内容</div>
                </div>
                <div style="display:flex;align-items:center;gap:10px;">
                    <button type="button" class="action-btn" onclick="downloadPdfDemo()"><i class="fas fa-download"></i>下载</button>
                    <button type="button" class="sign-modal-close" onclick="closePdfPreviewAndReset()" aria-label="关闭"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="pdf-viewer">
                <iframe id="pdfPreviewFrame" class="pdf-preview-frame" title="认证申请表PDF预览"></iframe>
            </div>
        </div>
    </div>

    <div class="sign-toast" id="signToast"><i class="fas fa-check-circle"></i><span id="signToastText"></span></div>

    <script>
        const signNodes = [
            { key: 'customer', title: '客户签章', role: '客户代表', signer: '刘海峰', status: 'pending', signedAt: '', attempts: 0, error: '' }
        ];
        let signingIndex = -1;

        function statusMeta(status) {
            if (status === 'signed') return { text: '已签章', icon: 'fa-circle-check', cls: 'sign-status-signed' };
            if (status === 'signing') return { text: '签章中', icon: 'fa-spinner fa-spin', cls: 'sign-status-signing' };
            if (status === 'error') return { text: '签章失败', icon: 'fa-triangle-exclamation', cls: 'sign-status-error' };
            if (status === 'pending') return { text: '待签章', icon: 'fa-clock', cls: 'sign-status-pending' };
            return { text: '未开始', icon: 'fa-lock', cls: 'sign-status-waiting' };
        }

        function currentSignIndex() {
            return signNodes.findIndex(function (node) { return node.status === 'pending' || node.status === 'signing' || node.status === 'error'; });
        }

        function nowText() {
            const d = new Date();
            const p = function (n) { return String(n).padStart(2, '0'); };
            return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
        }


        function getSignProcessSteps(node) {
            const steps = [];
            steps.push({ icon: 'fa-file-circle-check', text: '校验认证申请单完整性校验' });
            steps.push({ icon: 'fa-stamp', text: '线上签章平台执行盖章' });
            return steps;
        }

        function renderPlatformProgress(node) {
            const container = document.getElementById('platformProgress');
            if (!container) return;
            const steps = getSignProcessSteps(node);
            container.innerHTML = steps.map(function(step, index) {
                return '<div class="sign-process-line" data-progress="' + index + '"><i class="fas ' + step.icon + '"></i><span>' + step.text + '</span></div>';
            }).join('');
        }


        function setModalError(message) {
            const box = document.getElementById('modalErrorBox');
            const textEl = document.getElementById('modalErrorText');
            if (!box || !textEl) return;
            if (message) {
                textEl.textContent = message;
                box.classList.add('show');
            } else {
                textEl.textContent = '';
                box.classList.remove('show');
            }
        }

        function isLeaderSignStage(node) {
            return node && node.key === 'customer' && (node.status === 'pending' || node.status === 'error' || node.status === 'signing');
        }

        function openReturnReasonModal() {
            openSignModalById('returnReasonModal');
            setTimeout(function () {
                const reason = document.getElementById('returnReasonText');
                if (reason) reason.focus();
            }, 80);
        }

        function openSignModal() {
            document.documentElement.classList.remove('signature-page-closed');
            const idx = currentSignIndex();
            if (idx === -1) {
                showSignToast('全部节点已完成签章，可预览最终文件');
                openPdfPreview();
                return;
            }
            const node = signNodes[idx];
            if (!isLeaderSignStage(node)) {
                showSignToast('当前节点不支持在本页面签章');
                return;
            }
            signingIndex = idx;
            const nodeNameEl = document.getElementById('modalNodeName');
            const signerEl = document.getElementById('modalSigner');
            if (nodeNameEl) nodeNameEl.textContent = node.title;
            if (signerEl) signerEl.textContent = node.signer;
            renderPlatformProgress(node);
            setModalError(node.error || '');
            setModalStatus(node.status);
            const btn = document.getElementById('confirmSignBtn');
            btn.disabled = false;
            btn.innerHTML = node.status === 'error'
                ? '<i class="fas fa-rotate-right"></i>重新发起签章'
                : '<i class="fas fa-paper-plane"></i>签章';
            document.querySelectorAll('.sign-process-line').forEach(function (line) { line.classList.remove('running', 'done', 'failed'); });
            openSignModalById('onlineSignModal');
        }

        function openSignModalById(id) {
            const modal = document.getElementById(id);
            if (!modal) return;
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeSignModalById(id) {
            const modal = document.getElementById(id);
            if (!modal) return;
            modal.classList.remove('show');
            if (!document.querySelector('.sign-modal-mask.show')) document.body.style.overflow = '';
        }

        function resetCustomerSignatureState() {
            signingIndex = -1;
            signNodes.forEach(function (node) {
                node.status = 'pending';
                node.signedAt = '';
                node.attempts = 0;
                node.error = '';
            });
            setModalStatus('pending');
            setModalError('');
            const btn = document.getElementById('confirmSignBtn');
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i>签章';
            }
            document.querySelectorAll('.sign-process-line').forEach(function (line) {
                line.classList.remove('running', 'done', 'failed');
            });
            renderAllSignatureUI();
        }

        function notifyHostSignatureClosed() {
            const message = { type: 'customer-signature-close', source: '认证申请客户签章' };
            try {
                if (window.parent && window.parent !== window) window.parent.postMessage(message, '*');
            } catch (error) {}
            try {
                window.dispatchEvent(new CustomEvent('customer-signature-close', { detail: message }));
            } catch (error) {}
        }

        function closeCustomerSignaturePage() {
            document.documentElement.classList.add('signature-page-closed');
            document.body.style.overflow = '';
            try {
                if (window.frameElement) window.frameElement.style.display = 'none';
            } catch (error) {}
            try {
                if (window.opener) window.close();
            } catch (error) {}
        }

        function closePdfPreviewAndReset() {
            closeSignModalById('pdfPreviewModal');
            const frame = document.getElementById('pdfPreviewFrame');
            if (frame) {
                frame.removeAttribute('src');
                frame.srcdoc = '';
            }
            document.documentElement.classList.remove('signature-page-closed');
            try {
                if (window.frameElement) window.frameElement.style.display = '';
            } catch (error) {}
            setTimeout(function () {
                const idx = currentSignIndex();
                if (idx === -1) {
                    const signedIndex = Math.max(0, signNodes.length - 1);
                    const node = signNodes[signedIndex];
                    signingIndex = signedIndex;
                    renderPlatformProgress(node);
                    setModalError('');
                    setModalStatus(node.status || 'signed');
                    const btn = document.getElementById('confirmSignBtn');
                    if (btn) {
                        btn.disabled = true;
                        btn.innerHTML = '<i class="fas fa-circle-check"></i>签章完成';
                    }
                    document.querySelectorAll('.sign-process-line').forEach(function (line) {
                        line.classList.remove('running', 'failed');
                        line.classList.add('done');
                    });
                    openSignModalById('onlineSignModal');
                    return;
                }
                openSignModal();
            }, 80);
        }

        window.openCustomerSignaturePage = function () {
            try {
                if (window.frameElement) window.frameElement.style.display = '';
            } catch (error) {}
            resetCustomerSignatureState();
            document.documentElement.classList.remove('signature-page-closed');
            setTimeout(openSignModal, 80);
        };

        function setModalStatus(status) {
            const meta = statusMeta(status);
            const badge = document.getElementById('modalSignStatus');
            if (!badge) return;
            badge.className = 'sign-status-pill ' + meta.cls;
            badge.innerHTML = '<i class="fas ' + meta.icon + '"></i>' + meta.text;
        }

        function simulatePlatformSign() {
            if (signingIndex < 0) return;
            const node = signNodes[signingIndex];
            if (!isLeaderSignStage(node)) {
                showSignToast('当前节点不支持在本页面签章');
                return;
            }
            node.status = 'signing';
            node.error = '';
            setModalError('');
            setModalStatus('signing');
            renderAllSignatureUI();
            const btn = document.getElementById('confirmSignBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>处理中';
            const lines = Array.from(document.querySelectorAll('.sign-process-line'));
            lines.forEach(function (line) { line.classList.remove('running', 'done', 'failed'); });
            lines.forEach(function (line, index) {
                setTimeout(function () {
                    if (index > 0) {
                        lines[index - 1].classList.remove('running');
                        lines[index - 1].classList.add('done');
                    }
                    line.classList.add('running');
                }, index * 520);
            });
            setTimeout(function () {
                lines[lines.length - 1].classList.remove('running');
                lines[lines.length - 1].classList.add('done');
                node.attempts = (node.attempts || 0) + 1;
                finishCurrentSign();
            }, lines.length * 520 + 360);
        }

        function failCurrentSign(message) {
            const node = signNodes[signingIndex];
            node.status = 'error';
            node.error = message;
            setModalStatus('error');
            setModalError(message);
            renderAllSignatureUI();
            const lines = Array.from(document.querySelectorAll('.sign-process-line'));
            if (lines.length) {
                const last = lines[lines.length - 1];
                last.classList.remove('running', 'done');
                last.classList.add('failed');
            }
            const btn = document.getElementById('confirmSignBtn');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-rotate-right"></i>重新发起签章';
            showSignToast(message);
        }

        function finishCurrentSign() {
            const signedIndex = signingIndex;
            const node = signNodes[signedIndex];
            node.status = 'signed';
            node.error = '';
            node.signedAt = nowText();
            renderAllSignatureUI();
            setModalStatus('signed');
            setModalError('');
            const btn = document.getElementById('confirmSignBtn');
            btn.innerHTML = '<i class="fas fa-circle-check"></i>签章完成';
            showSignToast('认证申请单客户签章已完成');
            setTimeout(function () {
                closeSignModalById('onlineSignModal');
                openPdfPreview(signedIndex);
            }, 520);
        }

        function confirmReturnReason() {
            const reason = document.getElementById('returnReasonText');
            const value = reason ? reason.value.trim() : '';
            if (!value) {
                showSignToast('请先填写退回原因');
                if (reason) reason.focus();
                return;
            }
            closeSignModalById('returnReasonModal');
            showSignToast('已记录退回原因：' + value);
        }

        function showSignToast(text) {
            const toast = document.getElementById('signToast');
            const textEl = document.getElementById('signToastText');
            if (!toast || !textEl) return;
            textEl.textContent = text;
            toast.classList.add('show');
            clearTimeout(window.__signToastTimer);
            window.__signToastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2600);
        }

        function forceTransparentHostFrame() {
            document.documentElement.style.setProperty('background', 'transparent', 'important');
            document.documentElement.style.setProperty('background-color', 'rgba(255,255,255,0)', 'important');
            document.body.style.setProperty('background', 'transparent', 'important');
            document.body.style.setProperty('background-color', 'rgba(255,255,255,0)', 'important');
            try {
                const frame = window.frameElement;
                if (!frame) return;
                frame.setAttribute('allowtransparency', 'true');
                frame.setAttribute('scrolling', 'no');
                frame.style.setProperty('background', 'transparent', 'important');
                frame.style.setProperty('background-color', 'rgba(255,255,255,0)', 'important');
                frame.style.setProperty('border', '0', 'important');

                let node = frame.parentElement;
                let depth = 0;
                while (node && depth < 8) {
                    node.style.setProperty('background', 'transparent', 'important');
                    node.style.setProperty('background-color', 'rgba(255,255,255,0)', 'important');
                    node.style.setProperty('border-color', 'transparent', 'important');
                    node = node.parentElement;
                    depth += 1;
                }
            } catch (error) {}
        }

        function renderAllSignatureUI() {
            renderTopSignButton();
        }

        function renderTopSignButton() {
            const idx = currentSignIndex();
            const btn = document.getElementById('topSignBtn');
            const btnText = document.getElementById('topSignBtnText');
            if (!btn || !btnText) return;

            if (idx === -1) {
                btn.style.display = 'none';
                return;
            }

            const node = signNodes[idx];
            if (!isLeaderSignStage(node)) {
                btn.style.display = 'none';
                return;
            }

            btn.style.display = 'inline-flex';
            btn.disabled = node.status === 'signing';
            btn.style.opacity = btn.disabled ? '.65' : '1';
            btnText.textContent = node.status === 'signing' ? '签章中' : (node.status === 'error' ? '重新签章' : '签章');
        }

        function frameStatusClass(status) {
            if (status === 'signed') return 'completed';
            if (status === 'error') return 'error';
            if (status === 'pending' || status === 'signing') return 'active';
            return 'waiting';
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

                    <div class="signature-summary">
                        <div><strong>说明：</strong>本页汇总当前审核计划的电子签章记录。每个节点签章成功后，系统自动流转至下一节点，并在本页追加个人签章印。</div>

        function normalizePdfText(value) {
            return String(value == null ? '' : value)
                .replace(/\u00a0/g, ' ')
                .replace(/\s+/g, ' ')
                .replace(/^\s+|\s+$/g, '');

            if (tag === 'select') {

                return normalizePdfText(option ? option.textContent : control.value);

        function textFromNode(el) {

            cloneControls.forEach(function (control, index) {

                control.replaceWith(span);

\u003e\n    \u003cmain class=\"pdf-page\"\u003e\n      \u003cheader class=\"doc-header\"\u003e\n        \u003cdiv class=\"brand\"\u003e\n          \u003cimg src=\"file:///C:/Users/CHONGL~1.LIA/AppData/Local/Temp/codex-clipboard-5c94e044-d9d6-42b9-a978-f67a0df9a3f3.png\" alt=\"中国质量认证中心 CHINA QUALITY CERTIFICATION CENTRE\" onerror=\"this.style.display=\u0027none\u0027;this.nextElementSibling.style.display=\u0027block\u0027;\"\u003e\n          \u003cdiv class=\"brand-fallback\"\u003e\n            \u003cstrong\u003eCQC 中国质量认证中心\u003c/strong\u003e\n            \u003cspan\u003eCHINA QUALITY CERTIFICATION CENTRE\u003c/span\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"doc-meta\"\u003e\n          \u003cdiv class=\"wide\"\u003e文件名称：\u003cstrong\u003e认证申请表\u003c/strong\u003e\u003c/div\u003e\n          \u003cdiv\u003e文件编号：\u003cstrong\u003eMSF11-01\u003c/strong\u003e\u003c/div\u003e\n          \u003cdiv\u003e版本：\u003cstrong\u003e2015版\u003c/strong\u003e\u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/header\u003e\n\n      \u003ch1 class=\"main-title\"\u003e认证申请表\u003c/h1\u003e\n\n      \u003csection class=\"section\"\u003e\n        \u003ch2 class=\"section-title\"\u003e一、申请单信息\u003c/h2\u003e\n        \u003ctable\u003e\n          \u003ctbody\u003e\n            \u003ctr\u003e\u003cth\u003e认证申请编号\u003c/th\u003e\u003ctd\u003eSQ202607160001\u003c/td\u003e\u003cth\u003e申请人\u003c/th\u003e\u003ctd\u003e当前登录用户\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth\u003e申请时间\u003c/th\u003e\u003ctd\u003e2026-07-16 13:55\u003c/td\u003e\u003cth\u003eCQC受理机构\u003c/th\u003e\u003ctd\u003e北京中心\u003c/td\u003e\u003c/tr\u003e\n          \u003c/tbody\u003e\n        \u003c/table\u003e\n      \u003c/section\u003e\n\n      \u003csection class=\"section\"\u003e\n        \u003ch2 class=\"section-title\"\u003e二、客户基本信息\u003c/h2\u003e\n        \u003ctable\u003e\n          \u003ctbody\u003e\n            \u003ctr\u003e\u003cth\u003e客户名称\u003c/th\u003e\u003ctd colspan=\"3\"\u003e示例科技有限公司\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth\u003e客户英文名称\u003c/th\u003e\u003ctd colspan=\"3\"\u003eExample Technology Co., Ltd.\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth\u003e统一社会信用代码\u003c/th\u003e\u003ctd\u003e91110105MA00XXXXXX\u003c/td\u003e\u003cth\u003e关联合同\u003c/th\u003e\u003ctd\u003e\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth\u003e注册地址\u003c/th\u003e\u003ctd\u003e北京市朝阳区xxx路xxx号\u003c/td\u003e\u003cth\u003e注册地址（英文）\u003c/th\u003e\u003ctd\u003eNo. xxx, xxx Road, Chaoyang District, Beijing\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth\u003e注册地邮编\u003c/th\u003e\u003ctd\u003e100020\u003c/td\u003e\u003cth\u003e传真\u003c/th\u003e\u003ctd\u003e010-88886666\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth\u003e运营地址\u003c/th\u003e\u003ctd\u003e北京市海淀区xxx路xxx号\u003c/td\u003e\u003cth\u003e运营地址（英文）\u003c/th\u003e\u003ctd\u003eNo. xxx, xxx Road, Haidian District, Beijing\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth\u003e运营地邮编\u003c/th\u003e\u003ctd\u003e100080\u003c/td\u003e\u003cth\u003e工作语言\u003c/th\u003e\u003ctd\u003e汉语\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth\u003e联系人\u003c/th\u003e\u003ctd\u003e张三\u003c/td\u003e\u003cth\u003e所在部门\u003c/th\u003e\u003ctd\u003e质量管理部\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth\u003e职务\u003c/th\u003e\u003ctd\u003e经理\u003c/td\u003e\u003cth\u003e电话\u003c/th\u003e\u003ctd\u003e13800138000\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth\u003eE-mail\u003c/th\u003e\u003ctd\u003ezhangsan@example.com\u003c/td\u003e\u003cth\u003e客户备注信息\u003c/th\u003e\u003ctd\u003e希望审核安排避开月末结算期，重点关注多场所协同及信息安全要求。\u003c/td\u003e\u003c/tr\u003e\n          \u003c/tbody\u003e\n        \u003c/table\u003e\n      \u003c/section\u003e\n\n      \u003csection class=\"section\"\u003e\n        \u003ch2 class=\"section-title\"\u003e三、组织/人员及其他认证信息\u003c/h2\u003e\n        \u003ctable\u003e\n          \u003ctbody\u003e\n            \u003ctr\u003e\u003cth\u003e公司总人数\u003c/th\u003e\u003ctd\u003e268\u003c/td\u003e\u003cth\u003e全职人员\u003c/th\u003e\u003ctd\u003e246\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth\u003e兼职人员\u003c/th\u003e\u003ctd\u003e22\u003c/td\u003e\u003cth\u003e兼职工作时间(小时/天)\u003c/th\u003e\u003ctd\u003e4 小时/天\u003c/td\u003e\u003c/tr\u003e\n          \u003c/tbody\u003e\n        \u003c/table\u003e\n\n        \u003cdiv class=\"question-line\"\u003e如隶属于某个更大的组织(如集团公司、上级机关等)，请说明\u003c/div\u003e\n        \u003ctable\u003e\n          \u003ctbody\u003e\n            \u003ctr\u003e\u003cth\u003e该组织名称\u003c/th\u003e\u003ctd\u003e示例科技集团有限公司\u003c/td\u003e\u003cth\u003e与该组织的关系\u003c/th\u003e\u003ctd\u003e全资子公司\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth\u003e该组织负责哪些与认证相关的职能\u003c/th\u003e\u003ctd colspan=\"3\"\u003e战略规划、品牌管理、财务共享、集团采购和部分供应商准入。\u003c/td\u003e\u003c/tr\u003e\n          \u003c/tbody\u003e\n        \u003c/table\u003e\n\n        \u003cdiv class=\"question-line\"\u003e如申请认证的管理体系有外包（外委）过程或业务，请说明\u003c/div\u003e\n        \u003ctable\u003e\n          \u003ctbody\u003e\n            \u003ctr\u003e\u003cth\u003e外包（外委）过程或业务及承担方\u003c/th\u003e\u003ctd colspan=\"3\"\u003e办公设备维护、部分低压施工、物流配送、机房巡检辅助服务由经评价合格的外包方承担。\u003c/td\u003e\u003c/tr\u003e\n          \u003c/tbody\u003e\n        \u003c/table\u003e\n\n        \u003cdiv class=\"question-line\"\u003e如证书已被暂停或撤销，请说明被暂停或撤销的时间和原因\u003c/div\u003e\n        \u003ctable\u003e\n          \u003ctbody\u003e\n            \u003ctr\u003e\u003cth\u003e日期\u003c/th\u003e\u003ctd\u003e2024-10-15\u003c/td\u003e\u003cth\u003e原因说明\u003c/th\u003e\u003ctd\u003e因监督审核资料补充超期暂停，2024-11-20 已恢复。\u003c/td\u003e\u003c/tr\u003e\n          \u003c/tbody\u003e\n        \u003c/table\u003e\n\n        \u003cdiv class=\"question-line\"\u003e如管理体系是在咨询机构的帮助下建立，请说明咨询机构名称\u003c/div\u003e\n        \u003ctable\u003e\n          \u003ctbody\u003e\n            \u003ctr\u003e\u003cth\u003e咨询机构名称\u003c/th\u003e\u003ctd colspan=\"3\"\u003e北京卓越管理咨询有限公司\u003c/td\u003e\u003c/tr\u003e\n          \u003c/tbody\u003e\n        \u003c/table\u003e\n\n        \u003cdiv class=\"question-line\"\u003e客户在申请认证前一年内是否被政府部门处罚或发生过信息技术服务事故或信息安全事件？\u003c/div\u003e\n        \u003ctable\u003e\n          \u003ctbody\u003e\n            \u003ctr\u003e\u003cth\u003e详细说明\u003c/th\u003e\u003ctd colspan=\"3\"\u003e2026年2月发生一次一般信息安全事件，已完成根因分析、客户通报和纠正措施验证。\u003c/td\u003e\u003c/tr\u003e\n          \u003c/tbody\u003e\n        \u003c/table\u003e\n\n        \u003cdiv class=\"sub-title\"\u003e3.1 如客户曾获得过其他认证机构的管理体系认证，请说明\u003c/div\u003e\n        \u003ctable class=\"matrix\"\u003e\n          \u003cthead\u003e\u003ctr\u003e\u003cth\u003e认证机构的名称\u003c/th\u003e\u003cth\u003e认证标准\u003c/th\u003e\u003cth\u003e证书有效期\u003c/th\u003e\u003cth\u003e最近一次审核日期\u003c/th\u003e\u003cth\u003e管理体系开始运行时间\u003c/th\u003e\u003cth\u003e最近一次内审时间\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n          \u003ctbody\u003e\n            \u003ctr\u003e\u003ctd\u003e某国际认证有限公司\u003c/td\u003e\u003ctd\u003eISO 9001:2015\u003c/td\u003e\u003ctd\u003e2024-12-31\u003c/td\u003e\u003ctd\u003e2024-06-12\u003c/td\u003e\u003ctd\u003e2021-03-01\u003c/td\u003e\u003ctd\u003e2024-05-18\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003ctd\u003e某安全认证中心\u003c/td\u003e\u003ctd\u003eISO/IEC 27001:2022\u003c/td\u003e\u003ctd\u003e2025-09-30\u003c/td\u003e\u003ctd\u003e2025-03-20\u003c/td\u003e\u003ctd\u003e2022-01-10\u003c/td\u003e\u003ctd\u003e2025-02-16\u003c/td\u003e\u003c/tr\u003e\n          \u003c/tbody\u003e\n        \u003c/table\u003e\n\n        \u003cdiv class=\"sub-title\"\u003e3.2 现场审核安排与作业信息\u003c/div\u003e\n        \u003ctable\u003e\n          \u003ctbody\u003e\n            \u003ctr\u003e\u003cth\u003e希望现场审核的时间\u003c/th\u003e\u003ctd\u003e2026年8月中旬\u003c/td\u003e\u003cth\u003e是否同时审核\u003c/th\u003e\u003ctd\u003e是\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth\u003e是否承担住宿及交通费\u003c/th\u003e\u003ctd\u003e是\u003c/td\u003e\u003cth\u003e签发类型\u003c/th\u003e\u003ctd\u003e自动\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth\u003e是否加急\u003c/th\u003e\u003ctd\u003e是，加急处理\u003c/td\u003e\u003cth\u003e管理人员作息时间\u003c/th\u003e\u003ctd\u003e上午 09:00-12:00；下午 13:00-18:00\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth\u003e重复过程（适用时）\u003c/th\u003e\u003ctd colspan=\"3\"\u003e客户现场服务流程在多个服务点重复。\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth\u003e涉及人数\u003c/th\u003e\u003ctd\u003e45 人\u003c/td\u003e\u003cth\u003e班组数（适用时）\u003c/th\u003e\u003ctd\u003e3 个班组\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth\u003e每个班组人数\u003c/th\u003e\u003ctd colspan=\"3\"\u003e15 人\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth\u003e临时性非熟练人员数量（适用时）\u003c/th\u003e\u003ctd colspan=\"3\"\u003e8 人\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth\u003e从事工作\u003c/th\u003e\u003ctd colspan=\"3\"\u003e短期数据标注、资料整理和现场布置辅助工作。\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth\u003e工作性质\u003c/th\u003e\u003ctd\u003e季节性工作\u003c/td\u003e\u003cth\u003e季节范围\u003c/th\u003e\u003ctd\u003e3月-10月为项目交付高峰期，11月-2月为维护和复盘期。\u003c/td\u003e\u003c/tr\u003e\n          \u003c/tbody\u003e\n        \u003c/table\u003e\n      \u003c/section\u003e\n\n      \u003csection class=\"section\"\u003e\n        \u003ch2 class=\"section-title\"\u003e四、认证领域需求信息\u003c/h2\u003e\n        \u003ctable\u003e\n          \u003ctbody\u003e\n            \u003ctr\u003e\n              \u003cth\u003e批量选择认证体系\u003c/th\u003e\n              \u003ctd colspan=\"3\"\u003e\n                \u003cspan class=\"chip\"\u003eQMS\u003c/span\u003e\u003cspan class=\"chip\"\u003eEMS\u003c/span\u003e\u003cspan class=\"chip\"\u003eOHSMS\u003c/span\u003e\u003cspan class=\"chip\"\u003eFSMS\u003c/span\u003e\n                \u003cspan class=\"chip\"\u003eHACCP\u003c/span\u003e\u003cspan class=\"chip\"\u003eISMS\u003c/span\u003e\u003cspan class=\"chip\"\u003eITSMS\u003c/span\u003e\u003cspan class=\"chip\"\u003eEnMS\u003c/span\u003e\n              \u003c/td\u003e\n            \u003c/tr\u003e\n          \u003c/tbody\u003e\n        \u003c/table\u003e\n\n        \u003cdiv class=\"sub-title\"\u003e4.1 组织管理体系的整合程度（适用于多体系认证申请）\u003c/div\u003e\n        \u003ctable\u003e\n          \u003ctbody\u003e\n            \u003ctr\u003e\u003cth\u003e级别\u003c/th\u003e\u003ctd\u003e整合程度高（81%-100%）\u003c/td\u003e\u003cth\u003e整合程度（0-100%）\u003c/th\u003e\u003ctd\u003e88%\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\n              \u003cth\u003e组织管理体系情况\u003c/th\u003e\n              \u003ctd colspan=\"3\"\u003e采用一体化管理手册；对体系过程采用一体化方法；内部审核、管理评审、目标指标、文件记录控制及纠正措施统一策划实施；配置统一管理体系协调员和跨领域管理者代表。\u003c/td\u003e\n            \u003c/tr\u003e\n          \u003c/tbody\u003e\n        \u003c/table\u003e\n        \u003ctable class=\"matrix integration-items\"\u003e\n          \u003ccolgroup\u003e\u003ccol class=\"serial-col\"\u003e\u003ccol\u003e\u003c/colgroup\u003e\n          \u003cthead\u003e\u003ctr\u003e\u003cth\u003e序号\u003c/th\u003e\u003cth\u003e已选整合项\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n          \u003ctbody\u003e\n            \u003ctr\u003e\u003ctd class=\"center\"\u003e1\u003c/td\u003e\u003ctd\u003e为一套整合的文件，适宜时，包括适度融合的作业文件。\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003ctd class=\"center\"\u003e2\u003c/td\u003e\u003ctd\u003e考虑总体经营战略和计划的管理评审。\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003ctd class=\"center\"\u003e3\u003c/td\u003e\u003ctd\u003e对内部审核采用一体化的方法。\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003ctd class=\"center\"\u003e4\u003c/td\u003e\u003ctd\u003e对方针和目标采用一体化的方法。\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003ctd class=\"center\"\u003e5\u003c/td\u003e\u003ctd\u003e对体系过程采用一体化的方法。\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003ctd class=\"center\"\u003e6\u003c/td\u003e\u003ctd\u003e对改进机制（纠正和预防措施、测量和持续改进）采用一体化方法。\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003ctd class=\"center\"\u003e7\u003c/td\u003e\u003ctd\u003e一体化的管理支持和管理职责。\u003c/td\u003e\u003c/tr\u003e\n          \u003c/tbody\u003e\n        \u003c/table\u003e\n\n        \u003cdiv class=\"system-block\"\u003e\n          \u003cdiv class=\"system-head\"\u003e\u003cspan\u003eQMS（质量管理体系） #1\u003c/span\u003e\u003c/div\u003e\n          \u003ctable\u003e\n            \u003ctbody\u003e\n              \u003ctr\u003e\u003cth\u003e认证标准\u003c/th\u003e\u003ctd\u003eGB/T 19001-2016 / ISO 9001:2015（必选）；GB/T 50430-2017（建设行业，适用）\u003c/td\u003e\u003cth\u003e认可机构（多选）\u003c/th\u003e\u003ctd\u003eCNAS、UKAS\u003c/td\u003e\u003c/tr\u003e\n              \u003ctr\u003e\u003cth\u003e认证范围\u003c/th\u003e\u003ctd colspan=\"3\"\u003e软件产品设计、开发、运维和技术服务；信息系统集成项目管理服务。\u003c/td\u003e\u003c/tr\u003e\n              \u003ctr\u003e\u003cth\u003e认证范围（英）\u003c/th\u003e\u003ctd colspan=\"3\"\u003eDesign, development, operation and maintenance of software products; information system integration project management services.\u003c/td\u003e\u003c/tr\u003e\n              \u003ctr\u003e\u003cth\u003e是否需要纸质证书\u003c/th\u003e\u003ctd\u003e是\u003c/td\u003e\u003cth\u003e其他对认证（及审核）的要求\u003c/th\u003e\u003ctd\u003e需覆盖总部、研发中心和客户服务点，审核时重点关注项目交付过程控制。\u003c/td\u003e\u003c/tr\u003e\n              \u003ctr\u003e\u003cth\u003e管理体系开始运行时间\u003c/th\u003e\u003ctd\u003e2025-09-01\u003c/td\u003e\u003cth\u003e最近一次内审时间\u003c/th\u003e\u003ctd\u003e2026-05-20\u003c/td\u003e\u003c/tr\u003e\n              \u003ctr\u003e\u003cth\u003e管理体系评审时间\u003c/th\u003e\u003ctd\u003e2026-06-18\u003c/td\u003e\u003cth\u003e认证场所数量\u003c/th\u003e\u003ctd\u003e3\u003c/td\u003e\u003c/tr\u003e\n            \u003c/tbody\u003e\n          \u003c/table\u003e\n          \u003cdiv class=\"sub-title\"\u003e认证场所信息\u003c/div\u003e\n          \u003cdiv class=\"location-title\"\u003e场所：示例科技有限公司\u003c/div\u003e\n          \u003ctable class=\"location-table\"\u003e\n            \u003ctbody\u003e\n              \u003ctr\u003e\u003cth\u003e场所 r\u003e\u003cth\u003e中心职能\u003c/th\u003e\u003ctd\u003e否\u003c/td\u003e\u003cth\u003e是否出子证\u003c/th\u003e\u003ctd\u003e否\u003c/td\u003e\u003c/tr\u003e\n              \u003ctr\u003e\u003cth\u003e联系人\u003c/th\u003e\u003ctd\u003e李二\u003c/td\u003e\u003cth\u003e电话\u003c/th\u003e\u003ctd\u003e13000130000\u003c/td\u003e\u003c/tr\u003e\n              \u003ctr\u003e\u003cth\u003e生产/服务班次\u003c/th\u003e\u003ctd colspan=\"3\"\u003e2 班次，09:00-18:00、18:00-22:00。\u003c/td\u003e\u003c/tr\u003e\n              \u003ctr\u003e\u003cth\u003e各班次的过程、控制方法是否相同？\u003c/th\u003e\u003ctd\u003e相同\u003c/td\u003e\u003cth\u003e说明\u003c/th\u003e\u003ctd\u003e晚班保留测试环境和监控值守。\u003c/td\u003e\u003c/tr\u003e\n              \u003ctr\u003e\u003cth\u003e轮班\u003c/th\u003e\u003ctd\u003e1 组\u003c/td\u003e\u003cth\u003e参与轮班的人数\u003c/th\u003e\u003ctd\u003e6 人\u003c/td\u003e\u003c/tr\u003e\n              \u003ctr\u003e\u003cth\u003e年度综合能耗\u003c/th\u003e\u003ctd\u003e160.00\u003c/td\u003e\u003cth\u003e能耗单位\u003c/th\u003e\u003ctd\u003e吨标煤/年\u003c/td\u003e\u003c/tr\u003e\n              \u003ctr\u003e\u003cth\u003e主要能源使用的数量\u003c/th\u003e\u003ctd\u003e1 SEU\u003c/td\u003e\u003cth\u003e能源种类及数量\u003c/th\u003e\u003ctd\u003e电力 82 万kWh，占比 88%；天然气 2.4 万m³，占比 12%。综合能耗占比合计 100%。\u003c/td\u003e\u003c/tr\u003e\n            \u003c/tbody\u003e\n          \u003c/table\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"sub-title\"\u003e4.2 IS/ITS专项信息\u003c/div\u003e\n        \u003ctable\u003e\n          \u003ctbody\u003e\n            \u003ctr\u003e\u003cth\u003e在客户的信息安全管理体系、信息技术服务管理体系范围内是否有信息资产不允许认证机构接触，或者认证机构在接触相关信息资产时应满足法律要求、相关方的要求和（或）组织自身的要求？\u003c/th\u003e\u003ctd\u003e有\u003c/td\u003e\u003cth\u003e限制说明\u003c/th\u003e\u003ctd\u003e核心客户生产数据和源代码仓库须脱敏或在授权陪同下访问，审计日志不得导出。\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth\u003e在认证周期内，是否允许CNAS在评审过程中接触本组织的相关信息？\u003c/th\u003e\u003ctd\u003e允许\u003c/td\u003e\u003cth\u003e说明\u003c/th\u003e\u003ctd\u003e允许在保密协议和客户授权范围内接触必要记录；不允许项：无。\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth\u003e客户对认证机构的资质、诚信守法记录、认证人员身份背景以及适用的与保守国家秘密或维护国家安全有关的法律法规是否有要求？\u003c/th\u003e\u003ctd\u003e有\u003c/td\u003e\u003cth\u003e要求说明\u003c/th\u003e\u003ctd\u003e审核人员需签署保密承诺，涉及国家秘密或客户敏感信息时按组织安全要求执行。\u003c/td\u003e\u003c/tr\u003e\n          \u003c/tbody\u003e\n        \u003c/table\u003e\n\n      \u003c/section\u003e\n\n      \u003csection class=\"section\"\u003e\n        \u003ch2 class=\"section-title\"\u003e五、其他内容及申请确认\u003c/h2\u003e\n        \u003ctable\u003e\n          \u003ctbody\u003e\n            \u003ctr\u003e\u003cth\u003e公开文件获取方式\u003c/th\u003e\u003ctd colspan=\"3\"\u003e如需进一步了解相关信息，请查阅中国质量认证中心网址 http://www.cqc.com.cn 的公开文件目录或向中心相关人员索取。公开内容包括 CQC 简介及联络信息、认证领域和认证业务、认证制度说明、认证收费标准、申请方和获证方权利义务、申诉投诉和争议渠道、获证方公告方式、管理体系变更通报渠道和要求、未遵守法律法规要求的处理程序、IQNet 及认证合作简介。\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth\u003e申请组织确认\u003c/th\u003e\u003ctd colspan=\"3\"\u003e已确认申请信息真实、完整、有效，并同意按照认证申请、审核及获证后管理要求配合相关工作。\u003c/td\u003e\u003c/tr\u003e\n          \u003c/tbody\u003e\n        \u003c/table\u003e\n      \u003c/section\u003e\n\n      \u003cdiv class=\"org-sign\"\u003e\n        \u003cdiv class=\"org-sign-info\"\u003e\n          \u003cdiv\u003e\u003cstrong\u003e申请组织：\u003c/strong\u003e示例科技有限公司\u003c/div\u003e\n          \u003cdiv\u003e\u003cstrong\u003e日期：\u003c/strong\u003e2026 年 07 月 16 日\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"company-seal\"\u003e\u003cspan\u003e示例科技\u003cbr\u003e有限公司\u003cbr\u003e单位公章\u003c/span\u003e\u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/main\u003e\n  \u003c/div\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n";

        function openPdfPreview(focusIndex) {
            const current = currentSignIndex();
            const idx = typeof focusIndex === 'number' ? focusIndex : (current === -1 ? signNodes.length - 1 : current);
            const node = signNodes[Math.max(0, Math.min(idx, signNodes.length - 1))];
            document.getElementById('pdfPreviewSubtitle').textContent = current === -1 ? '客户签章已完成，当前展示认证申请表预览内容。' : '签章前预览认证申请表内容。';
            const frame = document.getElementById('pdfPreviewFrame');
            if (frame) { frame.removeAttribute('src'); frame.srcdoc = certificationApplicationPreviewHtml; }
            openSignModalById('pdfPreviewModal');
        }

        function downloadPdfDemo() {
            showSignToast('演示下载：认证申请表 PDF 文件');
        }

        document.addEventListener('click', function (event) {
            if (event.target && event.target.classList && event.target.classList.contains('sign-modal-mask')) {
                if (event.target.id === 'pdfPreviewModal') {
                    closePdfPreviewAndReset();
                } else {
                    closeSignModalById(event.target.id);
                }
            }
        });
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                const pdfModal = document.getElementById('pdfPreviewModal');
                if (pdfModal && pdfModal.classList.contains('show')) {
                    closePdfPreviewAndReset();
                    return;
                }
                document.querySelectorAll('.sign-modal-mask.show').forEach(function (modal) { closeSignModalById(modal.id); });
            }
        });
        (function bindFrameLoad() {
            forceTransparentHostFrame();
            setTimeout(forceTransparentHostFrame, 80);
            setTimeout(forceTransparentHostFrame, 300);
            renderTopSignButton();
            setTimeout(openSignModal, 80);
        })();
    </script>
